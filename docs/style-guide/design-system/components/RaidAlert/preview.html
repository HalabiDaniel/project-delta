<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Kalam&display=swap"><style>body{margin:0}.stage{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--paper-100);font-family:var(--font-body);color:var(--ink-900);min-height:100%;box-sizing:border-box}</style></head>
<body><div class="stage pw-root">
<div class="pw-alert" role="alert" style="width:100%;max-width:560px"><span class="pw-alert__badge"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M12 18v2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><div><p class="pw-alert__title">Raid incoming!</p><p class="pw-alert__body">3 bombers from Desk 4 heading for your Workshop.</p></div><span class="pw-alert__eta">0:12</span></div>

<div class="pw-alert pw-alert--win" role="alert" style="width:100%;max-width:560px"><span class="pw-alert__badge"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><p class="pw-alert__title">Mission done</p><p class="pw-alert__body">Workshop bombed. +300 paper.</p></div></div>
</div><script></script></body></html>
