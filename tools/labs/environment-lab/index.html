/* ------------------------------------------------------------------
   Offscreen rendering (thumbnails + 4-angle sheet)
------------------------------------------------------------------ */
let offscreen = null;
function getOffscreen() {
  if (!offscreen) {
    offscreen = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    offscreen.setPixelRatio(1);
    offscreen.outputColorSpace = THREE.SRGBColorSpace;
    offscreen.shadowMap.enabled = true; offscreen.shadowMap.type = THREE.PCFSoftShadowMap;
  }
  return offscreen;
}
function renderAngles(obj, angles, size, bg, elevation = 18) {
  const r = getOffscreen();
  r.setSize(size, size, false);
  setPencilResolution(size, size, Math.max(1, size / 600));
  r.toneMapping = renderer.toneMapping; r.toneMappingExposure = renderer.toneMappingExposure;
  const f = computeFit(obj);
  const prevFit = fit; fitScene(f);
  const dist = f.radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.04;
  const cam = new THREE.PerspectiveCamera(30, 1, dist / 300, dist * 12);
  const el = THREE.MathUtils.degToRad(elevation);
  const prevBg = scene.background;
  scene.background = bg ? new THREE.Color(bg) : null;
  const shown = [], markers = [];
  scene.traverse(o => { if (o.userData.socketMarker) { markers.push([o, o.visible]); o.visible = false; } });
  if (!stage.getObjectById(obj.id) && obj !== stage) { shown.push([stage, stage.visible]); stage.visible = false; }
  const out = angles.map(a => {
    const az = THREE.MathUtils.degToRad(a);
    cam.position.set(f.target.x + dist * Math.cos(el) * Math.sin(az), f.target.y + dist * Math.sin(el), f.target.z + dist * Math.cos(el) * Math.cos(az));
    cam.lookAt(f.target);
    applyCutaway(obj, cam.position, true);
    r.render(scene, cam);
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(r.domElement, 0, 0);
    return c;
  });
  shown.forEach(([c, v]) => c.visible = v);
  markers.forEach(([o, v]) => o.visible = v);
  applyCutaway(current, camera.position, PROP_STATE.cutaway !== false);
  scene.background = prevBg;
  fitScene(prevFit);
  setPencilResolution(host.clientWidth, host.clientHeight);
  return out;
}

async function screenshotSheet() {
  const size = 900, labels = ['FRONT', 'RIGHT', 'BACK', 'LEFT'];
  const frames = renderAngles(current, [0, 90, 180, 270], size, '#2a2928', currentDef.level ? 35 : 18);
  const sheet = document.createElement('canvas');
  sheet.width = size * 4; sheet.height = size;
  const g = sheet.getContext('2d');
  g.fillStyle = '#2a2928'; g.fillRect(0, 0, sheet.width, sheet.height);
  frames.forEach((c, i) => {
    g.drawImage(c, i * size, 0);
    g.fillStyle = 'rgba(236,230,223,.45)';
    g.font = '500 20px "JetBrains Mono", monospace';
    g.textAlign = 'center';
    g.fillText(labels[i], i * size + size / 2, size - 34);
  });
  return new Promise(res => sheet.toBlob(res, 'image/png'));
}

/* ------------------------------------------------------------------
   GLB export (packed into a .zip — .glb isn't an allowed download type)
------------------------------------------------------------------ */
async function exportGLB(obj) {
  const clone = obj.clone(true);
  const strip = [];
  clone.traverse(o => { if (o.userData.helper) strip.push(o); });
  strip.forEach(o => o.parent.remove(o));
  clone.position.set(0, 0, 0);
  const exporter = new GLTFExporter();
  return exporter.parseAsync(clone, { binary: true, onlyVisible: true });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files) { // [{name, data:Uint8Array}] – stored, no compression
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

const MOVE_KEYS = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r',

// View presets, scaled to whatever model is on stage
function viewPreset(name) {

  if (name === 'overview') { cancelTween(); const p = camera.position.clone(), q = controls.target.clone(); resetView(); const p1 = camera.position.clone(), q1 = controls.target.clone(); camera.position.copy(p); controls.target.copy(q); flyTo(p1, q1); return; }
  if (name === 'top') return flyTo(new THREE.Vector3(T.x, b.max.y + R * 2.1, T.z + 0.01), new THREE.Vector3(T.x, b.min.y, T.z));
  if (currentDef?.level) {
    if (name === 'board') return flyTo(new THREE.Vector3(0, 2.1 * M, b.min.z + 0.3 * M), new THREE.Vector3(0, 0.4 * M, 0.9 * M));
    if (name === 'eye') { const z = CLASSROOM.rows[1]; return flyTo(new THREE.Vector3(-0.8 * M + 6, DESK.H + 7, z + DESK.D / 2 + 10), new THREE.Vector3(-0.8 * M, DESK.H + 1, z - 4)); }
  } else {

    if (name === 'eye') return flyTo(new THREE.Vector3(T.x + R * 0.9, b.max.y + 1.2, T.z + R * 1.3), new THREE.Vector3(T.x, b.max.y - 1, T.z));

// Double-click (or double-tap) a surface to orbit around that spot
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  const hit = ray.intersectObject(stage, true).find(h => h.object.isMesh && !h.object.userData.helper && shown(h.object));
  if (!hit) return;
  const off = camera.position.clone().sub(controls.target);
  off.setLength(Math.min(off.length(), Math.max(30, fit.radius * 0.2)));

});

const flyBtn = document.getElementById('btnFly');

function setFly(on) {

const has = k => NAV.keys.has(k) || NAV.keys.has('pad:' + k);
const _f = new THREE.Vector3(), _r = new THREE.Vector3(), _m = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);

function navUpdate(dt) {
  // camera tween (presets, double-click focus)
  if (NAV.tween) {
    const w = NAV.tween; w.t += dt;
    const u = Math.min(1, w.t / w.dur), k = u * u * (3 - 2 * u);
    camera.position.lerpVectors(w.p0, w.p1, k);
    controls.target.lerpVectors(w.q0, w.q1, k);
    if (u >= 1) NAV.tween = null;
  }
  const fast = NAV.keys.has('ShiftLeft') || NAV.keys.has('ShiftRight') ? 3 : 1;

  if (NAV.mode === 'fly') {
    camera.quaternion.setFromEuler(new THREE.Euler(NAV.pitch, NAV.yaw, 0, 'YXZ'));
    _f.set(0, 0, -1).applyQuaternion(camera.quaternion);
    _r.crossVectors(_f, UP).normalize();
    _m.set(0, 0, 0);
    if (has('f')) _m.add(_f); if (has('b')) _m.sub(_f);
    if (has('r')) _m.add(_r); if (has('l')) _m.sub(_r);
    if (has('u')) _m.y += 1; if (has('d')) _m.y -= 1;
    if (has('tl')) NAV.yaw += dt * 1.6; if (has('tr')) NAV.yaw -= dt * 1.6;
    const speed = Math.max(15, fit.radius * 0.2) * fast;
    if (_m.lengthSq()) camera.position.addScaledVector(_m.normalize(), speed * dt);
    clampToRoom(camera.position, 0.6);
    return;
  }

  // orbit mode: move the camera and its target together along the floor
  const off = camera.position.clone().sub(controls.target);
  const dist = off.length();
  _f.copy(off).setY(0).normalize().negate();
  _r.crossVectors(_f, UP).normalize();
  _m.set(0, 0, 0);
  if (has('f')) _m.add(_f); if (has('b')) _m.sub(_f);
  if (has('r')) _m.add(_r); if (has('l')) _m.sub(_r);
  if (_m.lengthSq()) {
    _m.normalize().multiplyScalar(dist * 0.7 * fast * dt);
    camera.position.add(_m); controls.target.add(_m);
  }
  if (has('tl') || has('tr')) {
    off.applyAxisAngle(UP, (has('tl') ? 1 : -1) * dt * 1.4 * fast);
    camera.position.copy(controls.target).add(off);
  }
  if (has('in') || has('out')) {
    const s = Math.exp((has('in') ? -1 : 1) * dt * 1.6 * fast);
    off.multiplyScalar(s); off.setLength(THREE.MathUtils.clamp(off.length(), controls.minDistance, controls.maxDistance));
    camera.position.copy(controls.target).add(off);
  }
  // keep the orbit point inside the model's area (with some margin)
  const before = controls.target.clone();
  clampToRoom(controls.target, 0, fit.radius * 0.25);
  camera.position.add(controls.target.clone().sub(before));
}

function clampToRoom(p, minY = 0, margin = 0) {
  const b = fit.box; if (!b) return;
  const pad = margin + fit.radius * 0.6;
  p.x = THREE.MathUtils.clamp(p.x, b.min.x - pad, b.max.x + pad);
  p.z = THREE.MathUtils.clamp(p.z, b.min.z - pad, b.max.z + pad);
  p.y = THREE.MathUtils.clamp(p.y, b.min.y + minY, b.max.y + fit.radius * 2.5);
}

addEventListener('keyup', e => { if (e.key === 'Shift') NAV.keys.delete(e.code); });

/* ------------------------------------------------------------------
   Guide (generated from the built hierarchy + model notes)
------------------------------------------------------------------ */
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
const guideEl = document.getElementById('guide');
const btnGuide = document.getElementById('btnGuide');

function hierarchyLines(obj) {
  const lines = [];
  const interesting = o => o.userData.part || o.userData.socket || o.userData.node || o.userData.collapse;
  const label = o => {
    let tag = '';
    if (o.userData.socket) tag = '<span class="s">  socket</span>';
    else if (o.userData.collapse) tag = `<span class="s">  ${esc(o.userData.collapse)} instance</span>`;
    else if (o.userData.placeholder) tag = '<span class="j">  placeholder</span>';
    else if (o.userData.part) tag = '<span class="s">  root</span>';
    return esc(o.name) + tag;
  };
  const walk = (o, prefix, isLast, isRoot) => {
    lines.push(isRoot ? label(o) : prefix + (isLast ? '└─ ' : '├─ ') + label(o));
    prefix = isRoot ? '' : prefix + (isLast ? '   ' : '│  ');
    if (o.userData.collapse) return;
    const kids = [];
    const collect = c => { if (c.userData.helper) return; if (interesting(c)) kids.push(c); else c.children.forEach(collect); };
    o.children.forEach(collect);
    // a long run of identical instances collapses to first, …, last
    const shown = kids.length > 6 && kids.every(k => k.userData.collapse) ? [kids[0], kids[1], { gap: kids.length - 3 }, kids[kids.length - 1]] : kids;
    shown.forEach((k, i) => {
      if (k.gap) { lines.push(prefix + '│  ' + `<span class="s">… ${k.gap} more</span>`); return; }
      walk(k, prefix, i === shown.length - 1, false);
    });
  };
  walk(obj, '', true, true);
  return lines.join('\n');
}

function renderGuide() {
  const def = currentDef;
  document.getElementById('guideTitle').textContent = def.name;
  let html = `<h4>Hierarchy</h4><pre>${hierarchyLines(current)}</pre>`;
  if (def.nodes) html += `<h4>Nodes</h4><table><tbody>${def.nodes.map(([n, d]) => `<tr><td><code>${esc(n)}</code></td><td class="note">${esc(d)}</td></tr>`).join('')}</tbody></table>`;
  if (def.layout) {
    const items = def.layout();
    html += `<h4>Layout</h4><ol>
      <li>Every placed module is a record <code>{ id, model, position, rotationY, side, row }</code>. The level download includes it as <code>${esc(def.id)}-layout.json</code> next to the baked GLB.</li>
      <li>For the game, load one copy of each module GLB and place instances from the JSON (16 desks and 16 chairs = 2 mesh sets, each drawn 16 times). The baked GLB is for quick previews.</li>
      <li>Chairs: each sits 47 cm (28 u) behind its desk centre, nudged up to ±7 cm and turned up to ±8.5°; chairs 3, 8, 11 and 14 are pushed out or swung round further.</li><li>Backpacks are records too: <code>model</code> (design), <code>state</code> (open / closed), <code>mode</code> (back · one-strap · floor-stand · floor-lean), <code>colors</code> and the <code>chair</code> they belong to. Straps draped over a chair are built in the chair's space.</li><li>Walls are placed by id with their length and openings (door / window positions along the wall), so the same wall module builds any room.</li></ol>`;
  }
  html += `<h4>Moving around</h4><table><tbody>
    <tr><td><b>Orbit</b></td><td class="note">Left-drag (one finger) to orbit. Right-drag or Shift-drag (two fingers) to pan along the floor. Scroll or pinch zooms towards the cursor.</td></tr>
    <tr><td><b>Keys</b></td><td class="note">WASD / arrows move · Q/E turn · + / − zoom · hold Shift for faster.</td></tr>
    <tr><td><b>Focus</b></td><td class="note">Double-click any desk or spot on the floor to fly there and orbit around it.</td></tr>
    <tr><td><b>Views</b></td><td class="note">1 Overview · 2 Top · 3 Board (teacher's view) · 4 Plane eye (desk height).</td></tr>
    <tr><td><b>Fly (V)</b></td><td class="note">First person: drag to look, WASD to move, Space / C up and down, scroll to move forward, Esc to leave. Phones get on-screen buttons.</td></tr></tbody></table>`;
  html += `<h4>Scale &amp; conventions</h4><ol>${ENV_GUIDE_COMMON.map(x => `<li>${x}</li>`).join('')}</ol>`;
  html += `<h4>Looks</h4><table><tbody>
    <tr><td><b>Design</b></td><td class="note">With pencil: hand-drawn graphite strokes on every hard edge (same as the planes). Plain: clean low-poly.</td></tr>
    <tr><td><b>Texture</b></td><td class="note">Painted: real colours (beech laminate, blue steel, lino). Cardboard and Paper match the plane and building sets.</td></tr>
    <tr><td><b>Keys</b></td><td class="note">P switches Design, T cycles Texture.</td></tr></tbody></table>`;
  document.getElementById('guideBody').innerHTML = html;
}

function setGuide(open) {
  guideEl.hidden = !open;
  btnGuide.setAttribute('aria-expanded', String(open));
}
btnGuide.addEventListener('click', () => setGuide(guideEl.hidden));
document.getElementById('btnGuideClose').addEventListener('click', () => setGuide(false));

/* ------------------------------------------------------------------
   Variant axes + properties card
------------------------------------------------------------------ */
function fileBase() {
  const st = (currentDef.axes || []).some(a => a.key === 'state') ? `-${VARIANT.state}` : '';
  return `${currentDef.id}${st}-${VARIANT.tex}${VARIANT.design === 'pencil' ? '-with-pencil' : ''}`;
}
function renderProps(def) {
  const card = document.getElementById('propsCard'), listEl = document.getElementById('propsList');
  const entries = Object.entries(def.properties || {});
  const axes = def.axes || [];
  card.hidden = !entries.length && !axes.length;
  card.querySelector('.k').textContent = 'Look';
  listEl.innerHTML = '';
  axes.forEach(ax => {
    const lab = document.createElement('div'); lab.className = 'axis-label'; lab.textContent = ax.label;
    listEl.appendChild(lab);
    const seg = document.createElement('div');
    seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', ax.label);
    ax.options.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v.label; b.title = `${ax.label}: ${v.label}`;
      b.setAttribute('aria-pressed', String(v.id === VARIANT[ax.key]));
      b.addEventListener('click', () => { if (v.id !== VARIANT[ax.key]) selectModel(def.id, { [ax.key]: v.id }); });
      seg.appendChild(b);
    });
    listEl.appendChild(seg);
  });
  if (entries.length) { const lab = document.createElement('div'); lab.className = 'axis-label'; lab.textContent = 'Show'; listEl.appendChild(lab); }
  entries.forEach(([k, p]) => {
    if (!(k in PROP_STATE)) PROP_STATE[k] = !!p.default;
    let on = PROP_STATE[k];
    controller?.setProp?.(k, on);
    const b = document.createElement('button');
    b.className = 'btn toggle'; b.setAttribute('aria-pressed', String(on));
    b.innerHTML = '<span class="lbl"></span><span class="pill"></span>';
    b.querySelector('.lbl').textContent = p.label;
    b.addEventListener('click', () => {
      on = PROP_STATE[k] = !on; b.setAttribute('aria-pressed', String(on));
      controller?.setProp?.(k, on);
    });
    listEl.appendChild(b);
  });
}

// Downloads via the artifact runtime
const btnGlb = document.getElementById('btnGlb');
const btnShots = document.getElementById('btnShots');
let downloads = null;

async function save(filename, data) {
  if (!downloads) { toast('Downloads aren’t available in this view'); return; }
  try {
    const r = await downloads.save({ filename, data });
    if (r?.status === 'saved') toast(`Saved ${filename}`);
  } catch (err) {
    if (err?.code === 'declined') toast('Download cancelled');
    else if (err?.code === 'rate_limited') toast('A download prompt is already open');
    else toast('Couldn’t save the file');
  }
}

btnGlb.addEventListener('click', async () => {
  btnGlb.disabled = true;
  try {
    controller?.reset?.();
    const glb = new Uint8Array(await exportGLB(current));
    const files = [{ name: `${fileBase()}.glb`, data: glb }];
    if (currentDef.layout) {
      const json = JSON.stringify({ level: currentDef.id, units: '1 real cm = 0.6 u (game units)', floor: CLASSROOM.floor, items: currentDef.layout() }, null, 2);
      files.push({ name: `${currentDef.id}-layout.json`, data: new TextEncoder().encode(json) });
    }
    await save(`${fileBase()}-glb.zip`, makeZip(files));
  } catch (e) { console.error(e); toast('Export failed'); }
  btnGlb.disabled = !downloads;
});

btnShots.addEventListener('click', async () => {
  btnShots.disabled = true;
  try { await save(`${fileBase()}-4-angles.png`, await screenshotSheet()); }
  catch (e) { console.error(e); toast('Screenshot failed'); }
  btnShots.disabled = !downloads;
});

(async () => {
  for (let i = 0; i < 50 && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 200));
  try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch { downloads = null; }
  btnGlb.disabled = btnShots.disabled = !downloads;
  if (!downloads) { btnGlb.title = btnShots.title = 'Downloads aren’t available in this view'; }
})();

window.__envLab = { get current() { return current; }, camera, controls, MODELS, selectModel, exportGLB, VARIANT };
</script>
