<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Environment Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1c1b; --panel:#262423; --panel2:#2e2b29; --line:#3a3633;
    --text:#ece6df; --muted:#9d958c; --kraft:#c49a6c; --kraft-d:#8a6a47; --dark:#4a4440;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh;height:100dvh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  .brand h1 .box{width:16px;height:16px;background:var(--kraft);border-radius:2px;box-shadow:inset -4px -4px 0 var(--kraft-d)}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:12px}
  .section-label{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 20px 8px}
  .model-list{padding:0 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
  .model-list .section-label{padding:10px 8px 2px}
  .model-item{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px;border-radius:8px;border:1px solid transparent}
  .model-item:hover{background:var(--panel2)}
  .model-item[aria-selected="true"]{background:var(--panel2);border-color:var(--kraft-d)}
  .model-item:focus-visible{outline:2px solid var(--kraft)}
  .thumb{width:44px;height:44px;border-radius:6px;background:#1f1e1d;flex:none;display:grid;place-items:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .model-item .t{font-size:14px;font-weight:500}
  .model-item.soon{opacity:.4;cursor:default}
  .model-item.soon:hover{background:none}
  .model-item.soon .thumb{color:var(--muted);font-size:18px}
  .model-item .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .details{margin-top:auto;border-top:1px solid var(--line);padding-bottom:16px;overflow:auto}
  .details .desc{padding:0 20px;font-size:13px;line-height:1.5;color:#cfc7be}
  .specs{margin:12px 20px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-family:"JetBrains Mono",monospace;font-size:12px}
  .specs dt{color:var(--muted)} .specs dd{margin:0;text-align:right}
  .placeholder{margin:10px 20px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
  main{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#353230 0%,#232120 60%,#1b1a19 100%)}
  #viewport{position:absolute;inset:0}
  #viewport canvas{display:block;outline:none}
  .topbar{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .title-block{pointer-events:auto;min-width:0}
  .title-block h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-only{display:none}
  .guide-about{padding:14px 20px 0;font-size:13.5px;line-height:1.5;color:#cfc7be}
  .guide-about .specs{margin:10px 0 0}
  .title-block .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--kraft)}
  .title-block h2{margin:4px 0 0;font-size:24px;font-weight:600}
  .toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(38,36,35,.92);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
  .toolbar{max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar > *{flex:none}
  .btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
  .btn:hover{background:var(--panel2)}
  .btn:focus-visible{outline:2px solid var(--kraft)}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--kraft);color:#24190d}
  .btn.primary:hover{background:#d2aa7e}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .toggle .pill{width:28px;height:16px;border-radius:99px;background:#4a4542;position:relative;transition:background .15s}
  .toggle .pill::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#d8d0c7;transition:transform .15s}
  .toggle[aria-pressed="true"] .pill{background:var(--kraft)}
  .toggle[aria-pressed="true"] .pill::after{transform:translateX(12px);background:#fff}
  .sep{width:1px;background:var(--line);margin:4px 2px}
  .hint{position:absolute;bottom:26px;right:20px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .top-right{display:flex;gap:10px;align-items:center;pointer-events:auto}
  .btn.ghost{background:rgba(38,36,35,.85);border:1px solid var(--line)}
  .btn.icon{padding:8px}
  .hud{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(38,36,35,.85);border:1px solid var(--line)}
  .hud.on{display:flex}
  .hud::before{content:"";width:8px;height:8px;border-radius:50%;background:#8a8178}
  .hud.on::before{background:var(--kraft)}
  .hud.hot{color:#ffb27a}
  .hud.hot::before{background:#ff7a3c;box-shadow:0 0 8px #ff7a3c}
  .guide{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:rgba(34,32,31,.97);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;backdrop-filter:blur(10px)}
  .guide[hidden]{display:none}
  .guide-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .guide-head .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--kraft)}
  .guide-head h3{margin:4px 0 0;font-size:20px;font-weight:600}
  .guide-body{overflow:auto;padding:4px 20px 28px;font-size:13.5px;line-height:1.55;color:#d9d1c8}
  .guide-body h4{margin:22px 0 8px;font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .guide-body pre{margin:0;background:#1a1918;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.55;overflow:auto;color:#e6ddd2}
  .guide-body pre .j{color:#ffb27a} .guide-body pre .s{color:var(--muted)}
  .guide-body ol{margin:0;padding-left:20px} .guide-body li{margin:4px 0}
  .guide-body code{font-family:"JetBrains Mono",monospace;font-size:12px;background:#1a1918;padding:1px 5px;border-radius:4px;color:#f0c79a}
  .guide-body table{width:100%;border-collapse:collapse;font-size:12.5px}
  .guide-body th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
  .guide-body td{padding:8px 8px 8px 0;border-bottom:1px solid #322f2c;vertical-align:top}
  .guide-body td:first-child{white-space:nowrap}
  .guide-body .note{color:var(--muted);font-size:12.5px}
  .props{position:absolute;top:84px;left:20px;background:rgba(38,36,35,.92);border:1px solid var(--line);border-radius:12px;padding:10px 6px 6px;min-width:200px;max-width:300px;backdrop-filter:blur(8px)}
  .props[hidden]{display:none}
  .props .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
  .props .seg{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 6px}
  .props .seg button{min-width:52px}
  .props .axis-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 8px 4px}
  .props .k{display:none}
  .props .seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 4px;white-space:nowrap;border-radius:7px;font-size:13px;font-weight:600;background:#2e2b29;color:var(--muted);border:1px solid var(--line)}
  .props .seg button[aria-pressed="true"]{background:var(--kraft);color:#24190d;border-color:var(--kraft)}
  .props .seg button:focus-visible{outline:2px solid var(--kraft)}
  .props .seg-note{margin:2px 8px 6px;font-size:12px;line-height:1.45;color:#cfc7be;max-width:240px}
  .props .btn{width:100%;justify-content:space-between;box-sizing:border-box;padding:8px 10px}
  .toast{position:absolute;top:20px;left:50%;transform:translate(-50%,-8px);opacity:0;transition:all .2s;background:#2e2b29;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:1600px){.hint{display:none}}
  body.flying #viewport canvas{cursor:grab}
  .fly-pad{position:absolute;left:14px;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none}
  .fly-pad[hidden]{display:none}
  .pad-grid{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
  .pad-col{display:flex;flex-direction:column;gap:6px}
  .fly-pad button{all:unset;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:rgba(38,36,35,.85);border:1px solid var(--line);color:var(--text);font-size:18px;touch-action:none}
  .fly-pad button:active{background:var(--kraft);color:#24190d}
  #viewport canvas{touch-action:none}
  @media (max-width:820px){.props .axis-label{flex:1 1 100%;padding:2px 2px 0} body.flying .props{display:none}}
  /* ---------- Tablets: slimmer sidebar ---------- */
  @media (max-width:1100px) and (min-width:821px){
    .app{grid-template-columns:240px minmax(0,1fr)}
    .toolbar .btn{padding:8px 10px;font-size:12.5px}
    .hint,.btn .lbl-long{display:none}
    .details{max-height:42%}
  }
  /* ---------- Phones: viewer first ---------- */
  @media (max-width:820px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    aside{min-width:0;border-right:0;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:baseline;gap:10px;padding:max(10px, env(safe-area-inset-top)) 14px 4px}
    .brand h1{font-size:15px}
    .brand p{margin:0;font-size:11px}
    .model-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 10px 10px;gap:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .model-list::-webkit-scrollbar{display:none}
    .model-list .section-label{display:flex;align-items:center;flex:none;padding:0 2px 0 6px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.14em;border-left:1px solid var(--line)}
    .model-list .section-label:first-child{border-left:0}
    .model-item{flex:none;flex-direction:column;gap:4px;padding:5px;width:78px;text-align:center;scroll-snap-align:start}
    .thumb{width:60px;height:60px}
    .model-item .s{display:none}
    .model-item .t{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
    .details{display:none}
    .mobile-only{display:block}
    .topbar{top:10px;left:12px;right:12px;gap:8px}
    .title-block .k{font-size:9.5px}
    .title-block h2{font-size:18px;margin-top:2px}
    .top-right{gap:6px;flex:none}
    #btnGuide{padding:8px}
    #btnGuide .lbl{display:none}
    .hud{font-size:9.5px;padding:6px 8px;letter-spacing:.05em}
    .hint{display:none}
    .btn .lbl-long{display:none}
    .toolbar{left:0;right:0;bottom:0;transform:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;
      overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;gap:4px;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar .btn{flex:none;padding:9px 11px;font-size:12.5px;gap:7px}
    .toolbar .sep{flex:none}
    .props{top:auto;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));min-width:0;padding:6px;border-radius:10px}
    .props .k{display:none}
    #propsList{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .props .seg{flex:1 1 100%;padding:0 0 2px}
    .props .seg button{padding:8px 0}
    .props .seg-note{display:none}
    .props .btn{width:auto;flex:1 1 auto;padding:7px 10px;font-size:12.5px;gap:8px;background:#2e2b29;border-radius:7px}
    .guide{position:fixed;inset:0;width:100%;border-left:0;z-index:20}
    .guide-head{padding-top:max(14px, env(safe-area-inset-top))}
    .guide-body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .guide-body table{font-size:12px}
    .guide-body td:first-child{white-space:normal}
    .toast{top:auto;bottom:calc(66px + env(safe-area-inset-bottom))}
  }
  /* Phones in landscape: slim side list, compact controls */
  @media (max-height:500px) and (max-width:1000px){
    .app{grid-template-columns:190px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
    aside{min-width:0;border-right:1px solid var(--line);border-bottom:0;padding-left:env(safe-area-inset-left)}
    .brand,.details{display:none}
    .model-list{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:6px;gap:2px;scroll-snap-type:none}
    .model-list .section-label{writing-mode:horizontal-tb;transform:none;border-left:0;padding:8px 6px 2px;font-size:9.5px}
    .model-item{width:auto;flex-direction:row;gap:8px;padding:4px 6px;text-align:left}
    .thumb{width:30px;height:30px}
    .model-item .s{display:none}
    .model-item .t{font-size:12px;max-width:none}
    .mobile-only{display:block}
    .topbar{top:8px;left:12px;right:calc(12px + env(safe-area-inset-right))}
    .title-block .k{font-size:9px}
    .title-block h2{font-size:16px;margin-top:2px}
    #btnGuide{padding:7px} #btnGuide .lbl{display:none}
    .hud{font-size:9.5px;padding:5px 8px}
    .hint,.btn .lbl-long{display:none}
    .toolbar{left:8px;right:calc(8px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));transform:none;border-radius:10px;border:1px solid var(--line);
      overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;gap:2px;padding:4px;scrollbar-width:none}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar .btn{flex:none;padding:6px 9px;font-size:12px;gap:6px}
    .toolbar .sep{flex:none}
    .props{top:56px;bottom:auto;left:10px;right:auto;min-width:0;max-width:240px;padding:5px;border-radius:10px}
    .props .k,.props .seg-note{display:none}
    #propsList{display:flex;flex-direction:column;gap:3px}
    .props .seg{padding:0}
    .props .seg button{padding:5px 0;font-size:12px}
    .props .btn{width:100%;padding:5px 8px;font-size:12px}
    .guide{position:fixed;inset:0;width:100%;border-left:0;z-index:20}
    .toast{top:auto;bottom:56px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1><span class="box"></span>Environment Lab</h1>
      <p>paperwars.io · rooms, furniture &amp; levels</p>
    </div>
    <div class="model-list" id="modelList" role="listbox" aria-label="Models"></div>
    <div class="details">
      <div class="section-label">Details</div>
      <div class="desc" id="modelDesc"></div>
      <dl class="specs" id="modelSpecs"></dl>
      <div class="section-label">Current look</div>
      <div class="placeholder" id="variantsBox">None yet</div>
    </div>
  </aside>
  <main>
    <div id="viewport"></div>
    <div class="topbar">
      <div class="title-block"><div class="k" id="modelKicker">Model</div><h2 id="modelTitle">—</h2></div>
      <div class="top-right">
        <div class="hud" id="hud"></div>
        <button class="btn ghost" id="btnGuide" aria-label="Guide" aria-expanded="false" aria-controls="guide"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6M9 11h6"/></svg><span class="lbl">Guide</span></button>
      </div>
    </div>
    <aside class="guide" id="guide" aria-label="Assembly guide" hidden>
      <div class="guide-head"><div><div class="k">Guide</div><h3 id="guideTitle">—</h3></div>
        <button class="btn icon" id="btnGuideClose" aria-label="Close guide"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="guide-about mobile-only" id="guideAbout"></div>
      <div class="guide-body" id="guideBody"></div>
    </aside>
    <div class="props" id="propsCard" hidden><div class="k">Properties</div><div id="propsList"></div></div>
    <div class="toast" id="toast"></div>
    <div class="toolbar">
      <button class="btn toggle" id="btnRotate" aria-pressed="false" title="Toggle auto-rotate (R)"><span class="pill"></span>Auto-rotate</button>
      <button class="btn" id="btnReset" title="Overview (1 / F)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Overview</button>
      <button class="btn" data-view="top" title="Top-down (2)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>Top</button>
      <button class="btn" data-view="board" title="From the board wall (3)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="11" rx="1"/><path d="M8 20l4-5 4 5"/></svg>Board</button>
      <button class="btn" data-view="eye" title="Paper-plane eye level (4)"><svg viewBox="0 0 24 24"><path d="M3 11l18-7-7 18-2-8z"/></svg>Plane eye</button>
      <button class="btn toggle" id="btnFly" aria-pressed="false" title="First-person fly mode (V)"><span class="pill"></span>Fly</button>
      <span class="sep"></span>
      <button class="btn" id="btnShots" disabled title="Front, right, back and left views in one PNG"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Screenshot<span class="lbl-long">&nbsp;×4</span></button>
      <button class="btn primary" id="btnGlb" disabled title="GLB, packed in a .zip"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Download GLB</button>
    </div>
    <div class="hint">WASD move · Q/E turn · V fly · 1–4 views · G guide</div>
    <div class="fly-pad" id="flyPad" hidden>
      <div class="pad-grid">
        <span></span><button data-move="f" aria-label="Forward">▲</button><span></span>
        <button data-move="l" aria-label="Left">◀</button><button data-move="b" aria-label="Back">▼</button><button data-move="r" aria-label="Right">▶</button>
      </div>
      <div class="pad-col"><button data-move="u" aria-label="Up">⤒</button><button data-move="d" aria-label="Down">⤓</button></div>
    </div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Materials: procedural cardboard
------------------------------------------------------------------ */
function makeCardboardTexture(seed = 1, base = [196, 154, 108]) {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  let s = seed * 9301 + 49297;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const n = (rnd() - 0.5) * 18;
      const corr = Math.sin(x / S * Math.PI * 2 * 48) * 3.2;   // corrugation ribs
      const blot = Math.sin(x * 0.013 + y * 0.009) * Math.cos(y * 0.017 - x * 0.004) * 6;
      img.data[i]   = base[0] + n + corr + blot;
      img.data[i+1] = base[1] + n * 0.9 + corr + blot;
      img.data[i+2] = base[2] + n * 0.75 + corr * 0.8 + blot * 0.8;
      img.data[i+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  // fibers
  for (let k = 0; k < 220; k++) {
    g.strokeStyle = `rgba(${rnd() > .5 ? '90,62,35' : '235,205,165'},${0.08 + rnd() * 0.12})`;
    g.lineWidth = 0.6 + rnd();
    const x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI, l = 4 + rnd() * 14;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // edge darkening (torn/folded card edges)
  const grd = g.createLinearGradient(0, 0, 0, S);
  grd.addColorStop(0, 'rgba(80,55,30,.35)'); grd.addColorStop(.05, 'rgba(80,55,30,0)');
  grd.addColorStop(.95, 'rgba(80,55,30,0)'); grd.addColorStop(1, 'rgba(80,55,30,.35)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

let showSockets = true, animateJoints = true, pencilOn = true;

// Textures are generated once per look and shared by every model —
// regenerating 512² canvases per material was slow and memory-hungry on phones.
const TEX_CACHE = new Map();
function cachedTexture(kind, maker, seed, base) {
  const key = `${kind}:${seed}:${base}`;
  if (!TEX_CACHE.has(key)) { const t = maker(seed, base); t.userData.shared = true; TEX_CACHE.set(key, t); }
  return TEX_CACHE.get(key);
}
function cardboardTexture(seed, base) { return cachedTexture('card', makeCardboardTexture, seed, base); }

const OFFSET = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
const MAT = {
  cardboard: () => new THREE.MeshStandardMaterial({ name: 'Cardboard', map: cardboardTexture(3), roughness: 0.92, metalness: 0, flatShading: true, ...OFFSET }),
  cardboardLid: () => new THREE.MeshStandardMaterial({ name: 'CardboardLid', map: cardboardTexture(7, [204, 163, 117]), roughness: 0.9, metalness: 0, flatShading: true, ...OFFSET }),
  rubber: () => new THREE.MeshStandardMaterial({ name: 'DarkTape', color: 0x4a4440, roughness: 0.85, metalness: 0, flatShading: true, ...OFFSET }),
};

/* ------------------------------------------------------------------
   Edge styling – viewer only, stripped from exports
   • Pencil (default): every hard edge redrawn as 2–3 graphite strokes,
     never running past the corners, like a sketch.
   • Seams: the plain thin fold lines (shown when Pencil is off).
------------------------------------------------------------------ */
const PENCIL = {
  heavy: new LineMaterial({ color: 0x2a2623, linewidth: 2.6, transparent: true, opacity: 0.92, depthWrite: false }),
  light: new LineMaterial({ color: 0x3a342f, linewidth: 1.6, transparent: true, opacity: 0.6, depthWrite: false }),
};
Object.values(PENCIL).forEach(m => { m.userData.shared = true; m.userData.baseWidth = m.linewidth; });
function setPencilResolution(w, h, widthScale = 1) {
  Object.values(PENCIL).forEach(m => { m.resolution.set(w, h); m.linewidth = m.userData.baseWidth * widthScale; });
}

let pencilSeed = 1337;
const prand = () => ((pencilSeed = (pencilSeed * 16807) % 2147483647) / 2147483647);

function makePencil(edges, k = 1) {
  const src = edges.attributes.position.array;
  const heavy = [], light = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), d = new THREE.Vector3(), j = new THREE.Vector3();
  const jitter = amt => j.set(prand() - 0.5, prand() - 0.5, prand() - 0.5).multiplyScalar(amt * 2);
  // Strokes never extend past the edge's endpoints: they start/stop at the
  // corner or a little short of it (inset), so nothing pokes out of the model.
  const stroke = (out, wobble, inset) => {
    const len = d.subVectors(b, a).length();
    d.normalize();
    const maxIn = Math.min(inset, len * 0.2);
    const p = a.clone().addScaledVector(d, prand() * maxIn).add(jitter(wobble));
    const q = b.clone().addScaledVector(d, -prand() * maxIn).add(jitter(wobble));
    out.push(p.x, p.y, p.z, q.x, q.y, q.z);
  };
  for (let i = 0; i < src.length; i += 6) {
    a.fromArray(src, i); b.fromArray(src, i + 3);
    stroke(heavy, 0.0015 * k, 0);                      // firm line, corner to corner
    stroke(light, 0.003 * k, 0.05 * k);                // looser pass, stops short
    if (prand() < 0.45) stroke(light, 0.004 * k, 0.09 * k); // occasional extra pass
  }
  const g = new THREE.Group();
  g.userData.helper = true; g.userData.pencil = true;
  g.visible = pencilOn;
  [[heavy, PENCIL.heavy], [light, PENCIL.light]].forEach(([arr, mat]) => {
    const geo = new LineSegmentsGeometry(); geo.setPositions(arr);
    const l = new LineSegments2(geo, mat);
    l.userData.helper = true;
    l.renderOrder = 2;
    g.add(l);
  });
  return g;
}

function addSeams(mesh, color = 0x6e5234, opacity = 0.55, threshold = 25, k = 1) {
  const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const e = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  e.userData.helper = true; e.userData.seam = true;
  e.visible = false;                                  // Plain design = no lines at all
  mesh.add(e);
  mesh.add(makePencil(edges, k));
  return mesh;
}

// Bounding box of the solid geometry only (ignores strokes, markers)
function solidBox(obj) {
  const box = new THREE.Box3(), tmp = new THREE.Box3();
  obj.updateWorldMatrix(true, true);                 // include parents (stage lift / hover)
  obj.traverse(o => {
    if (!o.isMesh || o.userData.helper) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
    box.union(tmp);
  });
  return box;
}

/* ------------------------------------------------------------------
   Sockets & assembly
   A socket is an empty node named "socket_<name>". It is exported in
   the GLB so the game can find it and parent the next part to it.
------------------------------------------------------------------ */
function makeSocket(name, x, y, z, size = 0.07) {
  const s = new THREE.Object3D();
  s.name = `socket_${name}`;
  s.userData.socket = name;
  s.position.set(x, y, z);
  const marker = new THREE.Mesh(
    new THREE.OctahedronGeometry(size),
    new THREE.MeshBasicMaterial({ color: 0xff9a3c, wireframe: true, depthTest: false, transparent: true })
  );
  marker.renderOrder = 10;
  marker.userData.helper = true;
  marker.userData.socketMarker = true;
  marker.visible = showSockets;
  s.add(marker);
  return s;
}

function finishPart(root) {
  root.traverse(o => { if (o.isMesh && !o.userData.helper) { o.castShadow = true; o.receiveShadow = true; } });
}

function findSocket(obj, name) {
  let found = null;
  obj.traverse(o => { if (!found && o.userData.socket === name) found = o; });
  return found;
}

// Builds parts in order; each one after the first plugs into the named socket
function buildAssembly(parts, level) {
  let root = null;
  for (const p of parts) {
    const part = MODELS.find(m => m.id === p.model).build(level);
    if (!root) { root = part; continue; }
    const socket = findSocket(root, p.socket);
    if (!socket) { console.warn('Missing socket', p.socket); continue; }
    if (/_\d+$/.test(p.socket) || root.getObjectByName(part.name)) {           // e.g. 6× Rocket → Rocket_0…5
      const m = /(\d+)$/.exec(p.socket); part.name += '_' + (m ? m[1] : root.id);
    }
    socket.add(part);
    socket.children.filter(c => c.userData.socketMarker).forEach(m => m.userData.occupied = true);
  }
  root.traverse(o => { if (o.userData.occupied) o.visible = false; });
  return root;
}

/* ------------------------------------------------------------------
   Plane skins — Cardboard (default), Grey paper, Paper
------------------------------------------------------------------ */
function makePaperTexture(seed = 5, base = [236, 231, 220]) {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  let s = seed * 7919 + 104729;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const n = (rnd() - 0.5) * 9;
    const cloud = Math.sin(x * 0.021 + y * 0.013) * Math.cos(y * 0.019 - x * 0.007) * 4;
    img.data[i] = base[0] + n + cloud; img.data[i + 1] = base[1] + n + cloud; img.data[i + 2] = base[2] + n * 0.9 + cloud;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < 260; k++) {                     // short paper fibres
    g.strokeStyle = `rgba(${rnd() > .5 ? '110,104,96' : '255,255,250'},${0.05 + rnd() * 0.08})`;
    g.lineWidth = 0.5 + rnd() * 0.6;
    const x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI, l = 3 + rnd() * 9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
const paperTex = (seed, base) => cachedTexture('paper', makePaperTexture, seed, base);

/* ------------------------------------------------------------------
   ENVIRONMENT SCALE
   GAME scale, set by the planes and buildings: 1 cm of the real room
   = 0.6 u. A desk top (65 × 50 cm) is 39 × 30 u — a whole base that
   holds a 13 u runway, 3–5 u buildings and 4 u planes. The room keeps
   real proportions; only this one number sets its size.
------------------------------------------------------------------ */
const CM = 0.6;                       // units per real centimetre
const ENV_PENCIL = 20 * CM;           // stroke wobble/inset multiplier at this scale

/* Extra procedural textures for the environment ------------------- */
function makeWoodTexture(seed = 11, base = [214, 178, 128]) {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  let s = seed * 7331 + 17;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const warp = Math.sin(x * 0.006 + y * 0.004) * 9 + Math.sin(x * 0.021) * 2;
    const ring = Math.sin((y + warp) * 0.19) * 0.5 + 0.5;       // grain runs along U (x)
    const fine = Math.sin((y + warp * 0.5) * 1.3 + x * 0.002) * 2;
    const n = (rnd() - 0.5) * 8;
    const k = ring * 13 + fine + n;
    img.data[i] = base[0] - k; img.data[i + 1] = base[1] - k * 0.95; img.data[i + 2] = base[2] - k * 0.8;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < 40; k++) {                     // a few darker grain streaks
    g.strokeStyle = `rgba(120,80,40,${0.05 + rnd() * 0.08})`;
    g.lineWidth = 0.6 + rnd() * 1.2;
    const y = rnd() * S;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= S; x += 32) g.lineTo(x, y + Math.sin(x * 0.01 + k) * 4);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}

// 4 × 4 linoleum tiles per texture repeat (one tile = 6 u = 30 cm)
function makeTileTexture(seed = 3, base = [184, 190, 184]) {
  const S = 512, T = S / 4, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  let s = seed * 4211 + 71;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4;
    const alt = ((Math.floor(x / T) + Math.floor(y / T)) % 2) ? 9 : 0;
    const fleck = rnd() < 0.015 ? (rnd() - 0.5) * 50 : 0;
    const n = (rnd() - 0.5) * 6 + fleck;
    img.data[i] = base[0] - alt + n; img.data[i + 1] = base[1] - alt + n; img.data[i + 2] = base[2] - alt * 0.6 + n;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(70,72,70,.35)'; g.lineWidth = 2;
  for (let k = 0; k <= 4; k++) {
    g.beginPath(); g.moveTo(k * T, 0); g.lineTo(k * T, S); g.stroke();
    g.beginPath(); g.moveTo(0, k * T); g.lineTo(S, k * T); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const woodTex = (seed, base) => cachedTexture('wood', makeWoodTexture, seed, base);
const tileTex = (seed, base) => cachedTexture('tile', makeTileTexture, seed, base);

/* World-scale UVs (non-indexed geometry): the texture keeps the same
   size on a 0.6 u leg and a 180 u floor, nothing gets stretched. */
function envUV(g, s = 1 / 16) {
  const p = g.attributes.position.array, uv = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < p.length; i += 9) {
    a.fromArray(p, i); b.fromArray(p, i + 3); c.fromArray(p, i + 6);
    n.subVectors(b, a).cross(c.clone().sub(a));
    const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
    for (let k = 0; k < 9; k += 3) {
      const x = p[i + k], y = p[i + k + 1], z = p[i + k + 2];
      if (ay >= ax && ay >= az) uv.push(x * s, z * s);
      else if (ax >= az) uv.push(z * s, y * s);
      else uv.push(x * s, y * s);
    }
  }
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

/* Box helper: size + centre, ready for merging */
function bx(w, h, d, x, y, z) {
  const g = new THREE.BoxGeometry(w, h, d).toNonIndexed();
  g.translate(x, y, z);
  return g;
}
function mergedMesh(name, geos, mat, uvScale = 1 / 16) {
  const g = BufferGeometryUtils.mergeGeometries(geos.map(x => { x.deleteAttribute('uv'); x.clearGroups(); return x; }));
  envUV(g, uvScale);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.name = name; m.userData.node = true;
  return m;
}

/* ------------------------------------------------------------------
   Variant axes shared by every environment model
   • Design:  Plain (clean low-poly) | With pencil (sketched edges)
   • Texture: Painted (real colours) | Cardboard | Paper
------------------------------------------------------------------ */
const DESIGNS = [{ id: 'pencil', label: 'With pencil' }, { id: 'plain', label: 'Plain' }];
const TEXTURES = [{ id: 'painted', label: 'Painted' }, { id: 'cardboard', label: 'Cardboard' }, { id: 'paper', label: 'Paper' }];
const ENV_AXES = [
  { key: 'design', label: 'Design', options: DESIGNS },
  { key: 'tex', label: 'Texture', options: TEXTURES },
];
const BAG_AXES = [...ENV_AXES, { key: 'state', label: 'State', options: [{ id: 'closed', label: 'Closed' }, { id: 'open', label: 'Open' }] }];

// One material per (texture, role), shared by every copy of every model
const ENV_MAT_CACHE = new Map();
function std(name, opts) {
  const m = new THREE.MeshStandardMaterial({ name, roughness: 0.9, metalness: 0, flatShading: true, ...OFFSET, ...opts });
  m.userData.shared = true;
  return m;
}
const ENV_LOOKS = {
  painted: {
    top:    () => std('Desk_Laminate', { map: woodTex(11) }),
    edge:   () => std('Desk_EdgeBand', { color: 0x8c5e34, roughness: 0.7 }),
    metal:  () => std('Steel_Blue', { color: 0x4f7091, roughness: 0.5, metalness: 0.25 }),
    tray:   () => std('Plastic_Grey', { color: 0x6b737a, roughness: 0.75 }),
    rubber: () => std('Rubber', { color: 0x2c2a28, roughness: 0.95 }),
    floor:  () => std('Floor_Lino', { map: tileTex(3), roughness: 0.8 }),
    paper:  () => std('Paper_White', { map: paperTex(5), side: THREE.DoubleSide }),
    seam: 0x2a2623,
  },
  cardboard: {
    top:    () => std('Card_Top', { map: cardboardTexture(7, [204, 163, 117]) }),
    edge:   () => std('Card_Edge', { map: cardboardTexture(4, [160, 120, 80]) }),
    metal:  () => std('Card_Frame', { map: cardboardTexture(9, [150, 112, 76]) }),
    tray:   () => std('Card_Tray', { map: cardboardTexture(3) }),
    rubber: () => std('DarkTape', { color: 0x4a4440 }),
    floor:  () => std('Card_Floor', { map: cardboardTexture(13, [176, 140, 100]) }),
    paper:  () => std('Paper_White', { map: paperTex(5), side: THREE.DoubleSide }),
    seam: 0x6e5234,
  },
  paper: {
    top:    () => std('Paper_Top', { map: paperTex(5) }),
    edge:   () => std('Paper_Edge', { map: paperTex(9, [196, 193, 186]) }),
    metal:  () => std('Paper_Frame', { map: paperTex(9, [150, 150, 152]) }),
    tray:   () => std('Paper_Tray', { map: paperTex(4, [214, 211, 204]) }),
    rubber: () => std('Paper_Dark', { color: 0x55524e }),
    floor:  () => std('Paper_Floor', { map: paperTex(21, [224, 220, 210]) }),
    paper:  () => std('Paper_Sheet', { map: paperTex(5, [246, 244, 238]), side: THREE.DoubleSide }),
    seam: 0x3c3e42,
  },
};
function envMat(tex, role) {
  const key = tex + ':' + role;
  if (!ENV_MAT_CACHE.has(key)) ENV_MAT_CACHE.set(key, ENV_LOOKS[tex][role]());
  return ENV_MAT_CACHE.get(key);
}
function envFinish(mesh, tex) {
  mesh.castShadow = mesh.receiveShadow = true;
  addSeams(mesh, ENV_LOOKS[tex].seam, 0.55, 25, ENV_PENCIL);
  return mesh;
}

/* ------------------------------------------------------------------
   Model: School Desk (single student desk)
   Real proportions (65 × 50 cm top, 72 cm high) at GAME scale:
   1 cm = 0.6 u, so the top is 39 × 30 u, a whole base. It fits a
   level-3 runway (13 u), the Model Lab buildings (≈ 3–5 u) and the
   4 u planes with room to spare.
   Origin on the floor under the centre of the top. The student sits
   on +Z (open side of the book tray); the board is towards −Z.
------------------------------------------------------------------ */
const c = cm => cm * CM;
const DESK = { W: c(65), D: c(50), H: c(72), T: c(2.5), leg: c(3) };
const DESK_UV = 1 / c(80);

function buildDesk(v = {}) {
  const tex = v.tex || 'painted';
  const { W, D, H, T, leg } = DESK;
  const root = new THREE.Group();
  root.name = 'SchoolDesk';
  root.userData.part = true;

  // Top: laminate on the upper face, darker edge band all round
  const topGeo = new THREE.BoxGeometry(W, T, D).toNonIndexed();
  topGeo.translate(0, H - T / 2, 0);
  envUV(topGeo, DESK_UV);
  const top = new THREE.Mesh(topGeo, [envMat(tex, 'edge'), envMat(tex, 'edge'), envMat(tex, 'top'), envMat(tex, 'edge'), envMat(tex, 'edge'), envMat(tex, 'edge')]);
  top.name = 'Desk_Top'; top.userData.node = true;
  root.add(envFinish(top, tex));

  // Raised pencil lip along the back edge of the top
  root.add(envFinish(mergedMesh('Desk_Groove', [bx(c(50), c(0.3), c(2.75), 0, H + c(0.15), -D / 2 + c(4.5))], envMat(tex, 'edge'), DESK_UV), tex));

  // Steel frame: 4 legs, side aprons, foot rails, back bar, bag hook
  const lx = W / 2 - c(4.5), lz = D / 2 - c(4.5), legTop = H - T, foot = c(1.5);
  const f = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) f.push(bx(leg, legTop - foot, leg, sx * lx, foot + (legTop - foot) / 2, sz * lz));
  for (const sx of [-1, 1]) {
    f.push(bx(c(2), c(6), 2 * lz + leg, sx * lx, legTop - c(3), 0));       // apron under the top
    f.push(bx(leg * 0.8, leg * 0.8, 2 * lz, sx * lx, c(9), 0));            // foot rail
  }
  f.push(bx(2 * lx, leg * 0.8, leg * 0.8, 0, c(26), -lz));                 // back bar
  f.push(bx(c(1.25), c(4.5), c(1.25), lx + c(1.6), legTop - c(7), c(4.5)));     // bag hook: stem…
  f.push(bx(c(3), c(1.25), c(1.25), lx + c(2.75), legTop - c(9.25), c(4.5)));   // …and lip
  root.add(envFinish(mergedMesh('Desk_Frame', f, envMat(tex, 'metal'), DESK_UV), tex));

  // Book tray under the top, open towards the student (+Z)
  const tw = 2 * (lx - c(2.25)), tz0 = -lz + c(1.75), tz1 = lz - c(6), th = c(14), ty = legTop - c(1) - th, p = c(1.25);
  const tray = [
    bx(tw, p, tz1 - tz0, 0, ty, (tz0 + tz1) / 2),
    bx(tw, th, p, 0, ty + th / 2, tz0),
    bx(p, th, tz1 - tz0, -tw / 2, ty + th / 2, (tz0 + tz1) / 2),
    bx(p, th, tz1 - tz0, tw / 2, ty + th / 2, (tz0 + tz1) / 2),
  ];
  root.add(envFinish(mergedMesh('Desk_Tray', tray, envMat(tex, 'tray'), DESK_UV), tex));

  // Rubber feet
  const feet = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) feet.push(bx(leg + c(1.25), foot, leg + c(1.25), sx * lx, foot / 2, sz * lz));
  root.add(envFinish(mergedMesh('Desk_Feet', feet, envMat(tex, 'rubber'), DESK_UV), tex));

  // Sockets for modular props
  root.add(makeSocket('top', 0, H, 0, c(3)));                // the base / props sit here
  root.add(makeSocket('chair', 0, 0, c(47), c(3)));         // where a chair goes
  root.add(makeSocket('bag', lx + c(3.5), legTop - c(9.25), c(4.5), c(2)));
  root.userData.footprint = [W, D];
  return root;
}

/* ------------------------------------------------------------------
   Model: School Chair (matches the desk)
   Real size: seat 40 × 38 cm at 43 cm, backrest top at 80 cm, at the
   same game scale (1 cm = 0.6 u). Origin on the floor under the seat
   centre. The sitter faces −Z (towards the desk and the board); the
   backrest is on +Z.
------------------------------------------------------------------ */
const CHAIR = { W: c(41), D: c(40), SH: c(43), BH: c(84), tube: c(1.1) };

/* Bent plate: a flat outline (x, y) given thickness along +Z, then bent
   by f(x, y) → z offset. Used for the moulded seat and backrest shells. */
function bentPlate(outline, thick, bend) {
  if (THREE.ShapeUtils.isClockWise(outline.map(([x, y]) => new THREE.Vector2(x, y)))) outline = outline.slice().reverse();
  const tris = THREE.ShapeUtils.triangulateShape(outline.map(([x, y]) => new THREE.Vector2(x, y)), []).map(([a, b, d]) => {
    const [ax, ay] = outline[a], [bx_, by] = outline[b], [dx_, dy] = outline[d];
    return (bx_ - ax) * (dy - ay) - (by - ay) * (dx_ - ax) < 0 ? [a, d, b] : [a, b, d];   // force CCW
  });
  const P = [], fr = ([x, y]) => [x, y, bend(x, y)], bk = ([x, y]) => [x, y, bend(x, y) + thick];
  for (const [a, b, d] of tris) {
    P.push(...fr(outline[a]), ...fr(outline[d]), ...fr(outline[b]));   // front face (towards −Z)
    P.push(...bk(outline[a]), ...bk(outline[b]), ...bk(outline[d]));   // back face
  }
  const n = outline.length;
  for (let i = 0; i < n; i++) {
    const p = outline[i], q = outline[(i + 1) % n];
    P.push(...fr(p), ...fr(q), ...bk(q), ...fr(p), ...bk(q), ...bk(p));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.computeVertexNormals();
  return g;
}
// Rounded trapezoid outline (wBottom at y=0, wTop at y=h), corner radius r
function roundTrap(wB, wT, h, rB, rT, seg = 3) {
  const pts = [];
  const corner = (cx, cy, r, a0) => { for (let k = 0; k <= seg; k++) { const a = a0 + (k / seg) * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  corner(wB / 2 - rB, rB, rB, -Math.PI / 2);
  corner(wT / 2 - rT, h - rT, rT, 0);
  corner(-wT / 2 + rT, h - rT, rT, Math.PI / 2);
  corner(-wB / 2 + rB, rB, rB, Math.PI);
  return pts;
}
// Tube between two points (6-sided, low-poly chrome rod)
function tubeGeo(a, b, r) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const g = new THREE.CylinderGeometry(r, r, d.length(), 6, 1).toNonIndexed();
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()));
  g.translate((A.x + B.x) / 2, (A.y + B.y) / 2, (A.z + B.z) / 2);
  return g;
}
function polyTube(pts, r) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) out.push(tubeGeo(pts[i], pts[i + 1], r));
  for (let i = 1; i < pts.length - 1; i++) { const s = new THREE.SphereGeometry(r, 6, 3).toNonIndexed(); s.translate(...pts[i]); out.push(s); }  // bend knuckles
  return out;
}

/* ------------------------------------------------------------------
   Model: School Chair (moulded shell, chrome frame)
   After the reference photo: a moulded black seat with a rolled front
   edge and a curved backrest on two chrome posts; four splayed chrome
   legs, each side one bent tube (front leg → under-seat rail → rear
   leg), with grey glides. Real: seat 41 × 40 cm at 43 cm, back top at
   84 cm. Origin on the floor under the seat; the sitter faces −Z.
------------------------------------------------------------------ */
function buildChair(v = {}) {
  const tex = v.tex || 'painted';
  const root = new THREE.Group(); root.name = 'SchoolChair'; root.userData.part = true;
  const r = c(1.1), SH = CHAIR.SH;

  // Seat shell: outline in (x, y=front→back), bent (dished, rolled front), laid flat
  const seatOut = roundTrap(c(42), c(37), c(40), c(6), c(8)).map(([x, y]) => [x, c(20) - y]);  // front (wide) at y = +20
  const seat = bentPlate(seatOut, c(1.8), (x, y) => {
    const dish = (x / c(21)) ** 2 * c(1.6);                 // sides rise a little
    const roll = y > c(12) ? -(((y - c(12)) / c(8)) ** 2) * c(3.5) : 0;   // waterfall front edge
    const back = y < -c(14) ? ((-c(14) - y) / c(6)) * c(1.2) : 0;       // back lip rises
    return dish + roll + back;
  });
  seat.rotateX(-Math.PI / 2);                               // outline y → −Z (front), bend → +Y (up)
  seat.rotateX(0.06);                                       // tilt back slightly (front edge higher)
  seat.translate(0, SH - c(1.8), 0);
  envUV(seat, DESK_UV);
  const seatM = new THREE.Mesh(seat, envMat(tex, 'shell')); seatM.name = 'Chair_Seat'; seatM.userData.node = true;
  root.add(envFinish(seatM, tex));

  // Backrest: wider at the top, curved around the sitter, leaning back ~12°
  const backOut = roundTrap(c(33), c(41), c(22), c(3), c(8));
  const back = bentPlate(backOut, c(1.6), (x) => -((x / c(20)) ** 2) * c(3.2));   // edges wrap forward
  back.translate(0, -c(11), 0);
  back.rotateX(0.21);
  back.translate(0, c(74), c(21));
  envUV(back, DESK_UV);
  const backM = new THREE.Mesh(back, envMat(tex, 'shell')); backM.name = 'Chair_Back'; backM.userData.node = true;
  root.add(envFinish(backM, tex));

  // Chrome frame
  const f = [], y = SH - c(3.2);
  for (const s of [-1, 1]) {
    f.push(...polyTube([[s * c(22), c(1.5), -c(24)], [s * c(17.5), y, -c(15)], [s * c(17.5), y, c(13)], [s * c(22.5), c(1.5), c(23)]], r));  // front leg → rail → rear leg
    f.push(...polyTube([[s * c(15), y, c(9)], [s * c(15), y + c(0.5), c(21.5)], [s * c(14.5), c(70), c(19.8)], [s * c(14.5), c(78), c(21.4)]], r));  // back post, behind the seat
  }
  f.push(tubeGeo([-c(17.5), y, -c(14)], [c(17.5), y, -c(14)], r * 0.9));    // front cross brace
  f.push(tubeGeo([-c(15), y, c(9)], [c(15), y, c(9)], r * 0.9));            // rear cross brace
  root.add(envFinish(mergedMesh('Chair_Frame', f, envMat(tex, 'chrome'), DESK_UV), tex));

  const glides = [];
  for (const [x, z] of [[-22, -24], [22, -24], [-22.5, 23], [22.5, 23]]) {
    const g = new THREE.CylinderGeometry(c(1.5), c(1.7), c(1.5), 6).toNonIndexed(); g.translate(c(x), c(0.75), c(z)); glides.push(g);
  }
  root.add(envFinish(mergedMesh('Chair_Glides', glides, envMat(tex, 'glide'), DESK_UV), tex));
  root.add(makeSocket('seat', 0, SH, 0, c(3)));
  return root;
}

// Chair placement behind a desk: tucked-in distance + realistic mess
const CHAIR_BEHIND = c(47);                            // desk centre → chair centre, neatly placed
function chairPlacement(i, rnd) {
  let dx = rnd() * c(14), dz = c(-2) + rnd() * c(14), rot = rnd() * 0.3;   // ±7 cm, ±8.5°
  // a few chairs left properly askew: swung out, pushed back, turned to talk to a neighbour
  const odd = { 2: [c(10), c(14), 0.45], 7: [-c(8), c(20), -0.38], 10: [c(4), c(9), 0.62], 13: [-c(12), c(16), -0.5] }[i];
  if (odd) { dx = odd[0]; dz = odd[1]; rot = odd[2]; }
  return { dx, dz: CHAIR_BEHIND + Math.max(c(-3), dz), rot };
}

/* ------------------------------------------------------------------
   Model: Wall (modular panel, any length, optional door)
   Built along local X, inside face at z = 0 facing +Z, thickness out
   to −Z, floor at y = 0. Real: 3 m high, 12 cm thick, sage wainscot
   to 1 m with a chair rail, cream paint above, dark skirting.
   Door: 1 m opening (90 cm leaf, 2.05 m), hinged on the −X side.
------------------------------------------------------------------ */
const WALL = { H: c(300), T: c(12), WS: c(100) };
// Door: 95 × 210 cm leaf in a 3 cm lining; the wall hole is sized from the leaf
const DOOR = { leafW: c(95), leafH: c(210), leafT: c(4.5), gap: c(0.4), lining: c(3), arch: c(8) };
DOOR.W = DOOR.leafW + 2 * (DOOR.gap + DOOR.lining);
DOOR.H = DOOR.leafH + DOOR.gap + DOOR.lining;
// Window: 160 × 140 cm, sill at 105 cm (just above the chair rail)
const WIN = { W: c(160), H: c(140), Y: c(105) };

function buildWall(v = {}, { len = c(400), door = null, windows = [], name = 'Wall' } = {}) {
  const tex = v.tex || 'painted';
  const { H, T, WS } = WALL;
  const root = new THREE.Group(); root.name = name; root.userData.part = true;
  const UV = 1 / c(80);
  const holes = [];
  if (door) holes.push({ x: door.x, w: DOOR.W, y0: 0, y1: DOOR.H, pad: DOOR.arch });
  windows.forEach(wx => holes.push({ x: wx, w: WIN.W, y0: WIN.Y, y1: WIN.Y + WIN.H, pad: c(4) }));

  // Pieces of a horizontal band [b0, b1] with every hole cut out (padPad widens holes, for trim)
  const band = (b0, b1, padded = false) => {
    const xs = new Set([-len / 2, len / 2]);
    holes.forEach(h => { const p = padded ? h.pad : 0; xs.add(h.x - h.w / 2 - p); xs.add(h.x + h.w / 2 + p); });
    const X = [...xs].filter(x => x >= -len / 2 && x <= len / 2).sort((a, b) => a - b), out = [];
    for (let i = 0; i < X.length - 1; i++) {
      const x0 = X[i], x1 = X[i + 1], mid = (x0 + x1) / 2;
      const h = holes.find(h => { const p = padded ? h.pad : 0; return mid > h.x - h.w / 2 - p && mid < h.x + h.w / 2 + p; });
      if (!h) { out.push([x0, x1, b0, b1]); continue; }
      const lo = padded ? h.y0 - (h.y0 > 0 ? h.pad : 0) : h.y0, hi = padded ? h.y1 + h.pad : h.y1;
      if (lo > b0) out.push([x0, x1, b0, Math.min(b1, lo)]);
      if (hi < b1) out.push([x0, x1, Math.max(b0, hi), b1]);
    }
    return out;
  };
  const slab = (sp, depth, z) => sp.filter(([x0, x1, y0, y1]) => x1 - x0 > 0.01 && y1 - y0 > 0.01)
    .map(([x0, x1, y0, y1]) => bx(x1 - x0, y1 - y0, depth, (x0 + x1) / 2, (y0 + y1) / 2, z));

  root.add(envFinish(mergedMesh(`${name}_Wainscot`, slab(band(0, WS), T, -T / 2), envMat(tex, 'wainscot'), UV), tex));
  root.add(envFinish(mergedMesh(`${name}_Upper`, slab(band(WS, H), T, -T / 2), envMat(tex, 'wall'), UV), tex));
  root.add(envFinish(mergedMesh(`${name}_Skirting`, slab(band(0, c(10), true), c(1.5), c(0.75)), envMat(tex, 'edge'), UV), tex));
  root.add(envFinish(mergedMesh(`${name}_ChairRail`, slab(band(WS - c(2), WS + c(2), true), c(2), c(1)), envMat(tex, 'trim'), UV), tex));

  windows.forEach((wx, i) => root.add(buildWindow(tex, wx, `${name}_Window${windows.length > 1 ? '_' + (i + 1) : ''}`)));
  if (door) root.add(buildDoor(tex, door.x, name));
  root.userData.wallLength = len;
  return root;
}

/* Door: lining + stops, double architrave on both faces, threshold, and a
   hinged leaf with stiles/rails, a raised lower panel, a glazed upper
   panel with beads, 3 hinges, lever handles on roses, key escutcheons
   and a kick plate. Hinge on the −X side; swings into the room. */
function buildDoor(tex, dx, name) {
  const { T } = WALL, { leafW: L, leafH: LH, leafT: LT, gap, lining, arch, W, H } = DOOR;
  const UV = 1 / c(80), grp = new THREE.Group(); grp.name = `${name}_Door`; grp.userData.node = true;
  const hw = W / 2, trim = [];
  // lining through the wall + door stop strip on the corridor side of the leaf
  trim.push(bx(lining, H, T, dx - hw + lining / 2, H / 2, -T / 2), bx(lining, H, T, dx + hw - lining / 2, H / 2, -T / 2), bx(W, lining, T, dx, H - lining / 2, -T / 2));
  const stopZ = -T / 2 - LT / 2 - c(0.8);
  trim.push(bx(c(1.5), H - lining, c(1.6), dx - hw + lining + c(0.75), (H - lining) / 2, stopZ), bx(c(1.5), H - lining, c(1.6), dx + hw - lining - c(0.75), (H - lining) / 2, stopZ), bx(W - 2 * lining, c(1.5), c(1.6), dx, H - lining - c(0.75), stopZ));
  // architraves both faces: flat board + a thin raised bead on its inner edge
  for (const [z, s] of [[c(1), 1], [-T - c(1), -1]]) {
    trim.push(bx(arch, H + arch, c(2), dx - hw - arch / 2 + c(0.5), (H + arch) / 2, z), bx(arch, H + arch, c(2), dx + hw + arch / 2 - c(0.5), (H + arch) / 2, z), bx(W + 2 * arch - c(1), arch, c(2), dx, H + arch / 2, z));
    const bz = z + s * c(1.4);
    trim.push(bx(c(1.5), H, c(0.8), dx - hw - c(0.25), H / 2, bz), bx(c(1.5), H, c(0.8), dx + hw + c(0.25), H / 2, bz), bx(W + c(2), c(1.5), c(0.8), dx, H + c(0.25), bz));
  }
  grp.add(envFinish(mergedMesh(`${name}_DoorFrame`, trim, envMat(tex, 'trim'), UV), tex));
  grp.add(envFinish(mergedMesh(`${name}_Threshold`, [bx(W - 2 * lining, c(1.2), T + c(4), dx, c(0.6), -T / 2)], envMat(tex, 'frameAl'), UV), tex));

  // leaf, on its hinge
  const pivot = new THREE.Group(); pivot.name = 'Door_Pivot'; pivot.userData.node = true; pivot.userData.doorPivot = true;
  pivot.position.set(dx - hw + lining + gap, c(1.2), -T / 2);
  const st = c(13), rTop = c(14), rLock = c(18), rBot = c(26), y0 = 0, lh = LH - c(1.2);
  const lockY = c(95), winY0 = lockY + rLock, winY1 = lh - rTop;
  const leaf = [
    bx(st, lh, LT, st / 2, lh / 2, 0), bx(st, lh, LT, L - st / 2, lh / 2, 0),               // stiles
    bx(L - 2 * st, rBot, LT, L / 2, rBot / 2, 0),                                       // bottom rail
    bx(L - 2 * st, rLock, LT, L / 2, lockY + rLock / 2, 0),                             // lock rail
    bx(L - 2 * st, rTop, LT, L / 2, lh - rTop / 2, 0),                                  // top rail
  ];
  const pw = L - 2 * st, ph = lockY - rBot;
  leaf.push(bx(pw, ph, LT * 0.45, L / 2, rBot + ph / 2, 0));                           // recessed panel…
  leaf.push(bx(pw - c(10), ph - c(10), LT * 0.75, L / 2, rBot + ph / 2, 0));           // …with a raised field
  pivot.add(envFinish(mergedMesh('Door_Leaf', leaf, envMat(tex, 'door'), UV), tex));
  // glazing + beads
  const gw = pw, gh = winY1 - winY0, gy = winY0 + gh / 2;
  const glass = new THREE.Mesh(new THREE.BoxGeometry(gw, gh, c(0.8)).toNonIndexed(), glassMat());
  glass.position.set(L / 2, gy, 0); glass.name = 'Door_Glass'; glass.castShadow = false;
  pivot.add(glass);
  const bead = [];
  for (const s of [1, -1]) {
    const z = s * c(1.1);
    bead.push(bx(gw, c(1.6), c(1.4), L / 2, winY0 + c(0.8), z), bx(gw, c(1.6), c(1.4), L / 2, winY1 - c(0.8), z), bx(c(1.6), gh, c(1.4), st + c(0.8), gy, z), bx(c(1.6), gh, c(1.4), L - st - c(0.8), gy, z));
  }
  pivot.add(envFinish(mergedMesh('Door_Beads', bead, envMat(tex, 'door'), UV), tex));
  // hardware: hinges, roses + levers, escutcheons, kick plate
  const hx = [], hy = c(104), ex = L - c(7);
  for (const yy of [c(22), c(105), c(185)]) hx.push(bx(c(1.6), c(11), c(2.4), -c(0.4), yy, LT / 2 - c(0.6)), tubeGeo([-c(0.6), yy - c(6), LT / 2 + c(0.4)], [-c(0.6), yy + c(6), LT / 2 + c(0.4)], c(0.8)));
  for (const s of [1, -1]) {
    const fz = s * (LT / 2), out = s;
    hx.push(bx(c(5.5), c(5.5), c(1), ex, hy, fz + out * c(0.5)));                       // rose
    hx.push(bx(c(2), c(2), c(5), ex, hy, fz + out * c(3)));                             // lever neck
    hx.push(bx(c(14), c(2.2), c(2.2), ex - c(6.5), hy, fz + out * c(5.5)));             // lever
    hx.push(bx(c(3.5), c(7), c(0.6), ex, c(88), fz + out * c(0.3)));                    // key escutcheon
  }
  hx.push(bx(L - c(4), c(25), c(0.5), L / 2, c(13.5), LT / 2 + c(0.25)));              // kick plate (room side)
  pivot.add(envFinish(mergedMesh('Door_Hardware', hx, envMat(tex, 'frameAl'), UV), tex));
  grp.add(pivot);
  grp.add(makeSocket('door', dx, 0, c(70), c(3)));
  return grp;
}

/* Window: plaster reveals, white frame centred in the wall, a mullion and
   a transom (two side-hung casements + a fanlight), glass, and a deep
   window board on the room side. */
function buildWindow(tex, wx, name) {
  const { T } = WALL, { W, H, Y } = WIN, UV = 1 / c(80);
  const grp = new THREE.Group(); grp.name = name; grp.userData.node = true;
  grp.add(envFinish(mergedMesh(`${name}_Reveal`, [
    bx(c(1), H, T, wx - W / 2 + c(0.5), Y + H / 2, -T / 2), bx(c(1), H, T, wx + W / 2 - c(0.5), Y + H / 2, -T / 2), bx(W, c(1), T, wx, Y + H - c(0.5), -T / 2),
  ], envMat(tex, 'wall'), UV), tex));
  const fz = -T / 2, fd = c(7), f = c(6), sash = c(5), tY = Y + H - c(38);
  const fr = [

/* ------------------------------------------------------------------
   Backpacks in the classroom: one per chair.
   10 hang over the chair back by both straps, 2 hang off one corner
   by a single strap, 4 sit on the floor next to the chair.
------------------------------------------------------------------ */
const BAG_PLAN = (() => {
  const mode = ['back', 'back', 'floor-stand', 'back', 'back', 'floor-lean', 'back', 'one-strap', 'back', 'one-strap', 'back', 'back', 'floor-stand', 'back', 'back', 'floor-lean'];
  const design = ['classic', 'slim', 'kids', 'sport', 'slim', 'sport', 'classic', 'kids', 'kids', 'classic', 'sport', 'slim', 'sport', 'kids', 'slim', 'classic'];
  const open = new Set([1, 4, 6, 10, 13, 15]);
  const seen = {};
  return mode.map((m, i) => { const d = design[i]; seen[d] = (seen[d] || 0); const pal = seen[d]++; return { mode: m, design: d, state: open.has(i) ? 'open' : 'closed', pal, side: i % 2 ? 1 : -1 }; });
})();

// Builds a bag (+ any straps draped over the chair) in the chair's local space
function placeBagOnChair(chair, plan, v, idx) {
  const B = BAG_DESIGNS[plan.design], pal = B.pals[plan.pal], tex = v.tex || 'painted';
  const base = { tex, state: plan.state, pal, seed: idx * 2 };
  const strapMat = bagMat(tex, pal[0]);
  const out = new THREE.Group(); out.name = `Bag_${String(idx + 1).padStart(2, '0')}`; out.userData.node = true;
  const strapMesh = (name, pts, across, w, t) => {
    const g = ribbon(pts, across, w, t); g.forEach(x => x.scale(CM, CM, CM));
    return envFinish(mergedMesh(name, g, strapMat, DESK_UV), tex);
  };
  if (plan.mode === 'back') {
    const bag = buildBag(plan.design, { ...base, straps: 'none' });
    const top = 82, zb = 25.8;
    bag.position.set(0, c(top - B.H), c(zb));
    out.add(bag);
    for (const s of [-1, 1]) {
      const x = s * 7.5, bot = top - B.H;
      // strap path keeps ~1 cm clear of the leaning, curved backrest: up behind it, over the top,
      // down in front of it, under its bottom edge and back to the bag's lower corners
      out.add(strapMesh('Bag_Straps', [[x, top - 2, 24.2], [x, 87.6, 24.6], [x, 87.4, 21.2], [x, 84, 20.9], [x, 64.5, 16.3], [x * 1.05, 60.8, 19.0], [x * 1.25, 55, 24.6], [x * 1.5, bot + 2.6, 25.0]], [1, 0, 0], 6.2, 1.6));
    }
  } else if (plan.mode === 'one-strap') {
    // hangs behind the backrest from one strap looped over its top corner, tilted under the hook
    const s = plan.side, bag = buildBag(plan.design, { ...base, straps: s > 0 ? 'left' : 'right' });
    const anchorL = new THREE.Vector3(c(s * 7), c(B.H - 2.5), 0);
    bag.rotation.set(0, 0, s * 0.3);
    const X = s * 15, target = new THREE.Vector3(c(X), c(76), c(25.8));
    bag.position.copy(target).sub(anchorL.clone().applyEuler(bag.rotation));
    out.add(bag);
    // the hooked strap wraps the backrest: up behind it, over the top corner, down in front
    // (clear of the curved edge), under the bottom, out past the back post, back to the bag's lower corner
    const corner = new THREE.Vector3(c(s * 11.6), c(2.6), c(-0.3)).applyEuler(bag.rotation).add(bag.position).divideScalar(CM);
    out.add(strapMesh('Bag_HookStrap', [[X, 76, 25.0], [X, 86.8, 23.8], [X, 87.2, 20.0], [X, 83.5, 19.2], [s * 14, 64.5, 15.0], [s * 15.5, 60.5, 16.5], [s * 18.5, 56.5, 18.0], [corner.x, corner.y + 1.5, corner.z]], [1, 0, 0], 5.8, 1.6));
  } else {
    const bag = buildBag(plan.design, { ...base, straps: 'both' });
    const s = plan.side;
    if (plan.mode === 'floor-stand') { bag.position.set(c(s * 36), 0, c(4)); bag.rotation.y = s * 0.55 + (idx % 3 - 1) * 0.25; }
    else { bag.position.set(c(s * 34), 0, c(-6)); bag.rotation.set(-0.2, s * 1.35, 0, 'YXZ'); bag.position.y = c(0.6); }
    out.add(bag);
  }
  return out;
}

function dartMesh(tex) {

/* ------------------------------------------------------------------
   Level: Classroom (demo)
   7.2 × 8.2 m room, 3 m high. 16 desks in a 4 × 4 grid facing the
   board wall (−Z): 1.6 m between desk centres side to side (95 cm
   gaps), 1.6 m row to row. Each desk has a chair behind it, nudged
   and turned a little; a few are pushed out or swung round. Teacher's
   zone at the front (2 m), side aisles of 85 cm.
------------------------------------------------------------------ */
const M = c(100);                          // one metre in units
const CLASSROOM = {
  floor: [7.2 * M, 8.2 * M],
  cols: [-2.4, -0.8, 0.8, 2.4].map(x => x * M),
  rows: [-1.85, -0.25, 1.35, 2.95].map(z => z * M),
};
const ROOM_STATIC = () => [
  { id: 'Wall_Front', model: 'wall', length: +(7.2 * M + 2 * WALL.T).toFixed(2), position: [0, 0, -4.1 * M], rotationY: 0, note: 'blackboard wall' },
  { id: 'Wall_Back', model: 'wall', length: +(7.2 * M + 2 * WALL.T).toFixed(2), position: [0, 0, 4.1 * M], rotationY: +Math.PI.toFixed(4) },
  { id: 'Wall_Left', model: 'wall-window', length: 8.2 * M, windows: [-2.4 * M, 0, 2.4 * M], position: [-3.6 * M, 0, 0], rotationY: +(Math.PI / 2).toFixed(4), note: '3 windows' },
  { id: 'Wall_Right', model: 'wall-door', length: 8.2 * M, door: { x: -3.2 * M }, position: [3.6 * M, 0, 0], rotationY: +(-Math.PI / 2).toFixed(4), note: 'door at the front' },
  { id: 'Blackboard', model: 'blackboard', parent: 'Wall_Front', position: [0, 0, 0], rotationY: 0 },
  { id: 'TeacherDesk', model: 'teacherdesk', position: [+(-2.4 * M).toFixed(2), 0, +(-3.0 * M).toFixed(2)], rotationY: 0.05 },
];
function classroomLayout() {
  const items = [...ROOM_STATIC()];
  let seed = 9001;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5);
  CLASSROOM.rows.forEach((z, ri) => CLASSROOM.cols.forEach((x, ci) => {
    const n = ri * CLASSROOM.cols.length + ci;
    const ch = chairPlacement(n, rnd);
    const bp = BAG_PLAN[n];
    items.push({
      id: `Bag_${String(n + 1).padStart(2, '0')}`,
      model: `backpack-${bp.design}`,
      chair: `Chair_${String(n + 1).padStart(2, '0')}`,
      state: bp.state, mode: bp.mode, pal: bp.pal, side: bp.side, design: bp.design,
      colors: BAG_DESIGNS[bp.design].pals[bp.pal].map(h => '#' + h.toString(16).padStart(6, '0')),
    });
    items.push({
      id: `Chair_${String(n + 1).padStart(2, '0')}`,
      model: 'chair',
      row: ri + 1,
      position: [+(x + ch.dx).toFixed(2), 0, +(z + ch.dz).toFixed(2)],
      rotationY: +ch.rot.toFixed(3),
    });
    items.push({
      id: `Desk_${String(n + 1).padStart(2, '0')}`,
      model: 'desk',
      row: ri + 1,
      position: [+x.toFixed(2), 0, +z.toFixed(2)],
      rotationY: 0,
    });
  }));
  return items;
}

function buildClassroom(v = {}) {
  const tex = v.tex || 'painted';
  const root = new THREE.Group(); root.name = 'Classroom';
  root.userData.part = true;

  const [FW, FD] = CLASSROOM.floor;
  const floor = mergedMesh('Floor', [bx(FW, 2, FD, 0, -1, 0)], envMat(tex, 'floor'), tex === 'painted' ? 1 / (1.2 * M) : 1 / (1.5 * M));
  floor.userData.placeholder = true;
  floor.receiveShadow = true;
  addSeams(floor, ENV_LOOKS[tex].seam, 0.55, 25, ENV_PENCIL);
  root.add(floor);

  const walls = new THREE.Group(); walls.name = 'Walls'; walls.userData.node = true;
  const byId = {};
  const desks = new THREE.Group(); desks.name = 'Desks'; desks.userData.node = true;
  const chairs = new THREE.Group(); chairs.name = 'Chairs'; chairs.userData.node = true;
  const chairById = {}, pendingBags = [];
  for (const it of classroomLayout()) {
    if (it.model.startsWith('wall')) {
      const w = buildWall(v, { len: it.length, door: it.door, windows: it.windows, name: it.id });
      w.position.fromArray(it.position); w.rotation.y = it.rotationY; w.userData.cut = true;
      w.traverse(o => { if (o.userData.socketMarker) o.visible = false; });
      w.traverse(o => { if (o.isMesh) o.castShadow = false; });       // indoor light: walls don't throw sun shadows
      walls.add(w); byId[it.id] = w; continue;
    }
    if (it.model === 'blackboard' || it.model === 'teacherdesk') {
      const m = it.model === 'blackboard' ? buildBlackboard(v) : buildTeacherDesk(v);
      m.name = it.id; m.position.fromArray(it.position); m.rotation.y = it.rotationY;
      m.traverse(o => { if (o.userData.socketMarker) o.visible = false; });
      (it.parent ? byId[it.parent] : root).add(m);                     // the board hides with its wall
      continue;
    }
    if (it.model.startsWith('backpack')) { pendingBags.push(it); continue; }
    if (it.model === 'chair') {
      const ch = buildChair(v);
      ch.name = it.id; ch.userData.collapse = 'SchoolChair';
      ch.position.fromArray(it.position); ch.rotation.y = it.rotationY;
      ch.traverse(o => { if (o.userData.socketMarker) o.visible = false; });
      chairs.add(ch); chairById[it.id] = ch;
      continue;
    }
    const d = buildDesk(v);
    d.name = it.id; d.userData.collapse = 'SchoolDesk';
    d.position.fromArray(it.position); d.rotation.y = it.rotationY;
    d.traverse(o => { if (o.userData.socketMarker) o.visible = false; });   // 16 × 3 markers is noise
    if (it.id === 'Desk_06' || it.id === 'Desk_07') d.add(buildBaseMock());  // two example bases
    desks.add(d);
  }
  pendingBags.forEach((it, i) => { const ch = chairById[it.chair]; if (ch) ch.add(placeBagOnChair(ch, it, v, i)); });
  root.add(walls);
  root.add(desks);
  root.add(chairs);

  const ref = buildPaperPlane(tex);
  ref.position.set(-0.8 * M, DESK.H + 9, CLASSROOM.rows[1] + DESK.D * 0.75); ref.rotation.set(0.08, 0.6, -0.15);
  root.add(ref);
  return root;
}

/* Simple prop controller: toggles named groups, gently floats the plane */
function envController(root) {
  const ref = root.getObjectByName('ScaleRef');
  const mocks = [], doors = [];
  root.traverse(o => { if (o.userData.baseMock) mocks.push(o); if (o.userData.doorPivot) doors.push(o); });
  let cut = true, doorOpen = false;
  const baseY = ref?.position.y ?? 0;
  let t = 0;
  return {
    state: '',
    setProp(key, on) {
      if (key === 'scaleRef' && ref) ref.visible = on;
      if (key === 'baseMock') mocks.forEach(m => m.visible = on);
      if (key === 'cutaway') { cut = on; applyCutaway(root, camera.position, cut); }
      if (key === 'doorOpen') doorOpen = on;
    },
    update(dt) {
      applyCutaway(root, camera.position, cut);
      doors.forEach(d => { const goal = doorOpen ? -1.15 : 0; d.rotation.y += (goal - d.rotation.y) * Math.min(1, dt * 4); });
      t += dt; if (ref) { ref.position.y = baseY + Math.sin(t * 1.4) * 0.6; ref.rotation.z = -0.15 + Math.sin(t * 0.9) * 0.08; } },
    reset() { t = 0; if (ref) ref.position.y = baseY; doors.forEach(d => d.rotation.y = 0); },
  };
}

function buildDeskWithRef(v) {
  const d = buildDesk(v);
  d.add(buildBaseMock());
  const ref = buildPaperPlane(v.tex || 'painted');
  ref.position.set(c(14), DESK.H + 7, c(14)); ref.rotation.set(0.05, 0.7, -0.12);
  d.add(ref);
  return d;
}

const host = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

renderer.domElement.addEventListener('webglcontextrestored', () => toast('3D view restored'));

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = false;
controls.autoRotateSpeed = 1.2;
controls.maxPolarAngle = Math.PI * 0.49;          // never look from under the floor

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b6056, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(IS_MOBILE ? 1024 : 2048, IS_MOBILE ? 1024 : 2048);
key.shadow.radius = 4;
scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight(0xfff0e0, 0.55);
fill.position.set(1, -4, 3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2c0, 0.8);
rim.position.set(-5, 3, -4);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const stage = new THREE.Group(); stage.name = '__stage'; scene.add(stage);
let controller = null;
let current = null, currentDef = null, fit = { target: new THREE.Vector3(), dist: 30, radius: 10 };

// Variant choice is global: pick "Cardboard + Plain" once and every model follows
const VARIANT = { design: 'pencil', tex: 'painted', state: 'closed' };
const PROP_STATE = {};
try { Object.assign(VARIANT, JSON.parse(localStorage.getItem('envlab:variant') || '{}')); } catch {}

function disposeObject(o) {
  o.traverse(n => {
    n.geometry?.dispose?.();
    const m = n.material; if (!m) return;
    (Array.isArray(m) ? m : [m]).forEach(mm => { if (mm.userData?.shared) return; if (!mm.map?.userData?.shared) mm.map?.dispose?.(); mm.dispose(); });
  });
}

function computeFit(obj) {
  const box = solidBox(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = sphere.radius;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  return { target: sphere.center.clone(), dist, radius: r, box };
}

// Lights, shadow box and camera range follow the model's size (a desk is 15 u, a room 240 u)
function fitScene(f) {
  const R = Math.max(f.radius, 1);
  key.target.position.copy(f.target);
  key.position.copy(f.target).add(new THREE.Vector3(0.45, 0.8, 0.55).normalize().multiplyScalar(R * 3));
  Object.assign(key.shadow.camera, { left: -R * 1.15, right: R * 1.15, top: R * 1.15, bottom: -R * 1.15, near: R * 0.5, far: R * 6 });
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -0.0004; key.shadow.normalBias = R * 0.0006;
  ground.scale.setScalar(R * 10);
  camera.near = Math.max(0.05, f.dist / 4000); camera.far = f.dist * 5; camera.updateProjectionMatrix();
  controls.minDistance = Math.min(4, R * 0.25); controls.maxDistance = f.dist * 3;
}

function resetView() {
  const el = THREE.MathUtils.degToRad(currentDef?.level ? 38 : 24), az = THREE.MathUtils.degToRad(35);
  camera.position.set(
    fit.target.x + fit.dist * Math.cos(el) * Math.sin(az),
    fit.target.y + fit.dist * Math.sin(el),
    fit.target.z + fit.dist * Math.cos(el) * Math.cos(az)
  );
  controls.target.copy(fit.target);
  controls.update();
}

function countTris(obj) {
  let t = 0;
  obj.traverse(o => {
    if (o.isMesh && !o.userData.helper) {
      const g = o.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  return t;
}

function liftToGround(wrapper, obj) {
  wrapper.position.y = 0; wrapper.updateMatrixWorld(true);
  const box = solidBox(obj);
  wrapper.position.y = box.min.y < 0 ? -box.min.y : 0;
}

function selectModel(id, patch) {
  const def = MODELS.find(m => m.id === id) || MODELS[0];
  const sameModel = currentDef === def;
  if (patch) Object.assign(VARIANT, patch);
  pencilOn = VARIANT.design === 'pencil';
  controller?.dispose?.(); controller = null;
  if (current) { stage.remove(current); disposeObject(current); }
  current = def.build({ ...VARIANT });
  currentDef = def;
  stage.add(current);
  liftToGround(stage, current);
  controller = def.controller ? def.controller(current) : null;
  renderProps(def);
  renderGuide();
  fit = computeFit(current);
  fitScene(fit);
  if (!sameModel) { if (window.__navReady) { setFly(false); cancelTween(); } resetView(); }                       // switching looks keeps your camera

  document.getElementById('modelTitle').textContent = def.name;
  document.getElementById('modelKicker').textContent = def.kicker || 'Model';
  document.getElementById('modelDesc').textContent = def.description || '';
  const specs = { ...def.specs, Triangles: countTris(current).toLocaleString() };
  document.getElementById('modelSpecs').innerHTML =
    Object.entries(specs).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('variantsBox').textContent = (def.axes || [])
    .map(a => `${a.label}: ${a.options.find(o => o.id === VARIANT[a.key])?.label}`).join(' · ') || 'None yet';
  document.querySelectorAll('.model-item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === def.id)));
  document.getElementById('guideAbout').innerHTML =
    `<p style="margin:0">${esc(def.description || '')}</p><dl class="specs">${document.getElementById('modelSpecs').innerHTML}</dl>`;
  const chip = document.querySelector(`.model-item[data-id="${def.id}"]`);
  if (chip && !sameModel && matchMedia('(max-width:820px)').matches) chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  try { localStorage.setItem('envlab:model', def.id); localStorage.setItem('envlab:variant', JSON.stringify(VARIANT)); } catch {}
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  setPencilResolution(w, h);
}
new ResizeObserver(resize).observe(host);
resize();

const clock = new THREE.Clock();
// Surface script errors on the page instead of a silent blank view
addEventListener('error', e => toast('Error: ' + (e.message || 'script error')));
addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason?.message || e.reason)));
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  controller?.update?.(dt);
  try { navUpdate(dt); } catch (e) { if (!window.__navErr) { window.__navErr = 1; console.error(e); } }
  if (window.__navReady && NAV.mode === 'fly') {} else controls.update();
  renderer.render(scene, camera);
