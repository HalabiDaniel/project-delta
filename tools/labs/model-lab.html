/* ------------------------------------------------------------------
   Model: Workshop (factory building)
   Cardboard walls on a dark plinth, dark pitched roof with three
   skylights, a striped brick chimney, a roller-shutter door and
   windows. Origin = ground centre, front (door) faces +Z.
   Effects (driven by workshopController via properties):
     • smoke  – puffs from "smoke_point" on top of the chimney
     • lights – glass + interior glow (materials "WindowGlass", "Interior")
     • door   – "Door_Roll" rolls up into the lintel (scale.y 1 → 0.04)
------------------------------------------------------------------ */
const SHOP = { W: 2.6, D: 2.0, H: 1.25, RISE: 0.65, T: 0.08, DOOR_W: 0.7, DOOR_H: 0.85 };
// Per level: footprint and chimney positions (x along the back slope)
const SHOP_LV = {
  1: { W: 2.6, D: 2.0, chimneys: [0.62] },
  2: { W: 3.5, D: 2.2, chimneys: [-0.95, 0.95] },
  3: { W: 4.4, D: 2.4, chimneys: [-1.45, 0, 1.45] },
};

function buildWorkshop(level = 1, damage = 0) {
  const { H, T, DOOR_W, DOOR_H } = SHOP;
  const LV = SHOP_LV[level] || SHOP_LV[1];
  const { W, D } = LV, RISE = 0.325 * D;
  const root = new THREE.Group(); root.name = 'Workshop';
  root.userData.part = 'workshop';
  const card = MAT.cardboard(), dark = MAT.rubber();
  const roofMat = new THREE.MeshStandardMaterial({ name: 'Roof', color: 0x5a5450, roughness: 0.85, flatShading: true, ...OFFSET });
  const brick = new THREE.MeshStandardMaterial({ name: 'Brick', color: 0xc8643f, roughness: 0.8, flatShading: true, ...OFFSET });
  const glass = new THREE.MeshStandardMaterial({ name: 'WindowGlass', color: 0x1c1a18, roughness: 0.35, metalness: 0.1, emissive: 0xffbe5c, emissiveIntensity: 0, ...OFFSET });
  const interior = new THREE.MeshStandardMaterial({ name: 'Interior', color: 0x16130f, roughness: 1, emissive: 0xffa94a, emissiveIntensity: 0 });
  glass.userData.exportOff = interior.userData.exportOff = true;
  root.userData.glass = glass; root.userData.interior = interior;
  const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };

  // Dark interior block (seen through the open door)
  const inside = new THREE.Mesh(new THREE.BoxGeometry(W - 2 * T - 0.01, H - 0.01, D - 2 * T - 0.01), interior);
  inside.name = 'Interior'; inside.position.y = H / 2;
  root.add(inside);

  // Side walls with gables (±X)
  [-1, 1].forEach((side, i) => {
    const g = extrude(poly([[-D / 2, 0], [D / 2, 0], [D / 2, H], [0, H + RISE], [-D / 2, H]]), T);
    g.rotateY(Math.PI / 2);
    const wall = new THREE.Mesh(g, card);
    wall.name = `GableWall_${i}`; wall.position.x = side > 0 ? W / 2 - T : -W / 2;
    root.add(addSeams(wall));
  });
  // Front wall with the door notch, back wall plain
  const IW = W / 2 - T;
  const front = new THREE.Mesh(extrude(poly([[-IW, 0], [-DOOR_W / 2, 0], [-DOOR_W / 2, DOOR_H], [DOOR_W / 2, DOOR_H], [DOOR_W / 2, 0], [IW, 0], [IW, H], [-IW, H]]), T), card);
  front.name = 'FrontWall'; front.position.z = D / 2 - T;
  root.add(addSeams(front));
  const back = new THREE.Mesh(extrude(poly([[-IW, 0], [IW, 0], [IW, H], [-IW, H]]), T), card);
  back.name = 'BackWall'; back.position.z = -D / 2;
  root.add(addSeams(back));

  // Plinth band (split around the door)
  const PH = 0.2, PP = 0.04;
  const plinth = (name, w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, PH, d), dark);
    m.name = name; m.position.set(x, PH / 2, z); root.add(addSeams(m, 0x2c2826, 0.6));
  };
  plinth('Plinth_Back', W + 2 * PP, PP, 0, -D / 2 - PP / 2);
  plinth('Plinth_L', PP, D + 2 * PP, -W / 2 - PP / 2, 0);
  plinth('Plinth_R', PP, D + 2 * PP, W / 2 + PP / 2, 0);
  const fw = W / 2 + PP - (DOOR_W / 2 + 0.07);
  plinth('Plinth_FL', fw, PP, -(W / 2 + PP) + fw / 2, D / 2 + PP / 2);
  plinth('Plinth_FR', fw, PP, (W / 2 + PP) - fw / 2, D / 2 + PP / 2);

  // Door frame: jambs + lintel
  [-1, 1].forEach((side, i) => {
    const j = new THREE.Mesh(new THREE.BoxGeometry(0.07, DOOR_H, 0.1), dark);
    j.name = `DoorJamb_${i}`; j.position.set(side * (DOOR_W / 2 + 0.035), DOOR_H / 2, D / 2 + 0.01);
    root.add(addSeams(j, 0x2c2826, 0.6));
  });
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W + 0.24, 0.1, 0.14), dark);
  lintel.name = 'DoorLintel'; lintel.position.set(0, DOOR_H + 0.05, D / 2 + 0.03);
  root.add(addSeams(lintel, 0x2c2826, 0.6));

  root.add(buildRollDoor(DOOR_W, DOOR_H, D / 2 - T / 2, dark));

  // Windows: dark frame + glass pane
  const WW = 0.34, WH = 0.3, WY = 0.72;
  const windowAt = (name, x, z, rotY) => {
    const g = new THREE.Group(); g.name = name; g.position.set(x, WY, z); g.rotation.y = rotY;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(WW + 0.08, WH + 0.08, 0.03), dark);
    frame.name = `${name}_Frame`; frame.position.z = 0.015;
    g.add(addSeams(frame, 0x2c2826, 0.6));
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(WW, WH), glass);
    pane.name = `${name}_Glass`; pane.position.z = 0.032;
    g.add(pane);
    root.add(g);
  };
  let fi = 0;                                         // front windows either side of the door
  for (let x = 0.85; x < W / 2 - 0.3; x += 0.62) {
    windowAt(`Window_F${fi++}`, -x, D / 2, 0);
    windowAt(`Window_F${fi++}`, x, D / 2, 0);
  }
  [-0.55, 0, 0.55].forEach((z, i) => {
    windowAt(`Window_R${i}`, W / 2, z, Math.PI / 2);
    windowAt(`Window_L${i}`, -W / 2, z, -Math.PI / 2);
  });

  // Roof: two slabs hinged at the ridge, with overhang
  const A = Math.atan2(RISE, D / 2), SL = Math.hypot(RISE, D / 2) + 0.2, RT = 0.08, OH = 0.16;
  [1, -1].forEach((side, i) => {
    const hinge = new THREE.Group(); hinge.name = `RoofSide_${i}`;
    hinge.position.y = H + RISE; hinge.rotation.x = side * A;
    root.add(hinge);
    const slab = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * OH, RT, SL), roofMat);
    slab.name = `Roof_${i}`; slab.position.set(0, RT / 2, side * (SL / 2 - 0.02));
    hinge.add(addSeams(slab, 0x2c2826, 0.6));
    if (side > 0) {                                  // skylights on the front slope
      const nS = level + 2;
      Array.from({ length: nS }, (_, k) => (k - (nS - 1) / 2) * 0.78).forEach((x, k) => {
        const fr = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.07, 0.34), roofMat);
        fr.name = `Skylight_${k}`; fr.position.set(x, RT + 0.035, SL * 0.42);
        hinge.add(addSeams(fr, 0x2c2826, 0.6));
        const pg = new THREE.PlaneGeometry(0.32, 0.22); pg.rotateX(-Math.PI / 2);
        const pane = new THREE.Mesh(pg, glass);
        pane.name = `Skylight_${k}_Glass`; pane.position.set(x, RT + 0.072, SL * 0.42);
        hinge.add(pane);
      });
    }
  });
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * OH + 0.02, 0.07, 0.14), roofMat);
  ridge.name = 'RidgeCap'; ridge.position.y = H + RISE + 0.07;
  root.add(addSeams(ridge, 0x2c2826, 0.6));

  // Chimneys on the back slope: octagonal, tapered, two dark bands + cap.
  // Outer chimneys are slightly shorter so the group reads as a skyline.
  const CZ = -0.21 * D, CB = H;
  LV.chimneys.forEach((CX, c) => {
    const tall = LV.chimneys.length === 3 && c !== 1 ? 0.85 : 1.05;
    const CT = H + RISE + tall, CHH = CT - CB, sfx = LV.chimneys.length > 1 ? `_${c}` : '';
    const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.21, CHH, 8), brick);
    stack.name = `Chimney${sfx}`; stack.position.set(CX, CB + CHH / 2, CZ);
    root.add(addSeams(stack, 0x6b2e1b, 0.6));
    const radiusAt = y => 0.21 - 0.04 * ((y - CB) / CHH);
    [CT - 0.62, CT - 0.3].forEach((y, k) => {
      const r = radiusAt(y) + 0.012;
      const band = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.1, 8), dark);
      band.name = `ChimneyBand${sfx}_${k}`; band.position.set(CX, y, CZ);
      root.add(addSeams(band, 0x2c2826, 0.6));
    });
    const capM = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.2, 0.08, 8), dark);
    capM.name = `ChimneyCap${sfx}`; capM.position.set(CX, CT + 0.04, CZ);
    root.add(addSeams(capM, 0x2c2826, 0.6));
    const smokePt = new THREE.Object3D(); smokePt.name = `smoke_point${sfx}`;
    smokePt.position.set(CX, CT + 0.1, CZ);
    root.add(smokePt);
  });

  if (damage) damageWorkshop(root, { W, D, H, RISE, SL, RT, chimneys: LV.chimneys }, damage);
  finishPart(root);
  return damage ? applyDamage(root, level, damage) : root;
}

/* ------------------------------------------------------------------
   Workshop effects — always running, switched by properties
------------------------------------------------------------------ */
function buildingController(root) {
  const doors = [];                                      // any node whose joint is labelled 'Door'
  root.traverse(o => { if (o.userData.joint?.label === 'Door') doors.push(o); });
  const smokePts = [], spinners = [], inkLevels = [], leaks = [];                    // optional: chimneys, spinning dishes
  root.traverse(o => {
    if (o.name.startsWith('smoke_point')) smokePts.push(o);
    if (o.userData.joint?.label === 'Spin') spinners.push(o);
    if (o.userData.joint?.label === 'Ink') inkLevels.push(o);
    if (o.userData.leakStream) leaks.push(o);
  });
  const { glass, interior } = root.userData;
  const beacons = root.userData.beacons || [];
  if (!root.parent) return null;
  const world = root.parent;
  const fx = new THREE.Group(); fx.name = '__fx'; world.add(fx);
  const puffGeo = new THREE.IcosahedronGeometry(1, 0);
  const puffs = Array.from({ length: 70 * Math.max(1, smokePts.length) }, () => {
    const m = new THREE.Mesh(puffGeo, new THREE.MeshStandardMaterial({ color: 0xbdb6ad, roughness: 1, flatShading: true, transparent: true, depthWrite: false }));
    m.visible = false; m.userData.helper = true; m.userData.drift = new THREE.Vector3();
    fx.add(m); return m;
  });
  let pi = 0, smokeT = 0, t = 0, doorPos = 0, light = 0;
  const props = { smoke: smokePts.length > 0, lights: true, door: false, beacons: true, centre: true, filling: true };
  const tmp = new THREE.Vector3();

  const api = {
    state: '',
    independent: true,                 // runs even when "Animate" is off
    setProp(key, val) { props[key] = !!val; },
    reset() { puffs.forEach(p => p.visible = false); },
    dispose() {
      world.remove(fx); puffs.forEach(p => p.material.dispose()); puffGeo.dispose();
      if (glass) glass.emissiveIntensity = 0;
      if (interior) interior.emissiveIntensity = 0;
      beacons.forEach(b => b.mat.emissiveIntensity = 0);
    },
    update(dt) {
      t += dt;
      // Door: ease toward open/closed (~1.2 s travel)
      const goal = props.door ? 1 : 0;
      doorPos += Math.sign(goal - doorPos) * Math.min(Math.abs(goal - doorPos), dt / 1.2);
      const e = doorPos * doorPos * (3 - 2 * doorPos);
      doors.forEach(d => {
        const j = d.userData.joint;
        if (j.type === 'scale') d.scale[j.axis] = 1 - e * (1 - j.min);      // roll-up: shrink toward the lintel
        else if (j.type === 'translate') d.position[j.axis] = e * (j.min !== 0 ? j.min : j.max);  // sliding leaf
      });
      // Red beacons: short bright flash each period
      beacons.forEach(b => {
        const u = ((t + b.phase) % b.period) / b.period;
        const on = props[b.prop || 'beacons'];
        const w = b.width || 0.12, peak = b.peak || 3;
        b.mat.emissiveIntensity = on ? (u < w ? peak * Math.sqrt(1 - u / w) : (b.idle ?? 0.15)) : 0;
      });

      // Lights: fade on/off, with a faint warm flicker
      light += Math.sign((props.lights ? 1 : 0) - light) * Math.min(Math.abs((props.lights ? 1 : 0) - light), dt * 2.5);
      const flick = 1 + Math.sin(t * 13) * 0.03 + Math.sin(t * 7.3) * 0.04;
      if (glass) glass.emissiveIntensity = 1.5 * light * flick;
      if (interior) interior.emissiveIntensity = 0.45 * light * flick;

      // Chimney smoke
      spinners.forEach(o => {
        const j = o.userData.joint;
        if (j.prop && !props[j.prop]) return;              // e.g. pump only turns while filling
        o.rotation[j.axis || 'y'] += (j.speed || 0.8) * dt;
      });
      inkLevels.forEach((o, i) => {                        // tank gauges rise and fall, out of step
        const d = o.userData;
        if (d.ph === undefined) d.ph = i * 1.7;
        if (props.filling) d.ph += dt * 0.35;
        o.scale.y = d.leak ? 0.12 + 0.02 * Math.sin(t * 2) : Math.min(1, Math.max(0.05, 0.55 + 0.38 * Math.sin(d.ph)));
      });
      leaks.forEach(o => { const f = 1 + Math.sin(t * 13) * 0.12 + Math.sin(t * 7) * 0.08; o.scale.set(f, 1, f); });   // ink stream wobble
      if (props.smoke && smokePts.length) {
        smokeT += dt;
        while (smokeT > 0.13) {
          smokeT -= 0.13;
          for (const smokePt of smokePts) {
          const p = puffs[pi++ % puffs.length];
          smokePt.getWorldPosition(tmp);
          p.position.copy(fx.worldToLocal(tmp));
          p.position.x += (Math.random() - 0.5) * 0.08; p.position.z += (Math.random() - 0.5) * 0.08;
          p.userData.age = 0; p.userData.life = 3.2 + Math.random() * 1.2;
          p.userData.drift.set(0.12 + Math.random() * 0.08, 0.45 + Math.random() * 0.15, (Math.random() - 0.5) * 0.1);
          p.userData.spin = (Math.random() - 0.5) * 0.8;
          p.rotation.set(Math.random() * 3, Math.random() * 3, 0);
          p.visible = true;
          }
        }
      }
      puffs.forEach(p => {
        if (!p.visible) return;
        const d = p.userData;
        d.age += dt;
        const u = d.age / d.life;
        if (u >= 1) { p.visible = false; return; }
        p.scale.setScalar(0.07 + 0.34 * (1 - Math.pow(1 - u, 2)));
        p.material.opacity = 0.7 * (u < 0.1 ? u / 0.1 : 1 - (u - 0.1) / 0.9);
        p.position.addScaledVector(d.drift, dt * (1 - 0.4 * u));
        p.rotation.y += d.spin * dt;
      });
    },
  };
  return api;
}

/* ------------------------------------------------------------------
   Turret behaviour (demo loop)
   Scan left → scan right → acquire target → track + fire → stand down.
   Aiming uses the same maths a game would: target → local space of
   each joint's parent → yaw / pitch angles, turned at a capped rate.
------------------------------------------------------------------ */
function turretController(root) {
  const swivel = root.getObjectByName('Swivel');
  const pitch = root.getObjectByName('Housing_Pitch');
  const recoils = [];                              // 1 gun (L1–2) or 2 guns (L3)
  root.traverse(o => { if (o.name === 'Gun_Recoil') recoils.push(o); });
  if (!swivel || !pitch || !recoils.length) return null;
  const pj = pitch.userData.joint, rj = recoils[0].userData.joint;

  const CYCLE = 15;
  const FIRE_INTERVAL = recoils.length > 1 ? 0.25 : 0.4;   // 2.5 shots/s; twin guns alternate at 4/s
  const KICK = 0.05, RETURN = 0.28;               // recoil timing (s)
  let t = 0, yaw = 0, pit = 0, shotTimer = 0, nextGun = 0;
  const since = recoils.map(() => 99);
  const target = new THREE.Vector3(), local = new THREE.Vector3();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const approach = (v, goal, maxStep) => v + clamp(goal - v, -maxStep, maxStep);
  const easeOut = u => 1 - Math.pow(1 - u, 3);

  const api = {
    state: 'Idle',
    reset() { t = 0; yaw = pit = 0; since.fill(99); swivel.rotation.y = 0; pitch.rotation.x = 0; recoils.forEach(r => r.position.z = 0); },
    update(dt) {
      t = (t + dt) % CYCLE;
      let wantYaw = 0, wantPitch = 0, yawRate = 1.1, tracking = false;

      if (t < 2.8)      { api.state = 'Scanning';  wantYaw = 1.05;  wantPitch = -0.12; }
      else if (t < 5.8) { api.state = 'Scanning';  wantYaw = -1.15; wantPitch = -0.04; }
      else if (t < 12.6) {
        tracking = true; yawRate = 2.6;
        // A target crossing the field: moves sideways and bobs in height
        const k = t - 5.8;
        const a = 0.75 - k * 0.2;
        const y = 2.4 + Math.sin(k * 0.9) * 0.9;
        target.set(Math.sin(a) * 7, y, Math.cos(a) * 7);
        root.updateMatrixWorld(true);
        local.copy(target); swivel.parent.worldToLocal(local);
        wantYaw = Math.atan2(local.x, local.z);
        local.copy(target); pitch.parent.worldToLocal(local).sub(pitch.position);
        wantPitch = -Math.atan2(local.y, Math.hypot(local.x, local.z));
      } else { api.state = 'Standing down'; wantYaw = 0; wantPitch = 0; yawRate = 0.9; }

      yaw = approach(yaw, wantYaw, yawRate * dt);
      pit = approach(pit, clamp(wantPitch, pj.min, pj.max), 1.4 * dt);
      swivel.rotation.y = yaw;
      pitch.rotation.x = pit;

      const locked = tracking && Math.abs(wantYaw - yaw) < 0.04;
      if (tracking) api.state = locked ? 'Locked · firing' : 'Acquiring';
      if (locked) {
        shotTimer += dt;
        if (shotTimer >= FIRE_INTERVAL) { shotTimer -= FIRE_INTERVAL; since[nextGun] = 0; nextGun = (nextGun + 1) % recoils.length; }
      } else shotTimer = FIRE_INTERVAL;            // first shot fires the moment it locks
      for (let g = 0; g < since.length; g++) since[g] += dt;

      recoils.forEach((r, g) => {
        const k = since[g];
        let z = 0;
        if (k < KICK) z = rj.min * (k / KICK);
        else if (k < KICK + RETURN) z = rj.min * (1 - easeOut((k - KICK) / RETURN));
        r.position.z = z;
      });
    },
  };
  return api;
}

/* ------------------------------------------------------------------
   Sockets & assembly
   A socket is an empty node named "socket_<name>". It is exported in
   the GLB so the game can find it and parent the next part to it.
------------------------------------------------------------------ */
function makeSocket(name, x, y, z) {
  const s = new THREE.Object3D();
  s.name = `socket_${name}`;
  s.userData.socket = name;
  s.position.set(x, y, z);
  const marker = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.07),
    new THREE.MeshBasicMaterial({ color: 0xff9a3c, wireframe: true, depthTest: false, transparent: true })
  );
  marker.renderOrder = 10;
  marker.userData.helper = true;
  marker.userData.socketMarker = true;
  marker.visible = showSockets;
  s.add(marker);
  return s;
}

function finishPart(root) {
  root.traverse(o => { if (o.isMesh && !o.userData.helper) { o.castShadow = true; o.receiveShadow = true; } });
}

function findSocket(obj, name) {
  let found = null;
  obj.traverse(o => { if (!found && o.userData.socket === name) found = o; });
  return found;
}

// Builds parts in order; each one after the first plugs into the named socket
function buildAssembly(parts, level, damage = 0) {
  let root = null;
  for (const p of parts) {
    const part = MODELS.find(m => m.id === p.model).build(level, damage);
    if (!root) { root = part; continue; }
    const socket = findSocket(root, p.socket);
    if (!socket) { console.warn('Missing socket', p.socket); continue; }
    if (/_\d+$/.test(p.socket) || root.getObjectByName(part.name)) {           // e.g. 6× Rocket → Rocket_0…5
      const m = /(\d+)$/.exec(p.socket); part.name += '_' + (m ? m[1] : root.id);
    }
    socket.add(part);
    socket.children.filter(c => c.userData.socketMarker).forEach(m => m.userData.occupied = true);
  }
  root.traverse(o => { if (o.userData.occupied) o.visible = false; });
  return damage ? applyDamage(root, level || 1, damage) : root;
}

/* ------------------------------------------------------------------
   Scene
------------------------------------------------------------------ */
const host = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const IS_MOBILE = matchMedia('(max-width: 820px), (pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
// If the browser drops the GL context (memory pressure), let three.js restore it
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('3D view paused — restoring…'); });
renderer.domElement.addEventListener('webglcontextrestored', () => toast('3D view restored'));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 1.5;
controls.maxDistance = 30;

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x3a3028, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(IS_MOBILE ? 1024 : 2048, IS_MOBILE ? 1024 : 2048);
key.shadow.radius = 6;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe2c0, 0.8);
rim.position.set(-5, 3, -4);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const stage = new THREE.Group(); stage.name = '__stage'; scene.add(stage);
let controller = null;
let current = null, currentDef = null, fit = { target: new THREE.Vector3(), dist: 6, radius: 1 };

function disposeObject(o) {
  o.traverse(n => {
    n.geometry?.dispose?.();
    const m = n.material; if (!m) return;
    (Array.isArray(m) ? m : [m]).forEach(mm => { if (mm.userData?.shared) return; if (!mm.map?.userData?.shared) mm.map?.dispose?.(); mm.dispose(); });
  });
}

function computeFit(obj) {
  const box = solidBox(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = sphere.radius;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.12;
  return { target: sphere.center.clone(), dist, radius: r };
}

function resetView() {
  const el = THREE.MathUtils.degToRad(22), az = THREE.MathUtils.degToRad(35);
  camera.position.set(
    fit.target.x + fit.dist * Math.cos(el) * Math.sin(az),
    fit.target.y + fit.dist * Math.sin(el),
    fit.target.z + fit.dist * Math.cos(el) * Math.cos(az)
  );
  controls.target.copy(fit.target);
  controls.update();
}

function countTris(obj) {
  let t = 0;
  obj.traverse(o => {
    if (o.isMesh && !o.userData.helper) {
      const g = o.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  return t;
}

let currentVariant, currentDamage = 0, damageFx = null;
function selectModel(id, variant, damage = 0) {
  const def = MODELS.find(m => m.id === id) || MODELS[0];
  const vs = def.variants || [];
  currentVariant = vs.length ? (vs.some(v => v.id === variant) ? variant : vs[0].id) : undefined;
  currentDamage = def.damage ? damage : 0;
  controller?.dispose?.(); controller = null;
  damageFx?.dispose(); damageFx = null;
  if (current) { stage.remove(current); disposeObject(current); }
  current = def.build(currentVariant, currentDamage);
  currentDef = def;
  stage.add(current);
  liftToGround(stage, current);
  stage.position.y += def.hover || 0;               // planes float above the ground
  controller = def.controller ? def.controller(current) : null;
  if (currentDamage >= 2) damageFx = makeDamageSmoke(current, currentDamage);
  renderProps(def);
  renderGuide();
  fit = computeFit(current);
  resetView();

  document.getElementById('modelTitle').textContent = def.name;
  document.getElementById('modelKicker').textContent = def.kicker || 'Model';
  document.getElementById('modelDesc').textContent = def.description || '';
  const specs = { ...def.specs };
  if (def.kind === 'part') {
    specs.Joint = def.joint || 'Static';
    specs['Plugs into'] = def.plugsInto || '—';
    specs.Sockets = (def.sockets || []).map(n => `socket_${n}`).join(', ') || '—';
  } else if (def.parts) {
    specs.Parts = (def.partsFor ? def.partsFor(currentVariant) : def.parts).map(p => MODELS.find(m => m.id === p.model).name).join(' › ');
  }
  if (def.damage) specs.Damage = DAMAGE_STATES[currentDamage].label;
  specs.Triangles = countTris(current).toLocaleString();
  document.getElementById('modelSpecs').innerHTML =
    Object.entries(specs).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  const nv = (def.variants || []).length, np = Object.keys(def.properties || {}).length;
  document.getElementById('variantsBox').textContent =
    nv || np ? [nv && `${nv} ${(def.variantLabel || 'level').toLowerCase()}s (now: ${def.variants.find(v => v.id === currentVariant)?.label})`, np && `${np} properties`].filter(Boolean).join(' · ') : 'None yet';
  document.querySelectorAll('.model-item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === def.id)));
  // Phones: details live at the top of the guide sheet; keep the chosen chip in view
  document.getElementById('guideAbout').innerHTML =
    `<p style="margin:0">${esc(def.description || '')}</p><dl class="specs">${document.getElementById('modelSpecs').innerHTML}</dl>`;
  const chip = document.querySelector(`.model-item[data-id="${def.id}"]`);
  if (chip && matchMedia('(max-width:820px)').matches) chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  try { localStorage.setItem('modellab:model', def.id); } catch {}
}

function resize() {

  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';

}

const clock = new THREE.Clock();
function liftToGround(wrapper, obj) {
  wrapper.position.y = 0; wrapper.updateMatrixWorld(true);
  const box = solidBox(obj);
  wrapper.position.y = box.min.y < 0 ? -box.min.y : 0;
}
function restJoints(obj) {
  obj?.traverse(o => {
    const j = o.userData.joint; if (!j) return;
    if (j.type === 'translate') o.position[j.axis] = 0;
    else if (j.type === 'scale') o.scale[j.axis] = 1;
    else o.rotation[j.axis] = 0;
  });
}
function applyJoints(t) {
  current?.traverse(o => {
    const j = o.userData.joint;
    if (!j || j.type === 'scale') return;
    if (j.type === 'translate') {       // recoil-style: kick at 2.5/s, ease back
      const ph = (t % 0.4) / 0.4;
      o.position[j.axis] = ph < 0.12 ? j.min * ph / 0.12 : j.min * Math.pow(1 - (ph - 0.12) / 0.88, 3);
      return;
    }
    if (j.min !== undefined) {          // limited joint (pitch): ease between limits
      const u = (Math.sin(t * 0.8 + 1) + 1) / 2;
      o.rotation[j.axis] = j.min + (j.max - j.min) * u;
    } else {                            // free yaw: sweep like tracking a target
      o.rotation[j.axis] = Math.sin(t * 0.9) * 1.3 + Math.sin(t * 0.37) * 0.6;
    }
  });
}
const hud = document.getElementById('hud');
let wasAnimating = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  damageFx?.update(dt);                              // damage smoke always drifts
  if (controller?.independent) controller.update(dt);
  else if (animateJoints) {
    if (controller) controller.update(dt); else applyJoints(clock.elapsedTime);
  } else if (wasAnimating) { restJoints(current); controller?.reset(); }
  wasAnimating = animateJoints;
  const label = (animateJoints || controller?.independent) && controller ? controller.state : '';
  if (hud.dataset.label !== label) {
    hud.dataset.label = label;
    hud.textContent = label;
    hud.className = 'hud' + (label ? ' on' : '') + (/^(Locked|Firing)/.test(label) ? ' hot' : '');
  }
  controls.update();
  renderer.render(scene, camera);
});

/* ------------------------------------------------------------------
   Offscreen rendering (thumbnails + 4-angle sheet)
------------------------------------------------------------------ */
// ONE offscreen renderer, reused for thumbnails and screenshots. Creating a
// renderer per thumbnail exhausted phones' WebGL context limit and killed
// the main viewer (models didn't render on mobile).
let offscreen = null;
function getOffscreen() {
  if (!offscreen) {
    offscreen = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    offscreen.setPixelRatio(1);
    offscreen.outputColorSpace = THREE.SRGBColorSpace;
    offscreen.shadowMap.enabled = true; offscreen.shadowMap.type = THREE.PCFSoftShadowMap;
  }
  return offscreen;
}
function renderAngles(obj, angles, size, bg) {
  const r = getOffscreen();
  r.setSize(size, size, false);
  setPencilResolution(size, size, Math.max(1, size / 600));
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = renderer.toneMapping; r.toneMappingExposure = renderer.toneMappingExposure;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  const f = computeFit(obj);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
  const dist = f.radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.08;
  const el = THREE.MathUtils.degToRad(14);
  const prevBg = scene.background;
  scene.background = bg ? new THREE.Color(bg) : null;
  const shown = [];
  const markers = [];
  scene.traverse(o => { if (o.userData.socketMarker) { markers.push([o, o.visible]); o.visible = false; } });
  if (!stage.getObjectById(obj.id) && obj !== stage) { shown.push([stage, stage.visible]); stage.visible = false; }
  const out = angles.map(a => {
    const az = THREE.MathUtils.degToRad(a);
    cam.position.set(f.target.x + dist * Math.cos(el) * Math.sin(az), f.target.y + dist * Math.sin(el), f.target.z + dist * Math.cos(el) * Math.cos(az));
    cam.lookAt(f.target);
    r.render(scene, cam);
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(r.domElement, 0, 0);
    return c;
  });
  shown.forEach(([c, v]) => c.visible = v);
  markers.forEach(([o, v]) => o.visible = v);
  scene.background = prevBg;
  setPencilResolution(host.clientWidth, host.clientHeight);
  return out;
}

async function screenshotSheet() {
  const size = 900, labels = ['FRONT', 'RIGHT', 'BACK', 'LEFT'];
  const frames = renderAngles(current, [0, 90, 180, 270], size, '#2a2928');
  const sheet = document.createElement('canvas');
  sheet.width = size * 4; sheet.height = size;
  const g = sheet.getContext('2d');
  g.fillStyle = '#2a2928'; g.fillRect(0, 0, sheet.width, sheet.height);
  frames.forEach((c, i) => {
    g.drawImage(c, i * size, 0);
    g.fillStyle = 'rgba(236,230,223,.45)';
    g.font = '500 20px "JetBrains Mono", monospace';
    g.textAlign = 'center';
    g.fillText(labels[i], i * size + size / 2, size - 34);
  });
  return new Promise(res => sheet.toBlob(res, 'image/png'));
}

/* ------------------------------------------------------------------
   GLB export (packed into a .zip — .glb isn't an allowed download type)
------------------------------------------------------------------ */
async function exportGLB(obj) {
  const clone = obj.clone(true);
  const strip = [];
  clone.traverse(o => { if (o.userData.helper) strip.push(o); });
  strip.forEach(o => o.parent.remove(o));
  restJoints(clone);                                   // export in rest pose
  clone.traverse(o => {                                // lights off in the file
    if (o.material?.userData?.exportOff) {
      const m = o.material.clone(); m.emissiveIntensity = 0; o.material = m;
    }
  });
  clone.position.set(0, clone.position.y, 0);
  const exporter = new GLTFExporter();
  return exporter.parseAsync(clone, { binary: true, onlyVisible: true });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files) { // [{name, data:Uint8Array}] – stored, no compression
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ------------------------------------------------------------------
   Assembly guide (generated from the built hierarchy + model notes)
------------------------------------------------------------------ */
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
const guideEl = document.getElementById('guide');
const btnGuide = document.getElementById('btnGuide');

function hierarchyLines(obj) {
  const lines = [];
  const interesting = o => o.userData.part || o.userData.socket || o.userData.joint || o.name === 'muzzle_point' || o.name === 'exhaust_point' || o.name === 'beam_point' || o.name === 'smoke_point';
  const label = o => {
    const j = o.userData.joint;
    let tag = '';
    if (o.userData.socket) tag = '<span class="s">  socket</span>';
    else if (o.name === 'muzzle_point') tag = '<span class="s">  shot spawn point</span>';
    else if (o.name === 'exhaust_point') tag = '<span class="s">  smoke spawn point</span>';
    else if (o.name === 'beam_point') tag = '<span class="s">  beam / ping point</span>';
    else if (o.name === 'smoke_point') tag = '<span class="s">  smoke spawn point</span>';
    if (j) tag += `<span class="j">  ← ${esc(j.label || 'Joint')}: ${j.type === 'translate' ? 'position' : 'rotation'}.${j.axis}</span>`;
    else if (o.userData.part) tag += '<span class="s">  part root</span>';
    return esc(o.name) + tag;
  };
  const walk = (o, prefix, isLast, isRoot) => {
    if (interesting(o) || isRoot) {
      lines.push(isRoot ? label(o) : prefix + (isLast ? '└─ ' : '├─ ') + label(o));
      prefix = isRoot ? '' : prefix + (isLast ? '   ' : '│  ');
    }
    const kids = [];
    const collect = c => { if (interesting(c)) kids.push(c); else c.children.forEach(collect); };
    if (interesting(o) || isRoot) o.children.forEach(collect);
    kids.forEach((k, i) => walk(k, prefix, i === kids.length - 1, false));
  };
  walk(obj, '', true, true);
  return lines.join('\n');
}

function jointRows(obj) {
  const rows = [];
  obj.traverse(o => {
    const j = o.userData.joint; if (!j) return;
    const prop = ({ translate: 'position.', scale: 'scale.' }[j.type] || 'rotation.') + j.axis;
    let range = 'free';
    if (j.min !== undefined) range = j.type !== 'rotate'
      ? `${j.min} … ${j.max}`
      : `${j.min} … ${j.max} rad (${Math.round(j.min * 57.3)}° … ${Math.round(j.max * 57.3)}°)`;
    rows.push(`<tr><td><code>${esc(o.name)}</code></td><td>${prop}</td><td>${esc(range)}</td><td class="note">${esc(j.note || '')}</td></tr>`);
  });
  return rows.join('');
}

function renderGuide() {
  const def = currentDef;
  document.getElementById('guideTitle').textContent = def.name;
  let html = `<h4>Hierarchy</h4><pre>${hierarchyLines(current)}</pre>`;
  const jr = jointRows(current);
  html += jr
    ? `<h4>Moving nodes</h4><table><thead><tr><th>Node</th><th>Property</th><th>Range</th><th></th></tr></thead><tbody>${jr}</tbody></table>`
    : `<h4>Moving nodes</h4><p class="note">None — this part is static.</p>`;
  if (def.kind === 'part') {
    html += `<h4>Attaching</h4><ol>`;
    html += def.plugsInto ? `<li>Parent this part's root (<code>${esc(current.name)}</code>) to <code>${esc(def.plugsInto.split('→ ')[1])}</code> on <b>${esc(MODELS.find(m => def.plugsInto.startsWith(m.id))?.name || '')}</b>.</li><li>Keep its local position and rotation at 0 and scale at 1.</li>` : `<li>This is the root part. Place it on the ground; its origin is at ground level.</li>`;
    if ((def.sockets || []).length) html += `<li>Next parts attach to: ${def.sockets.map(n => `<code>socket_${esc(n)}</code>`).join(', ')}.</li>`;
    html += `</ol>`;
  }
  if (def.damageNotes) {
    html += `<h4>Damage states</h4><table><tbody>${Object.entries(def.damageNotes).map(([k, v]) =>
      `<tr><td><b>${k == currentDamage ? '▸ ' : ''}${esc(DAMAGE_STATES[k].label)}</b></td><td class="note">${esc(v)}</td></tr>`).join('')}</tbody></table>
      <p class="note">Damage stacks on any level (3 levels × 3 damage states = 9 damaged turrets). Scorch patches are meshes named <code>Scorch_n</code>, parented to the part they sit on so they turn and tilt with it. Smoke spawns from <code>damage_smoke_*</code> empties (head from Medium, base at Critical). There is no "destroyed" state — remove the turret instead.</p>`;
  }
  if (def.levelNotes) {
    html += `<h4>Levels</h4><table><tbody>${Object.entries(def.levelNotes).map(([k, v]) =>
      `<tr><td><b>${k == currentVariant ? '▸ ' : ''}Level ${esc(k)}</b></td><td class="note">${esc(v)}</td></tr>`).join('')}</tbody></table>`;
  }
  const g = def.guide;
  if (g) {
    if (g.assemble) html += `<h4>How to assemble</h4><ol>${g.assemble.map(x => `<li>${x}</li>`).join('')}</ol>`;
    if (g.animate) html += `<h4>How to animate</h4><table><thead><tr><th>Node</th><th>Property</th><th>Range</th><th>Rule</th></tr></thead><tbody>${
      g.animate.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="note">${esc(r[3])}</td></tr>`).join('')}</tbody></table>`;
    if (g.behaviour) html += `<h4>Behaviour loop</h4><table><tbody>${
      g.behaviour.map(r => `<tr><td><b>${esc(r[0])}</b></td><td class="note">${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
    if (g.code) html += `<h4>Reference code (three.js-style)</h4><pre>${esc(g.code)}</pre>
      <p class="note" style="margin-top:8px">Joint data (type, axis, limits) is also stored in each joint node's glTF <code>extras</code>, so your loader can read it instead of hard-coding.</p>`;
  }
  document.getElementById('guideBody').innerHTML = html;
}

}

      b.textContent = d.label;
      b.setAttribute('aria-pressed', String(d.id === currentDamage));
      b.addEventListener('click', () => { if (d.id !== currentDamage) selectModel(def.id, currentVariant, d.id); });
      seg.appendChild(b);
    });
    listEl.appendChild(seg);
    const dn = def.damageNotes?.[currentDamage];
    if (dn && currentDamage) { const n = document.createElement('p'); n.className = 'seg-note'; n.textContent = dn; listEl.appendChild(n); }
  }
  entries.forEach(([key, p]) => {
    let on = !!p.default;
    controller?.setProp?.(key, on);
    const b = document.createElement('button');
    b.className = 'btn toggle'; b.setAttribute('aria-pressed', String(on));
    b.innerHTML = '<span class="lbl"></span><span class="pill"></span>';
    b.querySelector('.lbl').textContent = p.label;
    b.addEventListener('click', () => {
      on = !on; b.setAttribute('aria-pressed', String(on));
      controller?.setProp?.(key, on);
    });
    listEl.appendChild(b);
  });
}

// Downloads via the artifact runtime
const btnGlb = document.getElementById('btnGlb');
const btnShots = document.getElementById('btnShots');
let downloads = null;

async function save(filename, data) {
  if (!downloads) { toast('Downloads aren’t available in this view'); return; }
  try {
    const r = await downloads.save({ filename, data });
    if (r?.status === 'saved') toast(`Saved ${filename}`);
  } catch (err) {
    if (err?.code === 'declined') toast('Download cancelled');
    else if (err?.code === 'rate_limited') toast('A download prompt is already open');
    else toast('Couldn’t save the file');
  }
}

btnGlb.addEventListener('click', async () => {
  btnGlb.disabled = true;
  try {
    controller?.reset?.();                              // rockets back in their tubes
    const glb = new Uint8Array(await exportGLB(current));
    const zip = makeZip([{ name: `${fileBase()}.glb`, data: glb }]);
    await save(`${fileBase()}-glb.zip`, zip);
  } catch (e) { console.error(e); toast('Export failed'); }
  btnGlb.disabled = !downloads;
});

btnShots.addEventListener('click', async () => {
  btnShots.disabled = true;
  try { await save(`${fileBase()}-4-angles.png`, await screenshotSheet()); }
  catch (e) { console.error(e); toast('Screenshot failed'); }
  btnShots.disabled = !downloads;
});

(async () => {
  for (let i = 0; i < 50 && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 200));
  try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch { downloads = null; }
  btnGlb.disabled = btnShots.disabled = !downloads;
  if (!downloads) { btnGlb.title = btnShots.title = 'Downloads aren’t available in this view'; }
})();

// expose for quick testing
window.__modelLab = { MODELS, selectModel, exportGLB, screenshotSheet, makeZip };
</script>
