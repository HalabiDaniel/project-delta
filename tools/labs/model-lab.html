<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1c1b; --panel:#262423; --panel2:#2e2b29; --line:#3a3633;
    --text:#ece6df; --muted:#9d958c; --kraft:#c49a6c; --kraft-d:#8a6a47; --dark:#4a4440;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh;height:100dvh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  .brand h1 .box{width:16px;height:16px;background:var(--kraft);border-radius:2px;box-shadow:inset -4px -4px 0 var(--kraft-d)}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:12px}
  .section-label{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 20px 8px}
  .model-list{padding:0 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
  .model-list .section-label{padding:10px 8px 2px}
  .model-item{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px;border-radius:8px;border:1px solid transparent}
  .model-item:hover{background:var(--panel2)}
  .model-item[aria-selected="true"]{background:var(--panel2);border-color:var(--kraft-d)}
  .model-item:focus-visible{outline:2px solid var(--kraft)}
  .thumb{width:44px;height:44px;border-radius:6px;background:#1f1e1d;flex:none;display:grid;place-items:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .model-item .t{font-size:14px;font-weight:500}
  .model-item .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .details{margin-top:auto;border-top:1px solid var(--line);padding-bottom:16px;overflow:auto}
  .details .desc{padding:0 20px;font-size:13px;line-height:1.5;color:#cfc7be}
  .specs{margin:12px 20px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-family:"JetBrains Mono",monospace;font-size:12px}
  .specs dt{color:var(--muted)} .specs dd{margin:0;text-align:right}
  .placeholder{margin:10px 20px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
  main{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 40%,#353230 0%,#232120 60%,#1b1a19 100%)}
  #viewport{position:absolute;inset:0}
  #viewport canvas{display:block;outline:none}
  .topbar{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .title-block{pointer-events:auto;min-width:0}
  .title-block h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-only{display:none}
  .guide-about{padding:14px 20px 0;font-size:13.5px;line-height:1.5;color:#cfc7be}
  .guide-about .specs{margin:10px 0 0}
  .title-block .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--kraft)}
  .title-block h2{margin:4px 0 0;font-size:24px;font-weight:600}
  .toolbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(38,36,35,.92);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
  .toolbar{max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar > *{flex:none}
  .btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
  .btn:hover{background:var(--panel2)}
  .btn:focus-visible{outline:2px solid var(--kraft)}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--kraft);color:#24190d}
  .btn.primary:hover{background:#d2aa7e}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .toggle .pill{width:28px;height:16px;border-radius:99px;background:#4a4542;position:relative;transition:background .15s}
  .toggle .pill::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#d8d0c7;transition:transform .15s}
  .toggle[aria-pressed="true"] .pill{background:var(--kraft)}
  .toggle[aria-pressed="true"] .pill::after{transform:translateX(12px);background:#fff}
  .sep{width:1px;background:var(--line);margin:4px 2px}
  .hint{position:absolute;bottom:26px;right:20px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
  .top-right{display:flex;gap:10px;align-items:center;pointer-events:auto}
  .btn.ghost{background:rgba(38,36,35,.85);border:1px solid var(--line)}
  .btn.icon{padding:8px}
  .hud{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(38,36,35,.85);border:1px solid var(--line)}
  .hud.on{display:flex}
  .hud::before{content:"";width:8px;height:8px;border-radius:50%;background:#8a8178}
  .hud.on::before{background:var(--kraft)}
  .hud.hot{color:#ffb27a}
  .hud.hot::before{background:#ff7a3c;box-shadow:0 0 8px #ff7a3c}
  .guide{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:rgba(34,32,31,.97);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;backdrop-filter:blur(10px)}
  .guide[hidden]{display:none}
  .guide-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .guide-head .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--kraft)}
  .guide-head h3{margin:4px 0 0;font-size:20px;font-weight:600}
  .guide-body{overflow:auto;padding:4px 20px 28px;font-size:13.5px;line-height:1.55;color:#d9d1c8}
  .guide-body h4{margin:22px 0 8px;font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .guide-body pre{margin:0;background:#1a1918;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.55;overflow:auto;color:#e6ddd2}
  .guide-body pre .j{color:#ffb27a} .guide-body pre .s{color:var(--muted)}
  .guide-body ol{margin:0;padding-left:20px} .guide-body li{margin:4px 0}
  .guide-body code{font-family:"JetBrains Mono",monospace;font-size:12px;background:#1a1918;padding:1px 5px;border-radius:4px;color:#f0c79a}
  .guide-body table{width:100%;border-collapse:collapse;font-size:12.5px}
  .guide-body th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
  .guide-body td{padding:8px 8px 8px 0;border-bottom:1px solid #322f2c;vertical-align:top}
  .guide-body td:first-child{white-space:nowrap}
  .guide-body .note{color:var(--muted);font-size:12.5px}
  .props{position:absolute;top:84px;left:20px;background:rgba(38,36,35,.92);border:1px solid var(--line);border-radius:12px;padding:10px 6px 6px;min-width:200px;max-width:300px;backdrop-filter:blur(8px)}
  .props[hidden]{display:none}
  .props .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
  .props .seg{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 6px}
  .props .seg button{min-width:52px}
  .props .seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 4px;white-space:nowrap;border-radius:7px;font-size:13px;font-weight:600;background:#2e2b29;color:var(--muted);border:1px solid var(--line)}
  .props .seg button[aria-pressed="true"]{background:var(--kraft);color:#24190d;border-color:var(--kraft)}
  .props .seg button:focus-visible{outline:2px solid var(--kraft)}
  .props .seg-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px 5px}
  .props .seg.dmg button{font-size:12px}
  .props .seg.dmg button[aria-pressed="true"]{background:#7a2e22;color:#ffd9cc;border-color:#a3402f}
  .props .seg-note{margin:2px 8px 6px;font-size:12px;line-height:1.45;color:#cfc7be;max-width:240px}
  .props .btn{width:100%;justify-content:space-between;box-sizing:border-box;padding:8px 10px}
  .toast{position:absolute;top:20px;left:50%;transform:translate(-50%,-8px);opacity:0;transition:all .2s;background:#2e2b29;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  /* ---------- Tablets: slimmer sidebar ---------- */
  @media (max-width:1100px) and (min-width:821px){
    .app{grid-template-columns:240px minmax(0,1fr)}
    .toolbar .btn{padding:8px 10px;font-size:12.5px}
    .hint,.btn .lbl-long{display:none}
    .details{max-height:42%}
  }
  /* ---------- Phones: viewer first ---------- */
  @media (max-width:820px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    aside{min-width:0;border-right:0;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:baseline;gap:10px;padding:max(10px, env(safe-area-inset-top)) 14px 4px}
    .brand h1{font-size:15px}
    .brand p{margin:0;font-size:11px}
    .model-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 10px 10px;gap:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .model-list::-webkit-scrollbar{display:none}
    .model-list .section-label{display:flex;align-items:center;flex:none;padding:0 2px 0 6px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.14em;border-left:1px solid var(--line)}
    .model-list .section-label:first-child{border-left:0}
    .model-item{flex:none;flex-direction:column;gap:4px;padding:5px;width:78px;text-align:center;scroll-snap-align:start}
    .thumb{width:60px;height:60px}
    .model-item .s{display:none}
    .model-item .t{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
    .details{display:none}
    .mobile-only{display:block}
    .topbar{top:10px;left:12px;right:12px;gap:8px}
    .title-block .k{font-size:9.5px}
    .title-block h2{font-size:18px;margin-top:2px}
    .top-right{gap:6px;flex:none}
    #btnGuide{padding:8px}
    #btnGuide .lbl{display:none}
    .hud{font-size:9.5px;padding:6px 8px;letter-spacing:.05em}
    .hint{display:none}
    .btn .lbl-long{display:none}
    .toolbar{left:0;right:0;bottom:0;transform:none;border-radius:0;border-left:0;border-right:0;border-bottom:0;
      overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;gap:4px;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar .btn{flex:none;padding:9px 11px;font-size:12.5px;gap:7px}
    .toolbar .sep{flex:none}
    .props{top:auto;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));min-width:0;padding:6px;border-radius:10px}
    .props .k{display:none}
    #propsList{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
    .props .seg{flex:1 1 100%;padding:0 0 2px}
    .props .seg button{padding:8px 0}
    .props .seg-note{display:none}
    .props .btn{width:auto;flex:1 1 auto;padding:7px 10px;font-size:12.5px;gap:8px;background:#2e2b29;border-radius:7px}
    .guide{position:fixed;inset:0;width:100%;border-left:0;z-index:20}
    .guide-head{padding-top:max(14px, env(safe-area-inset-top))}
    .guide-body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    .guide-body table{font-size:12px}
    .guide-body td:first-child{white-space:normal}
    .toast{top:auto;bottom:calc(66px + env(safe-area-inset-bottom))}
  }
  /* Phones in landscape: slim side list, compact controls */
  @media (max-height:500px) and (max-width:1000px){
    .app{grid-template-columns:190px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
    aside{min-width:0;border-right:1px solid var(--line);border-bottom:0;padding-left:env(safe-area-inset-left)}
    .brand,.details{display:none}
    .model-list{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:6px;gap:2px;scroll-snap-type:none}
    .model-list .section-label{writing-mode:horizontal-tb;transform:none;border-left:0;padding:8px 6px 2px;font-size:9.5px}
    .model-item{width:auto;flex-direction:row;gap:8px;padding:4px 6px;text-align:left}
    .thumb{width:30px;height:30px}
    .model-item .s{display:none}
    .model-item .t{font-size:12px;max-width:none}
    .mobile-only{display:block}
    .topbar{top:8px;left:12px;right:calc(12px + env(safe-area-inset-right))}
    .title-block .k{font-size:9px}
    .title-block h2{font-size:16px;margin-top:2px}
    #btnGuide{padding:7px} #btnGuide .lbl{display:none}
    .hud{font-size:9.5px;padding:5px 8px}
    .hint,.btn .lbl-long{display:none}
    .toolbar{left:8px;right:calc(8px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));transform:none;border-radius:10px;border:1px solid var(--line);
      overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;gap:2px;padding:4px;scrollbar-width:none}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar .btn{flex:none;padding:6px 9px;font-size:12px;gap:6px}
    .toolbar .sep{flex:none}
    .props{top:56px;bottom:auto;left:10px;right:auto;min-width:0;max-width:240px;padding:5px;border-radius:10px}
    .props .k,.props .seg-note{display:none}
    #propsList{display:flex;flex-direction:column;gap:3px}
    .props .seg{padding:0}
    .props .seg button{padding:5px 0;font-size:12px}
    .props .btn{width:100%;padding:5px 8px;font-size:12px}
    .guide{position:fixed;inset:0;width:100%;border-left:0;z-index:20}
    .toast{top:auto;bottom:56px}
  }
</style>

<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1><span class="box"></span>Model Lab</h1>
      <p>Low-poly asset showcase</p>
    </div>
    <div class="model-list" id="modelList" role="listbox" aria-label="Models"></div>
    <div class="details">
      <div class="section-label">Details</div>
      <div class="desc" id="modelDesc"></div>
      <dl class="specs" id="modelSpecs"></dl>
      <div class="section-label">Properties &amp; variants</div>
      <div class="placeholder" id="variantsBox">None yet</div>
    </div>
  </aside>
  <main>
    <div id="viewport"></div>
    <div class="topbar">
      <div class="title-block"><div class="k" id="modelKicker">Model</div><h2 id="modelTitle">—</h2></div>
      <div class="top-right">
        <div class="hud" id="hud"></div>
        <button class="btn ghost" id="btnGuide" aria-label="Assembly guide" aria-expanded="false" aria-controls="guide"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6M9 11h6"/></svg><span class="lbl">Assembly guide</span></button>
      </div>
    </div>
    <aside class="guide" id="guide" aria-label="Assembly guide" hidden>
      <div class="guide-head"><div><div class="k">Guide</div><h3 id="guideTitle">—</h3></div>
        <button class="btn icon" id="btnGuideClose" aria-label="Close guide"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="guide-about mobile-only" id="guideAbout"></div>
      <div class="guide-body" id="guideBody"></div>
    </aside>
    <div class="props" id="propsCard" hidden><div class="k">Properties</div><div id="propsList"></div></div>
    <div class="toast" id="toast"></div>
    <div class="toolbar">
      <button class="btn toggle" id="btnRotate" aria-pressed="true" title="Toggle auto-rotate (R)"><span class="pill"></span>Auto-rotate</button>
      <button class="btn" id="btnReset" title="Reset view (F)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset</button>
      <span class="sep"></span>
      <button class="btn toggle" id="btnJoints" aria-pressed="true" title="Play the animation (J)"><span class="pill"></span>Animate</button>
      <button class="btn toggle" id="btnPencil" aria-pressed="true" title="Hand-drawn pencil edges (P)"><span class="pill"></span>Pencil</button>
      <button class="btn toggle" id="btnSockets" aria-pressed="true" title="Show attachment sockets (S)"><span class="pill"></span>Sockets</button>
      <span class="sep"></span>
      <button class="btn" id="btnShots" disabled title="Front, right, back and left views in one PNG"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Screenshot<span class="lbl-long">&nbsp;×4</span></button>
      <button class="btn primary" id="btnGlb" disabled title="GLB, packed in a .zip"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Download GLB</button>
    </div>
    <div class="hint">R rotate · J animate · P pencil · S sockets · G guide</div>
  </main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ------------------------------------------------------------------
   Materials: procedural cardboard
------------------------------------------------------------------ */
function makeCardboardTexture(seed = 1, base = [196, 154, 108]) {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  let s = seed * 9301 + 49297;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const n = (rnd() - 0.5) * 18;
      const corr = Math.sin(x / S * Math.PI * 2 * 48) * 3.2;   // corrugation ribs
      const blot = Math.sin(x * 0.013 + y * 0.009) * Math.cos(y * 0.017 - x * 0.004) * 6;
      img.data[i]   = base[0] + n + corr + blot;
      img.data[i+1] = base[1] + n * 0.9 + corr + blot;
      img.data[i+2] = base[2] + n * 0.75 + corr * 0.8 + blot * 0.8;
      img.data[i+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  // fibers
  for (let k = 0; k < 220; k++) {
    g.strokeStyle = `rgba(${rnd() > .5 ? '90,62,35' : '235,205,165'},${0.08 + rnd() * 0.12})`;
    g.lineWidth = 0.6 + rnd();
    const x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI, l = 4 + rnd() * 14;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // edge darkening (torn/folded card edges)
  const grd = g.createLinearGradient(0, 0, 0, S);
  grd.addColorStop(0, 'rgba(80,55,30,.35)'); grd.addColorStop(.05, 'rgba(80,55,30,0)');
  grd.addColorStop(.95, 'rgba(80,55,30,0)'); grd.addColorStop(1, 'rgba(80,55,30,.35)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

let showSockets = true, animateJoints = true, pencilOn = true;

// Textures are generated once per look and shared by every model —
// regenerating 512² canvases per material was slow and memory-hungry on phones.
const TEX_CACHE = new Map();
function cachedTexture(kind, maker, seed, base) {
  const key = `${kind}:${seed}:${base}`;
  if (!TEX_CACHE.has(key)) { const t = maker(seed, base); t.userData.shared = true; TEX_CACHE.set(key, t); }
  return TEX_CACHE.get(key);
}
function cardboardTexture(seed, base) { return cachedTexture('card', makeCardboardTexture, seed, base); }

const OFFSET = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
const MAT = {
  cardboard: () => new THREE.MeshStandardMaterial({ name: 'Cardboard', map: cardboardTexture(3), roughness: 0.92, metalness: 0, flatShading: true, ...OFFSET }),
  cardboardLid: () => new THREE.MeshStandardMaterial({ name: 'CardboardLid', map: cardboardTexture(7, [204, 163, 117]), roughness: 0.9, metalness: 0, flatShading: true, ...OFFSET }),
  rubber: () => new THREE.MeshStandardMaterial({ name: 'DarkTape', color: 0x4a4440, roughness: 0.85, metalness: 0, flatShading: true, ...OFFSET }),
};

/* ------------------------------------------------------------------
   Edge styling – viewer only, stripped from exports
   • Pencil (default): every hard edge redrawn as 2–3 graphite strokes,
     never running past the corners, like a sketch.
   • Seams: the plain thin fold lines (shown when Pencil is off).
------------------------------------------------------------------ */
const PENCIL = {
  heavy: new LineMaterial({ color: 0x1f1b18, linewidth: 2.6, transparent: true, opacity: 0.92, depthWrite: false }),
  light: new LineMaterial({ color: 0x29241f, linewidth: 1.6, transparent: true, opacity: 0.6, depthWrite: false }),
};
Object.values(PENCIL).forEach(m => { m.userData.shared = true; m.userData.baseWidth = m.linewidth; });
function setPencilResolution(w, h, widthScale = 1) {
  Object.values(PENCIL).forEach(m => { m.resolution.set(w, h); m.linewidth = m.userData.baseWidth * widthScale; });
}

let pencilSeed = 1337;
const prand = () => ((pencilSeed = (pencilSeed * 16807) % 2147483647) / 2147483647);

function makePencil(edges) {
  const src = edges.attributes.position.array;
  const heavy = [], light = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), d = new THREE.Vector3(), j = new THREE.Vector3();
  const jitter = amt => j.set(prand() - 0.5, prand() - 0.5, prand() - 0.5).multiplyScalar(amt * 2);
  // Strokes never extend past the edge's endpoints: they start/stop at the
  // corner or a little short of it (inset), so nothing pokes out of the model.
  const stroke = (out, wobble, inset) => {
    const len = d.subVectors(b, a).length();
    d.normalize();
    const maxIn = Math.min(inset, len * 0.2);
    const p = a.clone().addScaledVector(d, prand() * maxIn).add(jitter(wobble));
    const q = b.clone().addScaledVector(d, -prand() * maxIn).add(jitter(wobble));
    out.push(p.x, p.y, p.z, q.x, q.y, q.z);
  };
  for (let i = 0; i < src.length; i += 6) {
    a.fromArray(src, i); b.fromArray(src, i + 3);
    stroke(heavy, 0.0015, 0);                          // firm line, corner to corner
    stroke(light, 0.003, 0.05);                        // looser pass, stops short
    if (prand() < 0.45) stroke(light, 0.004, 0.09);    // occasional extra pass
  }
  const g = new THREE.Group();
  g.userData.helper = true; g.userData.pencil = true;
  g.visible = pencilOn;
  [[heavy, PENCIL.heavy], [light, PENCIL.light]].forEach(([arr, mat]) => {
    const geo = new LineSegmentsGeometry(); geo.setPositions(arr);
    const l = new LineSegments2(geo, mat);
    l.userData.helper = true;
    l.renderOrder = 2;
    g.add(l);
  });
  return g;
}

function addSeams(mesh, color = 0x6e5234, opacity = 0.55, threshold = 25) {
  const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const e = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
  e.userData.helper = true; e.userData.seam = true;
  e.visible = !pencilOn;
  mesh.add(e);
  mesh.add(makePencil(edges));
  return mesh;
}

// Bounding box of the solid geometry only (ignores strokes, markers)
function solidBox(obj) {
  const box = new THREE.Box3(), tmp = new THREE.Box3();
  obj.updateWorldMatrix(true, true);                 // include parents (stage lift / hover)
  obj.traverse(o => {
    if (!o.isMesh || o.userData.helper) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
    box.union(tmp);
  });
  return box;
}

/* ------------------------------------------------------------------
   Model: Cardboard platform base
   Hexagon platform + 3 splayed legs with dark foot caps
------------------------------------------------------------------ */
function buildPlatformBase(damage = 0) {
  const wrecked = damage >= 3;
  const root = new THREE.Group(); root.name = 'PlatformBase';
  root.userData.part = 'platform-base';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();

  // Hex platform — flat face toward front (+Z)
  const HEX_R = 1.1, HEX_H = 0.5, HEX_START = Math.PI / 6;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(HEX_R * 0.96, HEX_R, HEX_H, 6, 1, false, HEX_START), card);
  body.name = 'Platform'; body.position.y = HEX_H / 2;
  root.add(addSeams(body));

  // Top lid plate (slightly inset, like a folded cardboard cap)
  const lidM = new THREE.Mesh(new THREE.CylinderGeometry(HEX_R * 0.86, HEX_R * 0.95, 0.09, 6, 1, false, HEX_START), lid);
  lidM.name = 'Lid'; lidM.position.y = HEX_H + 0.045;
  root.add(addSeams(lidM));

  // 3 legs on alternating flat faces (60°, 180°, 300°): two read from the front, one at the back
  const LEG_L = 0.7, TILT = 0.6;
  // leg top's outer edge sits flush with the platform's top edge
  const LEG_HALF_W = 0.34 * Math.SQRT1_2;
  const MOUNT_Y = HEX_H - LEG_HALF_W * Math.sin(TILT), MOUNT_R = 0.74;
  const legAngles = [Math.PI / 3, Math.PI, 5 * Math.PI / 3];
  legAngles.forEach((theta, i) => {
    const mount = new THREE.Group();
    mount.name = `LegMount_${i}`;
    mount.position.set(Math.sin(theta) * MOUNT_R, MOUNT_Y, Math.cos(theta) * MOUNT_R);
    mount.rotation.y = theta;                 // local +Z points outward
    root.add(mount);

    const pivot = new THREE.Group();
    pivot.rotation.x = -TILT;                  // splay the leg outward
    mount.add(pivot);

    const broken = wrecked && i === 0;         // critical: front-right leg snapped
    const L = broken ? LEG_L * 0.45 : LEG_L;
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.34, broken ? 0.32 : 0.3, L, 4, 1), card);
    leg.name = `Leg_${i}`;
    leg.rotation.y = Math.PI / 4;              // square faces align with outward dir
    leg.position.y = -L / 2;
    pivot.add(addSeams(leg));
    if (broken) {                              // torn, dark stump end
      const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.3, 0.16, 4, 1), dark);
      stub.name = `Leg_${i}_Break`; stub.rotation.set(Math.PI, Math.PI / 4 + 0.3, 0.25);
      stub.position.y = -L - 0.05; pivot.add(addSeams(stub, 0x2c2826, 0.6));
      return;                                  // foot ends up on the ground as debris
    }

    // Foot cap: flat on the ground, flared
    const endZ = Math.sin(TILT) * LEG_L, endY = -Math.cos(TILT) * LEG_L;
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.39, 0.26, 4, 1), dark);
    foot.name = `Foot_${i}`;
    foot.rotation.y = Math.PI / 4;
    foot.position.set(0, endY + 0.02, endZ + 0.03);
    mount.add(addSeams(foot, 0x2c2826, 0.6));
  });

  // Ground it: lowest point at y = 0
  root.updateMatrixWorld(true);
  const box = solidBox(root);
  root.position.y = -box.min.y;

  // Critical: the platform sags onto rubble, with a hole, cracks, a torn lid flap and debris
  if (wrecked) {
    const th = Math.PI / 3, dx = Math.sin(th), dz = Math.cos(th), G = -root.position.y;   // G = ground in root space
    const chunk = (name, w, h, d, mat, x, y, z, rx, ry, rz) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.name = name; m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
      m.userData.noScorch = true;
      root.add(mat === dark ? addSeams(m, 0x2c2826, 0.6) : addSeams(m)); return m;
    };
    const gap = root.position.y;                     // height between ground and platform bottom
    chunk('Rubble_Support', 0.42, gap + 0.04, 0.38, card, dx * 0.7, G + gap / 2, dz * 0.7, 0, th + 0.3, 0.04);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.39, 0.26, 4, 1), dark);
    foot.name = 'Foot_0_Fallen'; foot.position.set(dx * 1.55, G + 0.26, dz * 1.55 + 0.1); foot.rotation.set(1.35, 0.6, 0.3);
    foot.userData.noScorch = true; root.add(addSeams(foot, 0x2c2826, 0.6));
    chunk('Debris_0', 0.2, 0.08, 0.16, card, dx * 1.25 - 0.3, G + 0.04, dz * 1.25 + 0.35, 0, 0.7, 0.1);
    chunk('Debris_1', 0.14, 0.06, 0.12, lid, dx * 1.35 + 0.25, G + 0.03, dz * 1.35 - 0.2, 0, -0.4, 0);
    chunk('Debris_2', 0.1, 0.05, 0.18, dark, dx * 1.0 + 0.45, G + 0.025, dz * 1.0 + 0.3, 0, 1.2, 0);
    chunk('Debris_3', 0.16, 0.06, 0.1, card, -0.9, G + 0.03, 1.2, 0, 0.3, 0);
    // Hole punched in the platform side above the broken leg
    const hole = new THREE.Shape();
    [[-0.2, -0.08], [-0.07, -0.16], [0.06, -0.1], [0.19, -0.14], [0.17, 0.02], [0.22, 0.12], [0.04, 0.15], [-0.12, 0.1], [-0.22, 0.05]]
      .forEach(([x, y], k) => k ? hole.lineTo(x, y) : hole.moveTo(x, y));
    const hm = new THREE.Mesh(new THREE.ShapeGeometry(hole), SCORCH_MAT.inner);
    const ap = HEX_R * 0.98 * Math.cos(Math.PI / 6) + 0.005;
    hm.name = 'Hole'; hm.position.set(dx * ap, HEX_H * 0.5, dz * ap); hm.rotation.set(0, th, 0);
    hm.userData.noScorch = true; root.add(hm);
    // Cracks on the front face
    [[-0.35, 0.3, 0.5], [-0.22, 0.2, -0.6], [-0.12, 0.27, 0.4]].forEach(([x, y, r], k) => {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.018, 0.01), SCORCH_MAT.inner);
      c.name = `Crack_${k}`; c.position.set(x, y, HEX_R * 0.98 * Math.cos(Math.PI / 6) + 0.006); c.rotation.z = r;
      c.userData.noScorch = true; root.add(c);
    });
    // Torn lid flap bent upward
    const flapShape = new THREE.Shape(); flapShape.moveTo(-0.18, 0); flapShape.lineTo(0.2, 0); flapShape.lineTo(0.02, 0.26); flapShape.closePath();
    const fg = new THREE.ExtrudeGeometry(flapShape, { depth: 0.025, bevelEnabled: false });
    const flap = new THREE.Mesh(fg, lid); flap.name = 'TornFlap';
    flap.position.set(dx * 0.72, HEX_H + 0.08, dz * 0.72); flap.rotation.set(-0.9, th, 0, 'YXZ');
    flap.userData.noScorch = true; root.add(addSeams(flap));
    const smoke = new THREE.Object3D(); smoke.name = 'damage_smoke_base';
    smoke.position.set(dx * (ap + 0.05), HEX_H * 0.55, dz * (ap + 0.05)); root.add(smoke);
  }

  // Socket: top centre of the lid — the Swivel plugs in here
  root.add(makeSocket('swivel', 0, HEX_H + 0.09, 0));
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Swivel (the neck)
   Hex rod on a dark hex collar. Origin = bottom centre = pivot.
   In-game it only spins around its own Y axis; the Housing attaches
   to socket_mount and inherits that rotation.
------------------------------------------------------------------ */
function buildSwivel(level = 1) {
  const root = new THREE.Group(); root.name = 'Swivel';
  root.userData.part = 'swivel';
  root.userData.joint = { type: 'rotate', axis: 'y', label: 'Yaw', note: 'free 360°' };
  const card = MAT.cardboard(), dark = MAT.rubber();
  const START = Math.PI / 6;

  const COLLAR_H = 0.14;
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.44, COLLAR_H, 6, 1, false, START), dark);
  collar.name = 'Collar'; collar.position.y = COLLAR_H / 2;
  root.add(addSeams(collar, 0x2c2826, 0.6));

  const ROD_H = 0.5, ROD_R = 0.26;
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(ROD_R, ROD_R, ROD_H, 6, 1, false, START), card);
  rod.name = 'Rod'; rod.position.y = COLLAR_H + ROD_H / 2 - 0.02;
  root.add(addSeams(rod));

  // Level 2+: turntable ring + three bracing struts (they turn with the swivel)
  if (level >= 2) {
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.63, 0.06, 6, 1, false, START), dark);
    ring.name = 'Turntable'; ring.position.y = 0.03;
    root.add(addSeams(ring, 0x2c2826, 0.6));
    const T = level >= 3 ? 0.09 : 0.07;
    const topR = level >= 3 ? 0.27 : 0.24, topY = level >= 3 ? 0.3 : 0.42;
    for (let i = 0; i < 3; i++) {
      const a = Math.PI / 3 + i * 2 * Math.PI / 3;
      const p0 = new THREE.Vector3(Math.sin(a) * 0.5, 0.06, Math.cos(a) * 0.5);
      const p1 = new THREE.Vector3(Math.sin(a) * topR, topY, Math.cos(a) * topR);
      const dir = p1.clone().sub(p0), len = dir.length();
      const strut = new THREE.Mesh(new THREE.BoxGeometry(T, T, len), dark);
      strut.name = `Brace_${i}`;
      strut.position.copy(p0).addScaledVector(dir, 0.5);
      strut.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.normalize());
      root.add(addSeams(strut, 0x2c2826, 0.6));
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.15), dark);
      foot.name = `BraceFoot_${i}`; foot.position.set(p0.x, 0.085, p0.z); foot.rotation.y = a;
      root.add(addSeams(foot, 0x2c2826, 0.6));
    }
  }
  // Level 3: armoured sleeve on the rod
  if (level >= 3) {
    const jacket = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.33, 0.26, 6, 1, false, START), card);
    jacket.name = 'RodArmour'; jacket.position.y = 0.37;
    root.add(addSeams(jacket));
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.325, 0.325, 0.045, 6, 1, false, START), dark);
    band.name = 'RodArmourBand'; band.position.y = 0.5 + 0.0225;
    root.add(addSeams(band, 0x2c2826, 0.6));
  }

  // Socket: top centre of the rod — the Housing or Trunnion plugs in here
  root.add(makeSocket('mount', 0, COLLAR_H + ROD_H - 0.02, 0));
  finishPart(root);
  return root;
}


/* ------------------------------------------------------------------
   Model: Housing (the head)
   Hexagonal prism, flat face forward (+Z). Origin = bottom centre,
   plugs into socket_mount on the Swivel. A dark bearing collar sits
   on the rod and reaches up into the housing (no gap); everything
   above it lives in "Housing_Pitch", which tilts around X only.
   socket_gun is inside the pitch node, so the gun follows the tilt.
------------------------------------------------------------------ */
const HOUSING = { A: 0.56, H: 0.82, CHAMFER: 0.12, CAP_H: 0.2, LIFT: 0.15, PORT_Y: -0.04 };
HOUSING.R = HOUSING.A / Math.cos(Math.PI / 6);

function buildHousing(level = 1) {
  const { A, R, H, CHAMFER, CAP_H, LIFT, PORT_Y } = HOUSING;
  const WX = level >= 3 ? 1.45 : 1;                  // level 3: wider head
  const root = new THREE.Group(); root.name = 'Housing';
  root.userData.part = 'housing';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const START = Math.PI / 6;
  const hexG = (r1, r2, h) => { const g = new THREE.CylinderGeometry(r1, r2, h, 6, 1, false, START); g.scale(WX, 1, 1); return g; };

  // Bearing collar: sits on the rod top and disappears up into the housing
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.3, CAP_H, 6, 1, false, START), dark);
  cap.name = 'Bearing'; cap.position.y = CAP_H / 2;
  root.add(addSeams(cap, 0x2c2826, 0.6));

  const pitch = new THREE.Group();
  pitch.name = 'Housing_Pitch';
  pitch.position.y = LIFT + CHAMFER + H / 2;       // pivot = centre of the prism
  pitch.userData.joint = { type: 'rotate', axis: 'x', min: -0.5, max: 0.25, label: 'Pitch', note: 'negative = aim up' };
  root.add(pitch);

  const under = new THREE.Mesh(hexG(R, R * 0.78, CHAMFER), card);
  under.name = 'Underside'; under.position.y = -H / 2 - CHAMFER / 2;
  pitch.add(addSeams(under));
  const core = new THREE.Mesh(hexG(R, R, H), card);
  core.name = 'Body';
  pitch.add(addSeams(core));
  const rim = new THREE.Mesh(hexG(R * 1.05, R * 1.05, 0.07), lid);
  rim.name = 'Rim'; rim.position.y = H / 2 - 0.035;
  pitch.add(addSeams(rim));
  const LID_H = 0.2;
  const lidM = new THREE.Mesh(hexG(R * 0.6, R * 1.02, LID_H), lid);
  lidM.name = 'Lid'; lidM.position.y = H / 2 + LID_H / 2;
  pitch.add(addSeams(lidM));

  // Faces of the (possibly stretched) hex: midpoint, outward normal, width
  const verts = [];
  for (let i = 0; i < 6; i++) { const t = START + i * Math.PI / 3; verts.push(new THREE.Vector2(Math.sin(t) * R * WX, Math.cos(t) * R)); }
  const faces = verts.map((v, i) => {
    const w = verts[(i + 1) % 6], mid = v.clone().add(w).multiplyScalar(0.5), d = w.clone().sub(v);
    let n = new THREE.Vector2(d.y, -d.x).normalize(); if (n.dot(mid) < 0) n.negate();
    return { mid, n, width: d.length(), angle: Math.atan2(n.x, n.y) };
  });
  const onFace = (f, mesh, out) => {
    mesh.position.set(f.mid.x + f.n.x * out, mesh.position.y, f.mid.y + f.n.y * out);
    mesh.rotation.y = f.angle; pitch.add(mesh); return mesh;
  };
  const angled = faces.filter(f => Math.abs(f.n.y) < 0.99);
  const backFace = faces.find(f => f.n.y < -0.99);

  if (level === 1) {
    // Folded flaps on the four angled faces
    angled.forEach((f, i) => {
      const flap = new THREE.Mesh(new THREE.BoxGeometry(f.width * 0.78, H * 0.78, 0.05), card);
      flap.name = `Flap_${i}`; flap.position.y = -0.02;
      onFace(f, addSeams(flap), 0.02);
    });
  } else {
    // Armour: dark backing frame + cardboard plate on top
    const armour = (f, name) => {
      const back = new THREE.Mesh(new THREE.BoxGeometry(f.width * 0.86, H * 0.84, 0.04), dark);
      back.name = `${name}_Frame`; back.position.y = -0.01;
      onFace(f, addSeams(back, 0x2c2826, 0.6), 0.02);
      const plate = new THREE.Mesh(new THREE.BoxGeometry(f.width * 0.72, H * 0.7, 0.04), card);
      plate.name = `${name}_Plate`; plate.position.y = -0.01;
      onFace(f, addSeams(plate), 0.055);
    };
    angled.forEach((f, i) => armour(f, `Armour_${i}`));
    if (level >= 3 && backFace) armour(backFace, 'Armour_Back');
  }

  // Front gun port(s)
  const holeMat = new THREE.MeshStandardMaterial({ name: 'PortHole', color: 0x141210, roughness: 1 });
  const port = (name, x, size) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(size, size, 0.14), dark);
    m.name = name; m.position.set(x, PORT_Y, A + 0.05);
    pitch.add(addSeams(m, 0x2c2826, 0.6));
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(size * 0.7, size * 0.7), holeMat);
    hole.name = `${name}_Hole`; hole.position.set(x, PORT_Y, A + 0.121);
    pitch.add(hole);
  };
  const surround = (w, h) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), dark);
    m.name = 'PortSurround'; m.position.set(0, PORT_Y, A + 0.02);
    pitch.add(addSeams(m, 0x2c2826, 0.6));
  };
  if (level >= 3) {
    surround(0.82, 0.44);
    [-0.19, 0.19].forEach((x, i) => {
      port(`GunPort_${i}`, x, 0.3);
      pitch.add(makeSocket(`gun_${i}`, x, PORT_Y, A + 0.12));
    });
  } else {
    if (level === 2) surround(0.5, 0.5);
    port('GunPort', 0, 0.34);
    // Socket: front face of the gun port — the Gun plugs in here (inherits pitch)
    pitch.add(makeSocket('gun', 0, PORT_Y, A + 0.12));
  }
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Gun (the nose)
   Origin = back of the gun port (plugs into socket_gun). The barrel
   lives in "Gun_Recoil", which only slides along its own Z: kicked
   back on each shot, then eased forward again.
------------------------------------------------------------------ */
const GUN = { BACK: 0.32, LEN: 1.4, SIZE: 0.2, RECOIL: 0.22 };

function buildGun() {
  const { BACK, LEN, SIZE, RECOIL } = GUN;
  const root = new THREE.Group(); root.name = 'Gun';
  root.userData.part = 'gun';
  const card = MAT.cardboard(), dark = MAT.rubber();

  const recoil = new THREE.Group();
  recoil.name = 'Gun_Recoil';
  recoil.userData.joint = { type: 'translate', axis: 'z', min: -RECOIL, max: 0, label: 'Recoil', note: 'kick back, ease forward' };
  root.add(recoil);

  // Square cardboard barrel; its back end sits hidden inside the housing
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(SIZE, SIZE, LEN), card);
  barrel.name = 'Barrel';
  barrel.position.z = -BACK + LEN / 2;
  recoil.add(addSeams(barrel));

  // Dark muzzle sleeve with a hollow end
  const MZ = 0.17, TIP = -BACK + LEN;
  const muzzle = new THREE.Mesh(new THREE.BoxGeometry(SIZE + 0.07, SIZE + 0.07, MZ), dark);
  muzzle.name = 'Muzzle';
  muzzle.position.z = TIP - MZ / 2 + 0.02;
  recoil.add(addSeams(muzzle, 0x2c2826, 0.6));
  const bore = new THREE.Mesh(new THREE.PlaneGeometry(SIZE * 0.7, SIZE * 0.7),
    new THREE.MeshStandardMaterial({ name: 'Bore', color: 0x0e0d0c, roughness: 1 }));
  bore.name = 'Bore';
  bore.position.z = TIP + 0.021;
  recoil.add(bore);

  // Muzzle point — useful for spawning shots/flash in the game
  const muzzlePt = new THREE.Object3D(); muzzlePt.name = 'muzzle_point';
  muzzlePt.position.z = TIP + 0.03;
  recoil.add(muzzlePt);

  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Trunnion (the rocket launcher's hinge)
   Plate on the Swivel + two cheek plates with dark hub caps.
   Origin = bottom centre (plugs into socket_mount). The pod hangs
   from "Trunnion_Pitch" at the hub axis and only tilts around X.
------------------------------------------------------------------ */
const TRUN = { PIVOT_Y: 0.6, CHEEK_T: 0.06 };
TRUN.CHEEK_X = (lv = 1) => podDims(lv).SIDE + 0.025 + TRUN.CHEEK_T / 2;   // hugs the pod's sides

// Options let the same builder make the smaller radar version
function buildTrunnion(o = {}) {
  const NAME = o.name || 'Trunnion';
  const PIVOT_Y = o.pivotY ?? TRUN.PIVOT_Y, CHEEK_T = TRUN.CHEEK_T;
  const CHEEK_X = o.cheekX ?? TRUN.CHEEK_X(o.level);
  const SZ = o.sz ?? 1, SY = o.sy ?? 1, HUB_R = o.hubR ?? 0.1;
  const root = new THREE.Group(); root.name = NAME;
  root.userData.part = o.part || 'trunnion';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();

  const plate = new THREE.Mesh(new THREE.BoxGeometry(CHEEK_X * 2 + CHEEK_T + 0.02, 0.08, 0.5 * SZ), lid);
  plate.name = 'Plate'; plate.position.y = 0.04;
  root.add(addSeams(plate));

  // Cheek outline (z, y): a tall hexagon, pointed toward the hub
  const shape = new THREE.Shape();
  [[-0.22, 0.07], [0.22, 0.07], [0.22, 0.52], [0.1, 0.7], [-0.1, 0.7], [-0.22, 0.52]]
    .forEach(([z, y], i) => i ? shape.lineTo(z * SZ, y * SY) : shape.moveTo(z * SZ, y * SY));
  shape.closePath();
  [-1, 1].forEach((side, i) => {
    const g = new THREE.ExtrudeGeometry(shape, { depth: CHEEK_T, bevelEnabled: false });
    g.rotateY(Math.PI / 2); g.translate(-CHEEK_T / 2, 0, 0);
    const cheek = new THREE.Mesh(g, card);
    cheek.name = `Cheek_${i}`; cheek.position.x = side * CHEEK_X;
    root.add(addSeams(cheek));
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(HUB_R, HUB_R, 0.06, 8), dark);
    hub.name = `Hub_${i}`;
    hub.rotation.z = Math.PI / 2;
    hub.position.set(side * (CHEEK_X + CHEEK_T / 2 + 0.03), PIVOT_Y, 0);
    root.add(addSeams(hub, 0x2c2826, 0.6));
  });

  const pitch = new THREE.Group();
  pitch.name = `${NAME}_Pitch`;
  pitch.position.y = PIVOT_Y;
  pitch.userData.joint = { type: 'rotate', axis: 'x', min: o.min ?? -0.55, max: o.max ?? 0.05, label: 'Pitch', note: 'negative = elevate' };
  root.add(pitch);
  pitch.add(makeSocket(o.socket || 'pod', 0, 0, 0));
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Rocket Pod (the launcher head)
   Rectangular cardboard box with two dark straps and a 3×2 tube grid
   (3 across, 2 high) on the front. Origin = hinge axis (plugs into
   socket_pod). Six sockets, socket_rocket_0…5, sit inside the tubes:
   0 1 2 on the top row, 3 4 5 on the bottom (seen from the front).
------------------------------------------------------------------ */
// Pod size per level. Rear edge stays at the same place so the pitch
// clearance over the trunnion plate is identical at every level.
function podDims(level = 1) {
  const d = { COLS: level >= 3 ? 4 : 3, ROWS: 2, CELL: 0.36, BAR: 0.05, NOSE_OUT: 0.32, REAR: -0.35, ARMOUR: level >= 2 };
  d.L = level >= 3 ? 1.85 : 1.7;
  d.CZ = d.REAR + d.L / 2;
  d.W = d.COLS * d.CELL + 0.08;
  d.H = d.ROWS * d.CELL + 0.08;
  d.FRONT = d.CZ + d.L / 2;
  d.COUNT = d.COLS * d.ROWS;
  d.STRAP_PAD = d.ARMOUR ? 0.085 : 0.0125;          // straps stand proud of the armour
  d.SIDE = d.W / 2 + d.STRAP_PAD;                   // outermost x at the hinge
  return d;
}
const POD = podDims(1);

function buildRocketPod(level = 1) {
  const P = podDims(level);
  const { W, H, L, CZ, CELL, BAR, COLS, ROWS, FRONT, NOSE_OUT, REAR, ARMOUR, STRAP_PAD } = P;
  const root = new THREE.Group(); root.name = 'RocketPod';
  root.userData.part = 'rocket-pod';
  const card = MAT.cardboard(), dark = MAT.rubber();

  const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, L), card);
  body.name = 'Body'; body.position.z = CZ;
  root.add(addSeams(body));

  const STRAPS = [REAR + 0.4, FRONT - 0.35];
  STRAPS.forEach((z, i) => {
    const strap = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * STRAP_PAD, H + 2 * STRAP_PAD, 0.14), dark);
    strap.name = `Strap_${i}`; strap.position.z = z;
    root.add(addSeams(strap, 0x2c2826, 0.6));
  });

  // Level 2+: framed armour plates on both sides, the top and the back
  if (ARMOUR) {
    const z0 = STRAPS[0] + 0.1, z1 = STRAPS[1] - 0.1, zl = z1 - z0, zm = (z0 + z1) / 2;
    const plate = (name, w, h, d, x, y, z, mat) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.name = name; m.position.set(x, y, z);
      root.add(mat === dark ? addSeams(m, 0x2c2826, 0.6) : addSeams(m));
    };
    [-1, 1].forEach((s, i) => {
      plate(`SideArmour_${i}_Frame`, 0.035, H * 0.8, zl, s * (W / 2 + 0.0175), 0, zm, dark);
      plate(`SideArmour_${i}_Plate`, 0.04, H * 0.64, zl - 0.14, s * (W / 2 + 0.055), 0, zm, card);
    });
    plate('TopArmour_Frame', W * 0.82, 0.035, zl, 0, H / 2 + 0.0175, zm, dark);
    plate('TopArmour_Plate', W * 0.68, 0.04, zl - 0.14, 0, H / 2 + 0.055, zm, card);
    plate('BackArmour_Frame', W * 0.8, H * 0.78, 0.035, 0, 0, REAR - 0.0175, dark);
    plate('BackArmour_Plate', W * 0.64, H * 0.62, 0.04, 0, 0, REAR - 0.055, card);
  }

  // Tube grid on the front face
  const DEPTH = 0.07, GW = COLS * CELL, GH = ROWS * CELL;
  for (let c = 0; c <= COLS; c++) {
    const v = new THREE.Mesh(new THREE.BoxGeometry(BAR, GH + BAR, DEPTH), dark);
    v.name = `GridV_${c}`; v.position.set(-GW / 2 + c * CELL, 0, FRONT + DEPTH / 2 - 0.01);
    root.add(addSeams(v, 0x2c2826, 0.6));
  }
  for (let r = 0; r <= ROWS; r++) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(GW + BAR, BAR, DEPTH), dark);
    h.name = `GridH_${r}`; h.position.set(0, GH / 2 - r * CELL, FRONT + DEPTH / 2 - 0.01);
    root.add(addSeams(h, 0x2c2826, 0.6));
  }
  const holeMat = new THREE.MeshStandardMaterial({ name: 'TubeDark', color: 0x121110, roughness: 1 });
  let i = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = -GW / 2 + (c + 0.5) * CELL, y = GH / 2 - (r + 0.5) * CELL;
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(CELL - BAR, CELL - BAR), holeMat);
    hole.name = `Tube_${i}`; hole.position.set(x, y, FRONT + 0.002);
    root.add(hole);
    // Rocket tail sits deep in the tube; the whole warhead sticks out past the face
    root.add(makeSocket(`rocket_${i}`, x, y, FRONT + NOSE_OUT - ROCKET.LEN));
    i++;
  }
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Rocket
   Origin = tail centre, nose points +Z. Cardboard body, red nose,
   four dark fins. In-game it's detached from its socket and flown.
------------------------------------------------------------------ */
const ROCKET = { R: 0.078, BODY: 0.58, NOSE: 0.26 };
ROCKET.LEN = ROCKET.BODY + ROCKET.NOSE;

function buildRocket() {
  const { R, BODY, NOSE } = ROCKET;
  const root = new THREE.Group(); root.name = 'Rocket';
  root.userData.part = 'rocket';
  const card = MAT.cardboard(), dark = MAT.rubber();
  const red = new THREE.MeshStandardMaterial({ name: 'RocketRed', color: 0xc4573f, roughness: 0.7, flatShading: true, ...OFFSET });

  const bodyG = new THREE.CylinderGeometry(R, R, BODY, 6); bodyG.rotateX(Math.PI / 2);
  const body = new THREE.Mesh(bodyG, card);
  body.name = 'Body'; body.position.z = BODY / 2;
  root.add(addSeams(body));

  const noseG = new THREE.CylinderGeometry(0, R * 1.12, NOSE, 6); noseG.rotateX(Math.PI / 2);
  const nose = new THREE.Mesh(noseG, red);
  nose.name = 'Nose'; nose.position.z = BODY + NOSE / 2;
  root.add(addSeams(nose, 0x5a2418, 0.6));

  for (let k = 0; k < 4; k++) {
    const fin = new THREE.Group(); fin.rotation.z = Math.PI / 4 + k * Math.PI / 2;
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.07, 0.13), dark);
    f.name = `Fin_${k}`; f.position.set(0, R + 0.03, 0.08);
    fin.add(addSeams(f, 0x2c2826, 0.6));
    root.add(fin);
  }
  const tail = new THREE.Object3D(); tail.name = 'exhaust_point'; tail.position.z = -0.02;
  root.add(tail);
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Rocket Launcher behaviour (demo loop)
   Scan → acquire (raise pod) → salvo of 4 → watch → lower → reload.
   The pod never moves while firing; each rocket leaves its tube,
   accelerates along its nose and trails small smoke puffs.
------------------------------------------------------------------ */
function launcherController(root) {
  const swivel = root.getObjectByName('Swivel');
  const pitch = root.getObjectByName('Trunnion_Pitch');
  const sockets = [];
  for (let i = 0, s; (s = root.getObjectByName(`socket_rocket_${i}`)); i++) sockets.push(s);   // 6 or 8
  const rockets = sockets.map(s => s?.children.find(c => c.userData.part === 'rocket'));
  if (!swivel || !pitch || rockets.some(r => !r) || !root.parent) return null;

  const CYCLE = 16, FIRE_AT = sockets.map((_, i) => 6.7 + i * 0.3), RELOAD_AT = 12.2, RELOAD_DUR = 0.9;
  const AIM_YAW = 0.38, AIM_PITCH = -0.45;
  const world = root.parent;
  const fx = new THREE.Group(); fx.name = '__fx'; world.add(fx);
  const tmp = new THREE.Vector3();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const approach = (v, goal, maxStep) => v + clamp(goal - v, -maxStep, maxStep);

  // Smoke puff pool
  const puffGeo = new THREE.IcosahedronGeometry(1, 0);
  const puffs = Array.from({ length: 220 }, () => {
    const m = new THREE.Mesh(puffGeo, new THREE.MeshStandardMaterial({ color: 0xdcd6ce, roughness: 1, flatShading: true, transparent: true, depthWrite: false }));
    m.visible = false; m.userData.helper = true; m.userData.drift = new THREE.Vector3();
    fx.add(m); return m;
  });
  let puffIdx = 0;
  function spawnPuff(worldPos, size = 1) {
    const p = puffs[puffIdx++ % puffs.length];
    p.position.copy(fx.worldToLocal(worldPos.clone()));
    p.userData.age = 0; p.userData.life = 1.0 + Math.random() * 0.6; p.userData.size = size;
    p.userData.drift.set((Math.random() - 0.5) * 0.25, 0.2 + Math.random() * 0.25, (Math.random() - 0.5) * 0.25);
    p.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    p.visible = true;
  }

  // Exhaust flame (viewer-only helper on each rocket)
  const flameGeo = new THREE.ConeGeometry(0.055, 0.24, 6);
  flameGeo.rotateX(-Math.PI / 2); flameGeo.translate(0, 0, -0.12);
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xffa040 });
  const st = rockets.map(r => {
    const flame = new THREE.Mesh(flameGeo, flameMat);
    flame.userData.helper = true; flame.visible = false;
    r.add(flame);
    return { flying: false, fired: false, v: 0, age: 0, smokeT: 0, flame };
  });

  let t = 0, yaw = 0, pit = 0;

  function homeRocket(i, slide = 0) {
    const r = rockets[i];
    if (r.parent !== sockets[i]) sockets[i].add(r);
    r.position.set(0, 0, -slide); r.rotation.set(0, 0, 0); r.visible = true;
    st[i].flame.visible = false; st[i].flying = false;
  }
  function launch(i) {
    const r = rockets[i];
    root.updateMatrixWorld(true);
    fx.attach(r);
    Object.assign(st[i], { flying: true, fired: true, v: 2.2, age: 0, smokeT: 0 });
    st[i].flame.visible = true;
    // little back-blast at the tube
    for (let k = 0; k < 5; k++) spawnPuff(r.localToWorld(tmp.set((Math.random() - .5) * 0.2, (Math.random() - .5) * 0.2, -0.1)), 1.3);
  }

  const api = {
    state: 'Ready',
    reset() {
      t = 0; yaw = pit = 0; swivel.rotation.y = 0; pitch.rotation.x = 0;
      rockets.forEach((_, i) => { homeRocket(i); st[i].fired = false; });
      puffs.forEach(p => p.visible = false);
    },
    dispose() {
      api.reset();
      rockets.forEach((r, i) => r.remove(st[i].flame));
      world.remove(fx);
      puffs.forEach(p => p.material.dispose()); puffGeo.dispose(); flameGeo.dispose(); flameMat.dispose();
    },
    update(dt) {
      const prev = t;
      t = (t + dt) % CYCLE;
      if (t < prev) rockets.forEach((_, i) => { homeRocket(i); st[i].fired = false; });

      let wantYaw = 0, wantPitch = 0, yawRate = 1.0;
      if (t < 2.6)       { api.state = 'Scanning';  wantYaw = 0.95;  wantPitch = -0.12; }
      else if (t < 5.2)  { api.state = 'Scanning';  wantYaw = -1.0;  wantPitch = -0.08; }
      else if (t < 6.7)  { api.state = 'Acquiring'; wantYaw = AIM_YAW; wantPitch = AIM_PITCH; yawRate = 1.8; }
      else if (t < 11.4) { api.state = t < FIRE_AT[FIRE_AT.length - 1] + 0.3 ? 'Firing' : 'Rockets away'; wantYaw = AIM_YAW; wantPitch = AIM_PITCH; yawRate = 1.8; }
      else if (t < RELOAD_AT) { api.state = 'Lowering'; }
      else if (t < RELOAD_AT + RELOAD_DUR) { api.state = 'Reloading'; }
      else { api.state = 'Ready'; }

      yaw = approach(yaw, wantYaw, yawRate * dt);
      pit = approach(pit, wantPitch, 0.9 * dt);
      swivel.rotation.y = yaw;
      pitch.rotation.x = pit;

      FIRE_AT.forEach((ft, i) => { if (!st[i].fired && t >= ft && t < ft + 1) launch(i); });

      if (t >= RELOAD_AT) {
        const u = clamp((t - RELOAD_AT) / RELOAD_DUR, 0, 1);
        rockets.forEach((_, i) => { if (st[i].fired) homeRocket(i, 0.7 * (1 - u * u * (3 - 2 * u))); });
        if (u >= 1) st.forEach(s => s.fired = false);
      }

      // Flying rockets + smoke trail
      rockets.forEach((r, i) => {
        const s = st[i];
        if (!s.flying) return;
        s.age += dt; s.v += 13 * dt;
        r.translateZ(s.v * dt);
        r.rotateY((Math.sin(s.age * 9 + i) * 0.04) * dt);
        r.rotateX((Math.cos(s.age * 7 + i * 2) * 0.04) * dt);
        s.flame.scale.set(1, 1, 0.75 + Math.random() * 0.6);
        s.smokeT += dt;
        while (s.smokeT > 0.022) { s.smokeT -= 0.022; spawnPuff(r.localToWorld(tmp.set(0, 0, -0.18))); }
        if (s.age > 2.6) { r.visible = false; s.flying = false; s.flame.visible = false; }
      });

      puffs.forEach(p => {
        if (!p.visible) return;
        const d = p.userData;
        d.age += dt;
        const u = d.age / d.life;
        if (u >= 1) { p.visible = false; return; }
        p.scale.setScalar((0.035 + 0.17 * (1 - Math.pow(1 - u, 2))) * d.size);
        p.material.opacity = 0.6 * (1 - u);
        p.position.addScaledVector(d.drift, dt);
      });
    },
  };
  return api;
}

/* ------------------------------------------------------------------
   Model: Mini Trunnion (the radar's hinge)
   Same design as the launcher Trunnion, scaled down: narrower cheeks,
   shorter, smaller hubs. The dish hangs from "MiniTrunnion_Pitch".
------------------------------------------------------------------ */
function buildMiniTrunnion(level = 1) {
  // Level 3's bigger dish needs the hinge a little higher to clear the base
  const lift = level >= 3 ? DISH_L3_R - DISH.R : 0;
  return buildTrunnion({
    name: 'MiniTrunnion', part: 'mini-trunnion', socket: 'dish',
    cheekX: 0.27, pivotY: 0.68 + lift, sz: 0.75, sy: 1.08 * (0.68 + lift) / 0.68, hubR: 0.085,
    min: -0.9, max: 0,          // max 0: the bigger dish never dips into the base
  });
}

/* ------------------------------------------------------------------
   Model: Radar Dish
   Faceted cardboard parabolic bowl with a rim band, three struts and
   a dark octagonal feed horn at the focus. A box mount + axle sits at
   the origin (= hinge axis, plugs into socket_dish). Faces +Z.
------------------------------------------------------------------ */
const DISH = { R: 1.23, DEPTH: 0.45, SEG: 14, OFFSET: 0.42, FOCUS: 0.96 };
const DISH_L3_R = 1.4;                               // level 3 dish radius

function buildRadarDish(level = 1, damage = 0) {
  const broken = damage >= 3;                        // critical: a wedge breaks off the bowl
  // All levels: round dish. Level 2: box feed horn on a cranked boom.
  // Level 3: bigger dish + back truss + IFF bar on top.
  const oval = level >= 2;                           // (name kept: "level 2+ fittings")
  const { SEG, OFFSET } = DISH;
  const R = level >= 3 ? DISH_L3_R : DISH.R;
  const SX = 1, SY = 1;                              // round — set SX/SY to stretch into an oval
  const DEPTH = DISH.DEPTH * R / DISH.R;
  const FOCUS = DISH.FOCUS * R / DISH.R;
  const root = new THREE.Group(); root.name = 'RadarDish';
  root.userData.part = 'radar-dish';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const cardDS = MAT.cardboard(); cardDS.side = THREE.DoubleSide;
  const lidDS = MAT.cardboardLid(); lidDS.side = THREE.DoubleSide;

  // Axle + back mount box between the cheeks
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.5, 8), dark);
  axle.name = 'Axle'; axle.rotation.z = Math.PI / 2;
  root.add(addSeams(axle, 0x2c2826, 0.6));
  // Elongated back block: wraps the axle (origin) and runs forward to the bowl
  const MW = 0.4, MH = 0.38, BACK = -0.24, MLEN = OFFSET - BACK;
  const mount = new THREE.Mesh(new THREE.BoxGeometry(MW, MH, MLEN), card);
  mount.name = 'Mount'; mount.position.z = BACK + MLEN / 2;
  root.add(addSeams(mount));
  // Second, smaller step on the back: tapers in for a slightly curved look
  const TAPER = 0.12, SHRINK = 0.72;
  const capBackG = new THREE.CylinderGeometry(SHRINK * Math.SQRT1_2, Math.SQRT1_2, TAPER, 4, 1);
  capBackG.rotateY(Math.PI / 4);                     // square, axis-aligned
  capBackG.scale(MW, 1, MH);                         // → rectangle MW × MH
  capBackG.rotateX(-Math.PI / 2);                    // small end points backward (−Z)
  const backStep = new THREE.Mesh(capBackG, card);
  backStep.name = 'MountBack'; backStep.position.z = BACK - TAPER / 2;
  root.add(addSeams(backStep));

  // Bowl: parabola z = k·r², lathed into SEG facets with 3 rings
  const k = DEPTH / (R * R);
  const pts = [0.15, 0.52, 0.92, R].map(r => new THREE.Vector2(r, k * r * r));
  // Critical: leave a 2-facet wedge out of the upper-right of the bowl and rim
  const GAP = 2 * (2 * Math.PI / SEG), PHI0 = 0.6 * Math.PI;
  const bowlG = broken ? new THREE.LatheGeometry(pts, SEG - 2, PHI0 + GAP, 2 * Math.PI - GAP) : new THREE.LatheGeometry(pts, SEG);
  bowlG.rotateX(Math.PI / 2);                        // lathe axis Y → Z
  bowlG.scale(SX, SY, 1);                            // oval for level 2+
  const bowl = new THREE.Mesh(bowlG, cardDS);
  bowl.name = 'Bowl'; bowl.position.z = OFFSET;
  root.add(addSeams(bowl, undefined, undefined, 6)); // low threshold → ring creases too

  const capG = new THREE.CylinderGeometry(0.17, 0.17, 0.05, SEG); capG.rotateX(Math.PI / 2); capG.scale(SX, SY, 1);
  const cap = new THREE.Mesh(capG, lid);
  cap.name = 'CentreCap'; cap.position.z = OFFSET + 0.02;
  root.add(addSeams(cap));

  const rimG = broken
    ? new THREE.CylinderGeometry(R + 0.02, R + 0.02, 0.1, SEG - 2, 1, true, PHI0 + GAP, 2 * Math.PI - GAP)
    : new THREE.CylinderGeometry(R + 0.02, R + 0.02, 0.1, SEG, 1, true);
  rimG.rotateX(Math.PI / 2); rimG.scale(SX, SY, 1);
  const rim = new THREE.Mesh(rimG, lidDS);
  rim.name = 'Rim'; rim.position.z = OFFSET + DEPTH - 0.045;
  root.add(addSeams(rim));

  // A straight box between two points (struts, booms, truss arms)
  const bar = (name, a, b, t, mat) => {
    const dir = b.clone().sub(a), len = dir.length();
    const m = new THREE.Mesh(new THREE.BoxGeometry(t, t, len), mat);
    m.name = name; m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.normalize());
    root.add(mat === dark ? addSeams(m, 0x2c2826, 0.6) : addSeams(m));
  };
  const surf = (x, y) => OFFSET + k * ((x / SX) ** 2 + (y / SY) ** 2);   // bowl depth at (x, y)

  if (!oval) {
    // Round dish: octagonal feed horn on three struts
    const hornG = new THREE.CylinderGeometry(0.11, 0.11, 0.2, 8); hornG.rotateX(Math.PI / 2);
    const horn = new THREE.Mesh(hornG, dark);
    horn.name = 'FeedHorn'; horn.position.z = OFFSET + FOCUS;
    root.add(addSeams(horn, 0x2c2826, 0.6));
    const end = new THREE.Vector3(0, 0, OFFSET + FOCUS - 0.09);
    [Math.PI / 2, Math.PI / 2 + 2 * Math.PI / 3, Math.PI / 2 + 4 * Math.PI / 3].forEach((a, i) => {
      const r = 0.78, x = Math.cos(a) * r, y = Math.sin(a) * r;
      bar(`Strut_${i}`, new THREE.Vector3(x, y, surf(x, y)), end, 0.055, card);
    });
  } else {
    // Oval dish: flat box horn held by one cranked boom from the bottom edge
    const horn = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.17, 0.22), dark);
    horn.name = 'FeedHorn'; horn.position.z = OFFSET + FOCUS;
    root.add(addSeams(horn, 0x2c2826, 0.6));
    const y0 = -R * SY * 0.86;
    const p0 = new THREE.Vector3(0, y0, surf(0, y0));
    const p1 = new THREE.Vector3(0, y0 * 0.75, OFFSET + FOCUS * 0.62);
    const p2 = new THREE.Vector3(0, -0.06, OFFSET + FOCUS - 0.1);
    bar('FeedBoom_0', p0, p1, 0.075, dark);
    bar('FeedBoom_1', p1, p2, 0.075, dark);

    if (level >= 3) {
      // Back truss: two arms that follow the curve + a short vertical bar
      const xe = R * SX * 0.82, zb = -0.05;
      const c = new THREE.Vector3(0, 0, OFFSET + zb);
      [-1, 1].forEach((s, i) => {
        const mid = new THREE.Vector3(s * xe * 0.5, 0, surf(xe * 0.5, 0) + zb);
        const tip = new THREE.Vector3(s * xe, 0, surf(xe, 0) + zb);
        bar(`Truss_${i}_A`, c, mid, 0.07, dark);
        bar(`Truss_${i}_B`, mid, tip, 0.07, dark);
      });
      const ye = R * SY * 0.7;
      [-1, 1].forEach((s, i) => {                       // vertical arms, also following the curve
        const mid = new THREE.Vector3(0, s * ye * 0.5, surf(0, ye * 0.5) + zb);
        const tip = new THREE.Vector3(0, s * ye, surf(0, ye) + zb);
        bar(`TrussV_${i}_A`, c, mid, 0.07, dark);
        bar(`TrussV_${i}_B`, mid, tip, 0.07, dark);
      });
      // IFF bar antenna along the top rim
      const yTop = R * SY + 0.17, zTop = OFFSET + DEPTH - 0.05;
      const iff = new THREE.Mesh(new THREE.BoxGeometry(R * SX * 1.05, 0.07, 0.09), dark);
      iff.name = 'IFFBar'; iff.position.set(0, yTop, zTop);
      root.add(addSeams(iff, 0x2c2826, 0.6));
      [-1, 1].forEach((s, i) => bar(`IFFPost_${i}`,
        new THREE.Vector3(s * R * SX * 0.3, R * SY * Math.sqrt(1 - 0.09) - 0.02, surf(R * SX * 0.3, R * SY * 0.954)),
        new THREE.Vector3(s * R * SX * 0.3, yTop - 0.03, zTop), 0.045, dark));
    }
  }

  // Critical: the missing wedge hangs bent off the rim, held at one corner;
  // dark torn edges run along both sides of the gap.
  if (broken) {
    const P = new THREE.Vector3(R * Math.sin(PHI0) * SX, -R * Math.cos(PHI0) * SY, OFFSET + DEPTH);
    const piece = new THREE.Group(); piece.name = 'BrokenPiece';
    piece.position.copy(P); piece.rotation.set(0.55, -0.25, -0.65);
    root.add(piece);
    const wg = new THREE.LatheGeometry(pts, 2, PHI0, GAP); wg.rotateX(Math.PI / 2); wg.scale(SX, SY, 1);
    const wedge = new THREE.Mesh(wg, cardDS); wedge.name = 'BrokenPiece_Bowl';
    wedge.position.set(-P.x, -P.y, OFFSET - P.z); piece.add(addSeams(wedge, undefined, undefined, 6));
    const rg = new THREE.CylinderGeometry(R + 0.02, R + 0.02, 0.1, 2, 1, true, PHI0, GAP); rg.rotateX(Math.PI / 2); rg.scale(SX, SY, 1);
    const rp = new THREE.Mesh(rg, lidDS); rp.name = 'BrokenPiece_Rim';
    rp.position.set(-P.x, -P.y, OFFSET + DEPTH - 0.045 - P.z); piece.add(addSeams(rp));
    [PHI0, PHI0 + GAP].forEach((ph, k) => {
      const at = r => new THREE.Vector3(r * Math.sin(ph) * SX, -r * Math.cos(ph) * SY, surf(r * Math.sin(ph) * SX, -r * Math.cos(ph) * SY));
      bar(`TornEdge_${k}`, at(0.2), at(R), 0.035, dark);
    });
  }

  const beam = new THREE.Object3D(); beam.name = 'beam_point';
  beam.position.z = OFFSET + FOCUS + 0.12;
  root.add(beam);

  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Radar behaviour (demo loop)
   Swivel sweeps left ↔ right; the Mini Trunnion nods the dish up ↔ down
   at a different, slower rhythm, so the pattern never looks mechanical.
------------------------------------------------------------------ */
function radarController(root) {
  const swivel = root.getObjectByName('Swivel');
  const pitch = root.getObjectByName('MiniTrunnion_Pitch');
  if (!swivel || !pitch) return null;
  const pj = pitch.userData.joint;
  let t = 0, lastYaw = 0;
  const api = {
    state: 'Sweeping',
    reset() { t = 0; lastYaw = 0; swivel.rotation.y = 0; pitch.rotation.x = 0; },
    update(dt) {
      t += dt;
      const ease = Math.min(1, t / 1.5);              // glide in from rest
      const yaw = (Math.sin(t * 0.45) * 1.5 + Math.sin(t * 0.17) * 0.5) * ease;
      const pit = (-0.35 + Math.sin(t * 0.6) * 0.3 + Math.sin(t * 0.23) * 0.12) * ease;
      swivel.rotation.y = yaw;
      pitch.rotation.x = Math.min(pj.max, Math.max(pj.min, pit));
      api.state = yaw >= lastYaw ? 'Sweeping ←' : 'Sweeping →';
      lastYaw = yaw;
    },
  };
  return api;
}

/* ------------------------------------------------------------------
   Shared: roll-up door
   "Door_Roll" pivots at the TOP of the opening; opening = scaling Y
   down toward the lintel, so the shutter rolls up and never leaves
   the wall (no poking through the roof).
------------------------------------------------------------------ */
function buildRollDoor(w, h, z, darkMat) {
  const roll = new THREE.Group(); roll.name = 'Door_Roll';
  roll.position.set(0, h, z);
  roll.userData.joint = { type: 'scale', axis: 'y', min: 0.04, max: 1, label: 'Door', note: '1 = closed, 0.04 = rolled up' };
  const shutter = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), darkMat);
  shutter.name = 'Shutter'; shutter.position.y = -h / 2;
  roll.add(addSeams(shutter, 0x2c2826, 0.6));
  const slatMat = MAT.rubber();
  const n = Math.max(4, Math.round(h / 0.17));
  for (let k = 1; k < n; k++) {
    const slat = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, 0.015, 0.012), slatMat);
    slat.name = `Slat_${k}`; slat.position.set(0, -k * h / n, 0.024);
    roll.add(slat);
  }
  return roll;
}

/* ------------------------------------------------------------------
   Model: Storage (warehouse)
   Gable end faces front (+Z) with a big roll-up door and a wall lamp.
   Plank roof with dark trims, dark plinth, three windows per side,
   boxes and yellow bollards by the door.
   Effects (buildingController): lights (windows + lamp + interior), door.
------------------------------------------------------------------ */
const STORE = { W: 2.4, D: 3.0, H: 1.3, RISE: 0.6, T: 0.08, DOOR_W: 1.0, DOOR_H: 1.0 };
const STORE_LV = {
  1: { W: 2.4, D: 3.0, doors: [0] },
  2: { W: 3.6, D: 3.2, doors: [-0.8, 0.8] },
  3: { W: 4.8, D: 3.4, doors: [-1.5, 0, 1.5] },
};

function buildStorage(level = 1, damage = 0) {
  const { H, T, DOOR_W, DOOR_H } = STORE;
  const LV = STORE_LV[level] || STORE_LV[1];
  const { W, D, doors } = LV, RISE = 0.6 + (W - 2.4) * 0.12;
  const many = doors.length > 1;
  const root = new THREE.Group(); root.name = 'Storage';
  root.userData.part = 'storage';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const yellow = new THREE.MeshStandardMaterial({ name: 'Bollard', color: 0xd9a23a, roughness: 0.7, flatShading: true, ...OFFSET });
  const glass = new THREE.MeshStandardMaterial({ name: 'WindowGlass', color: 0x1c1a18, roughness: 0.35, metalness: 0.1, emissive: 0xffbe5c, emissiveIntensity: 0, ...OFFSET });
  const interior = new THREE.MeshStandardMaterial({ name: 'Interior', color: 0x16130f, roughness: 1, emissive: 0xffa94a, emissiveIntensity: 0 });
  glass.userData.exportOff = interior.userData.exportOff = true;
  root.userData.glass = glass; root.userData.interior = interior;
  const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };
  const darkSeams = m => addSeams(m, 0x2c2826, 0.6);

  const inside = new THREE.Mesh(new THREE.BoxGeometry(W - 2 * T - 0.01, H - 0.01, D - 2 * T - 0.01), interior);
  inside.name = 'Interior'; inside.position.y = H / 2;
  root.add(inside);

  // Gable walls (front with door notch, back plain)
  const outline = [[-W / 2, 0]];                       // one notch per door
  doors.forEach(x => outline.push([x - DOOR_W / 2, 0], [x - DOOR_W / 2, DOOR_H], [x + DOOR_W / 2, DOOR_H], [x + DOOR_W / 2, 0]));
  outline.push([W / 2, 0], [W / 2, H], [0, H + RISE], [-W / 2, H]);
  const front = new THREE.Mesh(extrude(poly(outline), T), card);
  front.name = 'FrontWall'; front.position.z = D / 2 - T;
  root.add(addSeams(front));
  const back = new THREE.Mesh(extrude(poly([[-W / 2, 0], [W / 2, 0], [W / 2, H], [0, H + RISE], [-W / 2, H]]), T), card);
  back.name = 'BackWall'; back.position.z = -D / 2;
  root.add(addSeams(back));
  // Side walls between them
  const IZ = D / 2 - T;
  [-1, 1].forEach((side, i) => {
    const g = extrude(poly([[-IZ, 0], [IZ, 0], [IZ, H], [-IZ, H]]), T);
    g.rotateY(Math.PI / 2);
    const wall = new THREE.Mesh(g, card);
    wall.name = `SideWall_${i}`; wall.position.x = side > 0 ? W / 2 - T : -W / 2;
    root.add(addSeams(wall));
  });

  // Plinth band (split around the door)
  const PH = 0.18, PP = 0.04;
  const plinth = (name, w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, PH, d), dark);
    m.name = name; m.position.set(x, PH / 2, z); root.add(darkSeams(m));
  };
  plinth('Plinth_Back', W + 2 * PP, PP, 0, -D / 2 - PP / 2);
  plinth('Plinth_L', PP, D + 2 * PP, -W / 2 - PP / 2, 0);
  plinth('Plinth_R', PP, D + 2 * PP, W / 2 + PP / 2, 0);
  // Front plinth: pieces between the doors
  let px = -(W / 2 + PP);
  [...doors, null].forEach((x, i) => {
    const end = x === null ? W / 2 + PP : x - DOOR_W / 2 - 0.08;
    if (end - px > 0.02) plinth(`Plinth_F${i}`, end - px, PP, (px + end) / 2, D / 2 + PP / 2);
    if (x !== null) px = x + DOOR_W / 2 + 0.08;
  });

  // Each door: jambs, lintel, roll-up door, lamp
  doors.forEach((x, d) => {
    const sfx = many ? `_${d}` : '';
    [-1, 1].forEach((side, i) => {
      const j = new THREE.Mesh(new THREE.BoxGeometry(0.08, DOOR_H, 0.1), dark);
      j.name = `DoorJamb${sfx}_${i}`; j.position.set(x + side * (DOOR_W / 2 + 0.04), DOOR_H / 2, D / 2 + 0.01);
      root.add(darkSeams(j));
    });
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W + 0.26, 0.11, 0.14), dark);
    lintel.name = `DoorLintel${sfx}`; lintel.position.set(x, DOOR_H + 0.055, D / 2 + 0.03);
    root.add(darkSeams(lintel));
    const door = buildRollDoor(DOOR_W, DOOR_H, D / 2 - T / 2, dark);
    door.name = `Door_Roll${sfx}`; door.position.x = x;
    root.add(door);
    const lampBox = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.09, 0.06), dark);
    lampBox.name = `Lamp${sfx}`; lampBox.position.set(x, DOOR_H + 0.32, D / 2 + 0.03);
    root.add(darkSeams(lampBox));
    const lampGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.05), glass);
    lampGlass.name = `Lamp${sfx}_Glass`; lampGlass.position.set(x, DOOR_H + 0.32, D / 2 + 0.061);
    root.add(lampGlass);
  });

  // Windows: three per side wall
  const WW = 0.36, WH = 0.22, WY = 0.88;
  const windowAt = (name, x, z, rotY) => {
    const g = new THREE.Group(); g.name = name; g.position.set(x, WY, z); g.rotation.y = rotY;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(WW + 0.08, WH + 0.08, 0.03), dark);
    frame.name = `${name}_Frame`; frame.position.z = 0.015;
    g.add(darkSeams(frame));
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(WW, WH), glass);
    pane.name = `${name}_Glass`; pane.position.z = 0.032;
    g.add(pane);
    root.add(g);
  };
  (level >= 3 ? [-1.125, -0.375, 0.375, 1.125] : [-0.8, 0, 0.8]).forEach((z, i) => {
    windowAt(`Window_R${i}`, W / 2, z, Math.PI / 2);
    windowAt(`Window_L${i}`, -W / 2, z, -Math.PI / 2);
  });

  // Plank roof: two slopes hinged at the ridge (ridge runs front → back)
  const A = Math.atan2(RISE, W / 2), SL = Math.hypot(RISE, W / 2) + 0.18, RT = 0.07, OH = 0.14, PL = 4;
  const RL = D + 2 * OH;
  [1, -1].forEach((side, i) => {
    const hinge = new THREE.Group(); hinge.name = `RoofSide_${i}`;
    hinge.position.y = H + RISE; hinge.rotation.z = -side * A;
    root.add(hinge);
    for (let k = 0; k < PL; k++) {                   // planks, slightly staggered
      const plank = new THREE.Mesh(new THREE.BoxGeometry(SL, RT, RL / PL - 0.012), lid);
      plank.name = `Roof_${i}_Plank_${k}`;
      plank.position.set(side * (SL / 2 - 0.02), RT / 2 + (k % 2) * 0.006, -RL / 2 + (k + 0.5) * RL / PL);
      hinge.add(addSeams(plank));
    }
    const eave = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.11, RL + 0.04), dark);
    eave.name = `Eave_${i}`; eave.position.set(side * (SL - 0.06), RT / 2, 0);
    hinge.add(darkSeams(eave));
    [-1, 1].forEach((e, k) => {
      const barge = new THREE.Mesh(new THREE.BoxGeometry(SL, 0.11, 0.08), dark);
      barge.name = `Barge_${i}_${k}`; barge.position.set(side * (SL / 2 - 0.02), RT / 2, e * (RL / 2 + 0.02));
      hinge.add(darkSeams(barge));
    });
  });
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, RL + 0.06), dark);
  ridge.name = 'RidgeCap'; ridge.position.y = H + RISE + 0.07;
  root.add(darkSeams(ridge));

  // Boxes + bollards by the door
  const crate = (name, s, x, y, z, rot) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s * 0.85, s), card);
    m.name = name; m.position.set(x, y + s * 0.425, z); m.rotation.y = rot;
    root.add(addSeams(m));
    const tape = new THREE.Mesh(new THREE.BoxGeometry(s + 0.004, 0.035, s * 0.3), lid);
    tape.name = `${name}_Tape`; tape.position.set(0, s * 0.425 - 0.015, 0);
    m.add(tape);
    return s * 0.85;
  };
  const FZ = D / 2 + 0.24;
  const xL = doors[0] - DOOR_W / 2 - 0.42, xR = doors[doors.length - 1] + DOOR_W / 2 + 0.42;
  let h = crate('Crate_L0', 0.34, xL, 0, FZ, 0.05);
  crate('Crate_L1', 0.28, xL + 0.02, h, FZ - 0.01, -0.12);
  h = crate('Crate_R0', 0.34, xR, 0, FZ, -0.04);
  crate('Crate_R1', 0.28, xR + 0.03, h, FZ + 0.01, 0.15);
  crate('Crate_R2', 0.3, W / 2 + 0.22, 0, D / 2 - 0.05, 0.2);   // round the corner
  if (level >= 3) {                                    // more stock outside
    h = crate('Crate_R3', 0.32, W / 2 + 0.24, 0, D / 2 - 0.48, -0.1);
    crate('Crate_R4', 0.26, W / 2 + 0.23, h, D / 2 - 0.46, 0.18);
    h = crate('Crate_S0', 0.34, -W / 2 - 0.24, 0, D / 2 - 0.15, 0.08);
    h += crate('Crate_S1', 0.3, -W / 2 - 0.25, h, D / 2 - 0.14, -0.15);
    crate('Crate_S2', 0.24, -W / 2 - 0.24, h, D / 2 - 0.15, 0.3);
    crate('Crate_S3', 0.3, -W / 2 - 0.25, 0, D / 2 - 0.58, -0.05);
    crate('Crate_L2', 0.3, xL - 0.38, 0, FZ + 0.02, 0.22);
  }
  // Bollards: outside the outer doors and one in each gap between doors
  const bx = [doors[0] - DOOR_W / 2 - 0.2, doors[doors.length - 1] + DOOR_W / 2 + 0.2];
  for (let d = 0; d < doors.length - 1; d++) bx.push((doors[d] + doors[d + 1]) / 2);
  bx.forEach((x, i) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.42, 0.07), yellow);
    b.name = `Bollard_${i}`; b.position.set(x, 0.21, D / 2 + 0.14);
    root.add(addSeams(b, 0x6b4a14, 0.6));
  });

  if (damage) damageStorage(root, { W, D, H, RISE, RT, PL, RL }, damage);
  finishPart(root);
  return damage ? applyDamage(root, level, damage) : root;
}

/* ------------------------------------------------------------------
   Model: Command Center (terminal + control tower)
   Flat-roofed main block with plank roof and dark parapet, sliding
   double doors under a canopy, windows all round. Control tower at
   the back-right: square cardboard shaft, glazed hexagonal cab,
   sloped hex roof, antenna with a red beacon. Red beacon dots on the
   main roof. Effects (buildingController): door, lights, beacons.
------------------------------------------------------------------ */
const CMD = { W: 2.7, D: 1.7, H: 1.0, T: 0.08, DOOR_W: 0.62, DOOR_H: 0.72, TX: 1.2, TZ: -0.55, TS: 0.72, TH: 2.0 };

const CMD_LV = {
  1: { W: 2.7, D: 1.7, H: 1.0,  TS: 0.72, TH: 2.0, CR: 0.5,  hut: false },
  2: { W: 3.4, D: 1.9, H: 1.0,  TS: 0.72, TH: 2.0, CR: 0.5,  hut: true },
  3: { W: 4.0, D: 2.1, H: 1.15, TS: 0.86, TH: 2.6, CR: 0.6,  hut: true },
};

function buildCommandCenter(level = 1, damage = 0) {
  const { T, DOOR_W, DOOR_H } = CMD;
  const LV = CMD_LV[level] || CMD_LV[1];
  const { W, D, H, TS, TH } = LV;
  const TX = W / 2 - TS / 2 + 0.2, TZ = -D / 2 + TS / 2 - 0.06;   // tower: back-right, poking out a little
  const root = new THREE.Group(); root.name = 'CommandCenter';
  root.userData.part = 'command-center';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const yellow = new THREE.MeshStandardMaterial({ name: 'Bollard', color: 0xd9a23a, roughness: 0.7, flatShading: true, ...OFFSET });
  const glass = new THREE.MeshStandardMaterial({ name: 'WindowGlass', color: 0x1c1a18, roughness: 0.35, metalness: 0.1, emissive: 0xffbe5c, emissiveIntensity: 0, side: THREE.DoubleSide, ...OFFSET });
  const interior = new THREE.MeshStandardMaterial({ name: 'Interior', color: 0x16130f, roughness: 1, emissive: 0xffa94a, emissiveIntensity: 0 });
  const roofRed = new THREE.MeshStandardMaterial({ name: 'BeaconRed', color: 0x8a1a12, roughness: 0.5, emissive: 0xff2a1a, emissiveIntensity: 0, flatShading: true });
  const towerRed = new THREE.MeshStandardMaterial({ name: 'BeaconRedTower', color: 0x8a1a12, roughness: 0.5, emissive: 0xff2a1a, emissiveIntensity: 0, flatShading: true });
  [glass, interior, roofRed, towerRed].forEach(m => m.userData.exportOff = true);
  root.userData.glass = glass; root.userData.interior = interior;
  root.userData.beacons = [{ mat: roofRed, period: 1.1, phase: 0 }, { mat: towerRed, period: 1.6, phase: 0.5 }];
  const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };
  const darkSeams = m => addSeams(m, 0x2c2826, 0.6);
  const box = (name, w, h, d, mat, x, y, z, seams = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.name = name; m.position.set(x, y, z);
    root.add(seams ? (mat === dark ? darkSeams(m) : addSeams(m)) : m);
    return m;
  };

  // ---- Main block ----------------------------------------------------
  const inside = box('Interior', W - 2 * T - 0.01, H - 0.01, D - 2 * T - 0.01, interior, 0, H / 2, 0, false);
  const IW = W / 2 - T;
  const front = new THREE.Mesh(extrude(poly([[-IW, 0], [-DOOR_W / 2, 0], [-DOOR_W / 2, DOOR_H], [DOOR_W / 2, DOOR_H], [DOOR_W / 2, 0], [IW, 0], [IW, H], [-IW, H]]), T), card);
  front.name = 'FrontWall'; front.position.z = D / 2 - T; root.add(addSeams(front));
  const back = new THREE.Mesh(extrude(poly([[-IW, 0], [IW, 0], [IW, H], [-IW, H]]), T), card);
