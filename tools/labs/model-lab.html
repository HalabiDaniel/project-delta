  back.name = 'BackWall'; back.position.z = -D / 2; root.add(addSeams(back));
  [-1, 1].forEach((side, i) => box(`SideWall_${i}`, T, H, D, card, side * (W / 2 - T / 2), H / 2, 0));

  // Plinth (split around the door)
  const PH = 0.17, PP = 0.04;
  box('Plinth_Back', W + 2 * PP, PH, PP, dark, 0, PH / 2, -D / 2 - PP / 2);
  box('Plinth_L', PP, PH, D + 2 * PP, dark, -W / 2 - PP / 2, PH / 2, 0);
  box('Plinth_R', PP, PH, D + 2 * PP, dark, W / 2 + PP / 2, PH / 2, 0);
  const fw = W / 2 + PP - (DOOR_W / 2 + 0.07);
  box('Plinth_FL', fw, PH, PP, dark, -(W / 2 + PP) + fw / 2, PH / 2, D / 2 + PP / 2);
  box('Plinth_FR', fw, PH, PP, dark, (W / 2 + PP) - fw / 2, PH / 2, D / 2 + PP / 2);

  // Flat plank roof + dark parapet
  const N = Math.round(W / 0.3);
  for (let k = 0; k < N; k++)
    box(`RoofPlank_${k}`, W / N - 0.012, 0.05, D, lid, -W / 2 + (k + 0.5) * W / N, H + 0.025, 0);
  box('Parapet_F', W + 0.1, 0.12, 0.09, dark, 0, H + 0.06, D / 2);
  box('Parapet_B', W + 0.1, 0.12, 0.09, dark, 0, H + 0.06, -D / 2);
  box('Parapet_L', 0.09, 0.12, D, dark, -W / 2, H + 0.06, 0);
  box('Parapet_R', 0.09, 0.12, D, dark, W / 2, H + 0.06, 0);

  // Entrance: jambs, canopy, sliding double doors, bollards
  [-1, 1].forEach((s, i) => box(`DoorJamb_${i}`, 0.07, DOOR_H, 0.1, dark, s * (DOOR_W / 2 + 0.035), DOOR_H / 2, D / 2 + 0.01));
  box('Canopy', DOOR_W + 0.42, 0.08, 0.36, dark, 0, DOOR_H + 0.1, D / 2 + 0.15);
  box('CanopyFascia', DOOR_W + 0.44, 0.06, 0.04, dark, 0, DOOR_H + 0.1, D / 2 + 0.34);
  [-1, 1].forEach((s, i) => {
    const leaf = new THREE.Group(); leaf.name = s < 0 ? 'Door_L' : 'Door_R';
    leaf.position.z = D / 2 - T / 2;
    const travel = DOOR_W / 2 - 0.02;
    leaf.userData.joint = s < 0
      ? { type: 'translate', axis: 'x', min: -travel, max: 0, label: 'Door', note: 'slides left into the wall' }
      : { type: 'translate', axis: 'x', min: 0, max: travel, label: 'Door', note: 'slides right into the wall' };
    const panel = new THREE.Mesh(new THREE.BoxGeometry(DOOR_W / 2 - 0.006, DOOR_H, 0.035), dark);
    panel.name = `${leaf.name}_Panel`; panel.position.set(s * DOOR_W / 4, DOOR_H / 2, 0);
    leaf.add(darkSeams(panel));
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.02), MAT.rubber());
    handle.name = `${leaf.name}_Handle`; handle.position.set(s * 0.05, DOOR_H * 0.5, 0.028);
    leaf.add(handle);
    root.add(leaf);
  });
  [-1, 1].forEach((s, i) => box(`Bollard_${i}`, 0.07, 0.36, 0.07, yellow, s * (DOOR_W / 2 + 0.2), 0.18, D / 2 + 0.14));

  // Windows
  const windowAt = (name, x, y, z, rotY, w, h) => {
    const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = rotY;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.07, h + 0.07, 0.03), dark);
    frame.name = `${name}_Frame`; frame.position.z = 0.015; g.add(darkSeams(frame));
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glass);
    pane.name = `${name}_Glass`; pane.position.z = 0.032; g.add(pane);
    root.add(g);
  };
  const WY = H * 0.6;
  let n = 0;
  for (let x = DOOR_W / 2 + 0.39; x < W / 2 - 0.25; x += 0.3) {     // front, both sides of the entrance
    windowAt(`Window_F${n++}`, -x, WY, D / 2, 0, 0.2, 0.15);
    windowAt(`Window_F${n++}`, x, WY, D / 2, 0, 0.2, 0.15);
  }
  n = 0;
  for (let x = -W / 2 + 0.35; x < TX - TS / 2 - 0.25; x += 0.7)      // back, clear of the tower
    windowAt(`Window_B${n++}`, x, WY + 0.02, -D / 2, Math.PI, 0.38, 0.12);
  (LV.hut ? [0.12, 0.45] : [-0.35, 0.35]).forEach((z, i) => windowAt(`Window_L${i}`, -W / 2, WY, z, -Math.PI / 2, 0.2, 0.15));   // clear of the hut link
  n = 0;
  for (let z = D / 2 - 0.3; z > TZ + TS / 2 + 0.18; z -= 0.33)       // right, in front of the tower
    windowAt(`Window_R${n++}`, W / 2, WY, z, Math.PI / 2, 0.2, 0.15);

  // Red beacon dots on the main roof
  const dotG = new THREE.OctahedronGeometry(0.04);
  [[-W / 2 + 0.03, D / 2 - 0.03], [W / 2 - 0.03, D / 2 - 0.03], [-W / 2 + 0.03, -D / 2 + 0.03], [0, -D / 2 + 0.03], [0, D / 2 - 0.03]]
    .forEach(([x, z], i) => {
      const d = new THREE.Mesh(dotG, roofRed); d.name = `RoofBeacon_${i}`;
      d.position.set(x, H + 0.16, z); root.add(d);
    });

  // ---- Control tower ---------------------------------------------------
  box('TowerShaft', TS, TH, TS, card, TX, TH / 2, TZ);
  box('TowerPlinth', TS + 0.08, PH, TS + 0.08, dark, TX, PH / 2, TZ);
  box('TowerCollar', TS + 0.06, 0.08, TS + 0.06, dark, TX, TH - 0.04, TZ);
  const hex = (r1, r2, h, mat, y, name, seg = 6) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat);
    m.name = name; m.position.set(TX, y, TZ);
    root.add(mat === dark ? darkSeams(m) : mat === interior || mat === glass ? m : addSeams(m));
    return m;
  };
  const CR = LV.CR, CS = CR / 0.5, CH = 0.36 * CS, CB = TH + 0.08;   // cab radius, height, base
  hex(0.6 * CS, 0.6 * CS, 0.08, dark, TH + 0.04, 'CabFloor');
  hex(CR * 0.9, CR * 0.9, CH, interior, CB + CH / 2, 'CabInterior');
  const ap = CR * Math.cos(Math.PI / 6);
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;               // face normals
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(CR * 0.86, CH * 0.82), glass);
    pane.name = `CabGlass_${i}`;
    pane.position.set(TX + Math.sin(a) * ap, CB + CH / 2, TZ + Math.cos(a) * ap);
    pane.rotation.y = a; root.add(pane);
    const v = i * Math.PI / 3;                              // vertices → mullions
    box(`CabMullion_${i}`, 0.045 * CS, CH, 0.045 * CS, dark, TX + Math.sin(v) * CR, CB + CH / 2, TZ + Math.cos(v) * CR);
  }
  hex(CR + 0.02, CR + 0.02, 0.05, dark, CB + 0.025, 'CabSill');
  hex(0.6 * CS, 0.6 * CS, 0.07, dark, CB + CH + 0.035, 'CabTop');
  hex(0.26 * CS, 0.62 * CS, 0.17 * CS, lid, CB + CH + 0.07 + 0.085 * CS, 'CabRoof');
  const MB = CB + CH + 0.07 + 0.17 * CS;                  // mast base
  const mastTop = MB + 0.26 * CS;
  hex(0.02, 0.025, 0.26 * CS, dark, MB + 0.13 * CS, 'Antenna', 6);
  const tb = new THREE.Mesh(new THREE.OctahedronGeometry(0.05), towerRed);
  tb.name = 'TowerBeacon'; tb.position.set(TX, mastTop + 0.03, TZ); root.add(tb);

  // ---- Level 2+: small radar hut on the left with a spinning dish ------
  if (LV.hut) {
    const HX = -W / 2 - 0.6, HZ = -D / 2 + 0.42, HW = 0.78, HD = 0.66, HH = 0.62;
    box('RadarHut', HW, HH, HD, card, HX, HH / 2, HZ);
    box('RadarHut_Plinth', HW + 0.06, PH, HD + 0.06, dark, HX, PH / 2, HZ);
    box('RadarHut_Roof', HW + 0.1, 0.06, HD + 0.1, lid, HX, HH + 0.03, HZ);
    box('RadarHut_Trim', HW + 0.12, 0.05, HD + 0.12, dark, HX, HH + 0.075, HZ);
    box('RadarHut_Door', 0.2, 0.36, 0.02, dark, HX + 0.18, 0.18, HZ + HD / 2 + 0.01);
    windowAt('RadarHut_Window', HX - 0.15, HH * 0.6, HZ + HD / 2, 0, 0.18, 0.13);
    // Link to the main block
    box('RadarHut_Link', 0.46, 0.4, 0.34, card, -W / 2 - 0.2, 0.2, HZ);
    // Spinning mount: post + a small round dish (the Level 1 radar dish, scaled)
    const spin = new THREE.Group(); spin.name = 'RadarHut_Spin';
    spin.position.set(HX, HH + 0.1, HZ);
    spin.userData.joint = { type: 'rotate', axis: 'y', label: 'Spin', speed: 0.9, note: 'spins continuously' };
    root.add(spin);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.3, 6), dark);
    post.name = 'RadarHut_Post'; post.position.y = 0.15; spin.add(darkSeams(post));
    const dish = buildRadarDish(1);
    dish.name = 'RadarHut_Dish'; delete dish.userData.part;
    dish.scale.setScalar(0.27); dish.position.y = 0.32; dish.rotation.x = -0.4;
    dish.traverse(o => { if (o.userData.socketMarker) o.visible = false; });
    spin.add(dish);
  }

  if (damage) damageCommand(root, { W, D, H, TX, TZ, TS, TH, CB, CH, CS }, damage);
  finishPart(root);
  return damage ? applyDamage(root, level, damage) : root;
}

/* ------------------------------------------------------------------
   Models: Runway + Helipad (flat ground pieces with lights)
------------------------------------------------------------------ */
const ASPHALT = () => new THREE.MeshStandardMaterial({ name: 'Asphalt', color: 0x3b3835, roughness: 0.95, flatShading: true, ...OFFSET });
const beaconMat = (name, color, emissive) => {
  const m = new THREE.MeshStandardMaterial({ name, color, roughness: 0.5, emissive, emissiveIntensity: 0, flatShading: true });
  m.userData.exportOff = true; return m;
};

const RUN = { L: 7.0, W: 1.6, TH: 0.08, TILE: 1.0 };
const RUN_LV = { 1: { L: 7, W: 1.6, bars: 6 }, 2: { L: 10, W: 2.0, bars: 8 }, 3: { L: 13, W: 2.4, bars: 10 } };

function buildRunway(level = 1, damage = 0) {
  const { TH, TILE } = RUN;
  const LV = RUN_LV[level] || RUN_LV[1];
  const { L, W } = LV;
  const root = new THREE.Group(); root.name = 'Runway';
  root.userData.part = 'runway';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), asphalt = ASPHALT();
  const red = beaconMat('BeaconRed', 0x8a1a12, 0xff2a1a);
  const flat = (name, w, d, x, z, mat = lid, y = TH + 0.023) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.006, d), mat);
    m.name = name; m.position.set(x, y, z); root.add(m); return m;
  };

  // Cardboard base in tiles (gives the segmented edge), asphalt on top
  for (let i = 0; i < L / TILE; i++) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(TILE - 0.01, TH, W), card);
    t.name = `Tile_${i}`; t.position.set(-L / 2 + (i + 0.5) * TILE, TH / 2, 0);
    root.add(addSeams(t));
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(L - 0.2, 0.02, W - 0.2), asphalt);
  top.name = 'Asphalt'; top.position.y = TH + 0.01;
  root.add(addSeams(top, 0x2c2826, 0.6));

  // Edge outline, threshold bars, centre dashes
  const IL = L - 0.32, IW = W - 0.32;
  flat('Edge_N', IL, 0.035, 0, -IW / 2); flat('Edge_S', IL, 0.035, 0, IW / 2);
  flat('Edge_W', 0.035, IW, -IL / 2, 0); flat('Edge_E', 0.035, IW, IL / 2, 0);
  [-1, 1].forEach(e => {
    for (let k = 0; k < LV.bars; k++) flat(`Threshold_${e < 0 ? 'W' : 'E'}_${k}`, 0.55, 0.08, e * (L / 2 - 0.55), (k - (LV.bars - 1) / 2) * 0.2);
  });
  const span = L - 2.3, nD = Math.round(span / 0.68) + 1, xs = [];
  for (let i = 0; i < nD; i++) { const x = -span / 2 + i * span / (nD - 1); xs.push(x); flat(`CentreDash_${i}`, 0.3, 0.05, x, 0); }

  // White centre lights between the dashes — each its own material so they chase
  const beacons = [];
  const dotG = new THREE.OctahedronGeometry(0.04); dotG.scale(1, 0.55, 1);
  for (let i = 0; i < nD - 1; i++) {
    const m = beaconMat(`CentreLight_${i}`, 0xcfc8bd, 0xfff1d6);
    const d = new THREE.Mesh(dotG, m); d.name = `CentreLight_${i}`;
    d.position.set((xs[i] + xs[i + 1]) / 2, TH + 0.035, 0); root.add(d);
    beacons.push({ mat: m, period: 1.4, phase: (nD - 2 - i) * 0.11, width: 0.09, idle: 0.25, peak: 3.5, prop: 'centre' });
  }

  // Red beacons round the edge (on the cardboard border)
  const rdG = new THREE.OctahedronGeometry(0.045); rdG.scale(1, 0.7, 1);
  let r = 0;
  const redAt = (x, z) => { const d = new THREE.Mesh(rdG, red); d.name = `EdgeBeacon_${r++}`; d.position.set(x, TH + 0.025, z); root.add(d); };
  const nE = Math.round(L / 0.875);
  for (let i = 0; i <= nE; i++) { const x = -L / 2 + 0.05 + i * (L - 0.1) / nE; redAt(x, -W / 2 + 0.05); redAt(x, W / 2 - 0.05); }
  [-0.28, 0, 0.28].forEach(f => { redAt(-L / 2 + 0.05, f * W); redAt(L / 2 - 0.05, f * W); });
  beacons.push({ mat: red, period: 1.2, phase: 0 });
  root.userData.beacons = beacons;

  if (damage) damageRunway(root, { L, W, TH }, damage);
  finishPart(root);
  return root;
}

const HELI = { A: 1.0, BW: 0.17, TH: 0.1, LEG: 0.18 };

function buildHelipad(damage = 0) {
  const { A, BW, TH, LEG } = HELI;
  const root = new THREE.Group(); root.name = 'Helipad';
  root.userData.part = 'helipad';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), asphalt = ASPHALT();
  const concrete = new THREE.MeshStandardMaterial({ name: 'Concrete', color: 0x6f6b67, roughness: 0.95, flatShading: true, ...OFFSET });
  const red = beaconMat('BeaconRed', 0x8a1a12, 0xff2a1a);
  const S = Math.PI / 8, top = LEG + TH;

  // Supports
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, z], i) => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.24, LEG, 0.24), concrete);
    l.name = `Leg_${i}`; l.position.set(x * 0.62, LEG / 2, z * 0.62); root.add(addSeams(l, 0x2c2826, 0.5));
  });
  const block = new THREE.Mesh(new THREE.BoxGeometry(0.9, LEG * 0.9, 0.9), concrete);
  block.name = 'CentreBlock'; block.position.y = LEG * 0.45; root.add(addSeams(block, 0x2c2826, 0.5));

  // Octagonal deck (flat sides facing the axes)
  const rIn = (A - BW + 0.02) / Math.cos(S);
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, TH, 8, 1, false, S), asphalt);
  deck.name = 'Deck'; deck.position.y = LEG + TH / 2; root.add(addSeams(deck, 0x2c2826, 0.6));

  // Cardboard border: eight separate segments
  const segLen = 2 * A * Math.tan(S), BH = TH + 0.05;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const seg = new THREE.Mesh(new THREE.BoxGeometry(segLen * 0.97, BH, BW), card);
    seg.name = `Border_${i}`;
    seg.position.set(Math.sin(a) * (A - BW / 2), LEG + BH / 2, Math.cos(a) * (A - BW / 2));
    seg.rotation.y = a; root.add(addSeams(seg));
  }

  // Markings: ring + H
  const ringG = new THREE.RingGeometry(0.6, 0.68, 32); ringG.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringG, lid); ring.name = 'Ring'; ring.position.y = top + 0.004; root.add(addSeams(ring, undefined, undefined, 40));
  const hBar = (name, w, d, x) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.006, d), lid); m.name = name; m.position.set(x, top + 0.004, 0); root.add(addSeams(m)); };
  hBar('H_Left', 0.08, 0.52, -0.17); hBar('H_Right', 0.08, 0.52, 0.17); hBar('H_Bar', 0.34, 0.08, 0);

  // Red beacons on the eight corners
  const rdG = new THREE.OctahedronGeometry(0.05); rdG.scale(1, 0.7, 1);
  const rc = A / Math.cos(S) - 0.1;
  for (let i = 0; i < 8; i++) {
    const a = S + i * Math.PI / 4;
    const d = new THREE.Mesh(rdG, red); d.name = `EdgeBeacon_${i}`;
    d.position.set(Math.sin(a) * rc, LEG + BH + 0.025, Math.cos(a) * rc); root.add(d);
  }
  root.userData.beacons = [{ mat: red, period: 1.2, phase: 0 }];

  if (damage) damageHelipad(root, { A, LEG, TH, BW }, damage);
  finishPart(root);
  return root;
}

/* ------------------------------------------------------------------
   Model: Aircraft Hangar (building, levels 1–3)
   Barrel-roof hangar: low side walls, arched front/back walls, curved
   cardboard roof with dark ribs, a wide roll-up door that rolls into
   the lintel. Level 2 adds a side office annex, roof vents and red
   beacons; Level 3 is bigger with annexes both sides, a small control
   cabin and an apron pad out front.
   Effects (buildingController): door, lights, beacons.
------------------------------------------------------------------ */
const HANGAR_LV = {
  1: { R: 1.5, D: 3.2, DW: 2.2, DH: 1.35, annex: 0 },   // door sized so the lintel stays under the arch
  2: { R: 1.9, D: 4.0, DW: 2.8, DH: 1.55, annex: 1 },
  3: { R: 2.3, D: 4.8, DW: 3.4, DH: 1.8,  annex: 2 },
};

function buildHangar(level = 1, damage = 0) {
  const LV = HANGAR_LV[level] || HANGAR_LV[1];
  const { R, D, DW, DH } = LV, WH = 0.6, T = 0.08, SEG = 10;
  const root = new THREE.Group(); root.name = 'Hangar';
  root.userData.part = 'hangar';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const lidDS = MAT.cardboardLid(); lidDS.side = THREE.DoubleSide;
  const darkDS = MAT.rubber(); darkDS.side = THREE.DoubleSide;
  const yellow = new THREE.MeshStandardMaterial({ name: 'Marking', color: 0xd9a23a, roughness: 0.7, flatShading: true, ...OFFSET });
  const asphalt = new THREE.MeshStandardMaterial({ name: 'Asphalt', color: 0x3b3835, roughness: 0.95, flatShading: true, ...OFFSET });
  const glass = new THREE.MeshStandardMaterial({ name: 'WindowGlass', color: 0x1c1a18, roughness: 0.35, metalness: 0.1, emissive: 0xffbe5c, emissiveIntensity: 0, ...OFFSET });
  const interior = new THREE.MeshStandardMaterial({ name: 'Interior', color: 0x16130f, roughness: 1, emissive: 0xffa94a, emissiveIntensity: 0 });
  const red = new THREE.MeshStandardMaterial({ name: 'BeaconRed', color: 0x8a1a12, roughness: 0.5, emissive: 0xff2a1a, emissiveIntensity: 0, flatShading: true });
  [glass, interior, red].forEach(m => m.userData.exportOff = true);
  root.userData.glass = glass; root.userData.interior = interior;
  if (level >= 2) root.userData.beacons = [{ mat: red, period: 1.3, phase: 0 }];
  const ds = m => addSeams(m, 0x2c2826, 0.6);
  const box = (name, w, h, d, mat, x, y, z, ry = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.name = name; m.position.set(x, y, z); m.rotation.y = ry;
    root.add(mat === dark || mat === darkDS ? ds(m) : addSeams(m)); return m;
  };
  const shape = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };
  const archPts = (r, h) => Array.from({ length: SEG + 1 }, (_, i) => { const a = i / SEG * Math.PI; return [r * Math.cos(a), h + r * Math.sin(a)]; });
  const extrude = (sh, depth) => new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });

  // Interior: same arch profile, inset, so the open door shows a dark (or glowing) hall
  const ig = extrude(shape([[-(R - 0.1), 0], [R - 0.1, 0], ...archPts(R - 0.1, WH)]), D - 0.2);
  const inside = new THREE.Mesh(ig, interior); inside.name = 'Interior'; inside.position.z = -(D - 0.2) / 2; root.add(inside);

  // End walls: arch profile; the front has the door notch
  const front = new THREE.Mesh(extrude(shape([[-R, 0], [-DW / 2, 0], [-DW / 2, DH], [DW / 2, DH], [DW / 2, 0], [R, 0], ...archPts(R, WH)]), T), card);
  front.name = 'FrontWall'; front.position.z = D / 2 - T; root.add(addSeams(front));
  const back = new THREE.Mesh(extrude(shape([[-R, 0], [R, 0], ...archPts(R, WH)]), T), card);
  back.name = 'BackWall'; back.position.z = -D / 2; root.add(addSeams(back));
  [-1, 1].forEach((s, i) => box(`SideWall_${i}`, T, WH, D - 2 * T, card, s * (R - T / 2), WH / 2, 0));

  // Plinth (split round the door)
  const PH = 0.18, PP = 0.04;
  box('Plinth_Back', 2 * R + 2 * PP, PH, PP, dark, 0, PH / 2, -D / 2 - PP / 2);
  [-1, 1].forEach((s, i) => box(`Plinth_Side_${i}`, PP, PH, D + 2 * PP, dark, s * (R + PP / 2), PH / 2, 0));
  const fw = R + PP - (DW / 2 + 0.09);
  [-1, 1].forEach((s, i) => box(`Plinth_Front_${i}`, fw, PH, PP, dark, s * (R + PP - fw / 2), PH / 2, D / 2 + PP / 2));

  // Curved roof + dark ribs (half-cylinders along Z)
  const half = (r, len, open = true) => { const g = new THREE.CylinderGeometry(r, r, len, SEG, 1, open, Math.PI / 2, Math.PI); g.rotateX(Math.PI / 2); return g; };
  const roof = new THREE.Mesh(half(R + 0.05, D + 0.2), lidDS); roof.name = 'Roof'; roof.position.y = WH; root.add(addSeams(roof));
  const nRibs = Math.max(3, Math.round(D / 0.8));
  for (let k = 0; k <= nRibs; k++) {
    const rib = new THREE.Mesh(half(R + 0.075, k === 0 || k === nRibs ? 0.1 : 0.06), darkDS);
    rib.name = `RoofRib_${k}`; rib.position.set(0, WH, -(D + 0.2) / 2 + 0.05 + k * (D + 0.1) / nRibs); root.add(ds(rib));
  }

  // Door: jambs, lintel, roll-up door; lamps either side of the lintel
  [-1, 1].forEach((s, i) => box(`DoorJamb_${i}`, 0.09, DH, 0.12, dark, s * (DW / 2 + 0.045), DH / 2, D / 2 + 0.02));
  box('DoorLintel', DW + 0.2, 0.12, 0.16, dark, 0, DH + 0.06, D / 2 + 0.03);
  root.add(buildRollDoor(DW, DH, D / 2 - T / 2, dark));
  [-1, 1].forEach((s, i) => {
    box(`Lamp_${i}`, 0.16, 0.08, 0.06, dark, s * (DW / 2 - 0.15), DH + 0.2, D / 2 + 0.03);
    const lg = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.045), glass);
    lg.name = `Lamp_${i}_Glass`; lg.position.set(s * (DW / 2 - 0.15), DH + 0.2, D / 2 + 0.061); root.add(lg);
  });

  // Windows: a row high on each side wall, small ones beside the door
  const windowAt = (name, x, y, z, ry, w, h) => {
    const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); g.rotation.y = ry;
    const fr = new THREE.Mesh(new THREE.BoxGeometry(w + 0.07, h + 0.07, 0.03), dark); fr.name = `${name}_Frame`; fr.position.z = 0.015; g.add(ds(fr));
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glass); p.name = `${name}_Glass`; p.position.z = 0.032; g.add(p);
    root.add(g);
  };
  const nW = Math.max(2, Math.floor((D - 0.8) / 0.75));
  for (let k = 0; k < nW; k++) {
    const z = -((nW - 1) * 0.75) / 2 + k * 0.75;
    if (!LV.annex) windowAt(`Window_R${k}`, R, 0.4, z, Math.PI / 2, 0.24, 0.15);
    if (LV.annex < 2) windowAt(`Window_L${k}`, -R, 0.4, z, -Math.PI / 2, 0.24, 0.15);
  }
  if (R - DW / 2 > 0.32) [-1, 1].forEach((s, i) => windowAt(`Window_F${i}`, s * (DW / 2 + (R - DW / 2) / 2 + 0.02), 0.45, D / 2, 0, 0.18, 0.15));

  // Level 2+: roof vents along the crown + red beacons front and back
  if (level >= 2) {
    const top = WH + R + 0.05;
    [-0.3, 0, 0.3].forEach((f, k) => {
      box(`RoofVent_${k}`, 0.3, 0.12, 0.3, lid, 0, top + 0.04, f * D);
      box(`RoofVentCap_${k}`, 0.36, 0.04, 0.36, dark, 0, top + 0.12, f * D);
    });
    const dot = new THREE.OctahedronGeometry(0.06);
    [-1, 1].forEach((s, i) => { const b = new THREE.Mesh(dot, red); b.name = `RoofBeacon_${i}`; b.position.set(0, top + 0.06, s * (D / 2 + 0.06)); root.add(b); });
  }

  // Level 2+: office annex on the right (Level 3: both sides)
  const annex = (s, idx) => {
    const AW = 0.95, AD = Math.min(1.8, D * 0.42), AH = 0.85, ax = s * (R + AW / 2), az = D / 2 - AD / 2 - 0.15;
    box(`Annex_${idx}`, AW, AH, AD, card, ax, AH / 2, az);
    box(`Annex_${idx}_Plinth`, AW + 0.05, PH, AD + 0.06, dark, ax + s * 0.02, PH / 2, az);
    box(`Annex_${idx}_Roof`, AW + 0.1, 0.06, AD + 0.1, lid, ax, AH + 0.03, az);
    box(`Annex_${idx}_Trim`, AW + 0.12, 0.05, AD + 0.12, dark, ax, AH + 0.075, az);
    box(`Annex_${idx}_Door`, 0.22, 0.42, 0.02, dark, ax - s * 0.2, 0.21, az + AD / 2 + 0.01);
    windowAt(`Annex_${idx}_WinF`, ax + s * 0.18, 0.52, az + AD / 2, 0, 0.24, 0.16);
    [-0.35, 0.35].forEach((f, k) => windowAt(`Annex_${idx}_WinS${k}`, ax + s * AW / 2, 0.52, az + f * AD, s * Math.PI / 2, 0.24, 0.16));
    return { ax, az, AW, AD, AH };
  };
  if (LV.annex >= 1) {
    const a = annex(1, 0);
    if (level >= 3) {
      // Small glazed control cabin on the right annex roof
      const cy = a.AH + 0.1, CW = 0.55, CD = 0.5, CH = 0.36;
      box('Cabin', CW, CH, CD, interior, a.ax, cy + CH / 2, a.az);
      [[0, CD / 2, 0, CW], [0, -CD / 2, Math.PI, CW], [CW / 2, 0, Math.PI / 2, CD], [-CW / 2, 0, -Math.PI / 2, CD]].forEach(([dx, dz, ry, w], k) => {
        const p = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.86, CH * 0.75), glass);
        p.name = `Cabin_Glass_${k}`; p.position.set(a.ax + dx + Math.sin(ry) * 0.002, cy + CH / 2, a.az + dz + Math.cos(ry) * 0.002); p.rotation.y = ry; root.add(p);
      });
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz], k) => box(`Cabin_Post_${k}`, 0.04, CH, 0.04, dark, a.ax + sx * CW / 2, cy + CH / 2, a.az + sz * CD / 2));
      box('Cabin_Roof', CW + 0.12, 0.06, CD + 0.12, dark, a.ax, cy + CH + 0.03, a.az);
      const b = new THREE.Mesh(new THREE.OctahedronGeometry(0.05), red); b.name = 'CabinBeacon';
      b.position.set(a.ax, cy + CH + 0.11, a.az); root.add(b);
    }
  }
  if (LV.annex >= 2) annex(-1, 1);

  // Level 3: apron pad in front with yellow guide markings
  if (level >= 3) {
    const PL = 2.0, PZ = D / 2 + 0.06 + PL / 2, PWd = DW + 0.8;
    const pad = new THREE.Mesh(new THREE.BoxGeometry(PWd, 0.03, PL), asphalt);
    pad.name = 'Apron'; pad.position.set(0, 0.015, PZ); root.add(ds(pad));
    for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.006, 0.28), yellow); m.name = `ApronDash_${k}`; m.position.set(0, 0.033, PZ - PL / 2 + 0.3 + k * 0.48); root.add(m); }
    [-1, 1].forEach((s, i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.006, PL - 0.1), yellow); m.name = `ApronEdge_${i}`; m.position.set(s * (PWd / 2 - 0.1), 0.033, PZ); root.add(m); });
  }

  if (damage) damageHangar(root, { R, D, WH, DW }, damage);
  finishPart(root);
  return damage ? applyDamage(root, level, damage) : root;
}

/* ------------------------------------------------------------------
   Model: Ink Depot (building, levels 1–3) — stores "ink" as a resource
   Octagonal cardboard tanks with dark bands, coned lids, side ladders
   and a front gauge window showing the ink level; a pump house with a
   spinning pump wheel; dark pipework on a concrete pad.
   Effects (buildingController): filling (ink levels + pump), lights,
   beacons (level 2–3).
------------------------------------------------------------------ */
const INK_LV = {
  1: { pad: [2.6, 2.1], tanks: [{ x: -0.45, z: -0.15, r: 0.6, h: 1.2 }], pump: { x: 0.85, z: 0.35 }, bridge: false },
  2: { pad: [3.6, 2.4], tanks: [{ x: -1.05, z: -0.2, r: 0.55, h: 1.15 }, { x: 0.2, z: -0.2, r: 0.55, h: 1.15 }], pump: { x: 1.35, z: 0.45 }, bridge: false },
  3: { pad: [4.8, 2.8], tanks: [{ x: -1.75, z: -0.25, r: 0.52, h: 1.15 }, { x: -0.55, z: -0.25, r: 0.52, h: 1.15 }, { x: 0.85, z: -0.3, r: 0.72, h: 1.5 }], pump: { x: 1.95, z: 0.7 }, bridge: true },
};

function buildInkDepot(level = 1, damage = 0) {
  const LV = INK_LV[level] || INK_LV[1];
  const root = new THREE.Group(); root.name = 'InkDepot';
  root.userData.part = 'ink-depot';
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const glass = new THREE.MeshStandardMaterial({ name: 'WindowGlass', color: 0x1c1a18, roughness: 0.35, metalness: 0.1, emissive: 0xffbe5c, emissiveIntensity: 0, ...OFFSET });
  const ink = new THREE.MeshStandardMaterial({ name: 'Ink', color: 0x1f2c7a, roughness: 0.25, metalness: 0.1, emissive: 0x2a3cff, emissiveIntensity: 0.25, ...OFFSET });
  const gaugeBack = new THREE.MeshStandardMaterial({ name: 'GaugeBack', color: 0x15130f, roughness: 0.8, ...OFFSET });
  const red = new THREE.MeshStandardMaterial({ name: 'BeaconRed', color: 0x8a1a12, roughness: 0.5, emissive: 0xff2a1a, emissiveIntensity: 0, flatShading: true });
  [glass, red].forEach(m => m.userData.exportOff = true);
  root.userData.glass = glass;
  if (level >= 2) root.userData.beacons = [{ mat: red, period: 1.4, phase: 0 }];
  const ds = m => addSeams(m, 0x2c2826, 0.6);
  const mesh = (name, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); root.add(mat === dark ? ds(m) : mat === lid || mat === card ? addSeams(m) : m); return m; };
  const box = (name, w, h, d, mat, x, y, z) => mesh(name, new THREE.BoxGeometry(w, h, d), mat, x, y, z);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pipe = (name, a, b, r = 0.045) => {
    const dir = b.clone().sub(a), len = dir.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), dark);
    m.name = name; m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
    root.add(ds(m)); return m;
  };
  const elbow = (name, p) => box(name, 0.12, 0.12, 0.12, dark, p.x, p.y, p.z);

  // ---- Concrete pad with dark curbs --------------------------------------
  const [PW, PD] = LV.pad, PH = 0.08;
  box('Pad', PW, PH, PD, lid, 0, PH / 2, 0);
  box('Curb_F', PW + 0.06, 0.1, 0.06, dark, 0, 0.05, PD / 2);
  box('Curb_B', PW + 0.06, 0.1, 0.06, dark, 0, 0.05, -PD / 2);
  box('Curb_L', 0.06, 0.1, PD, dark, -PW / 2, 0.05, 0);
  box('Curb_R', 0.06, 0.1, PD, dark, PW / 2, 0.05, 0);

  // ---- Tanks --------------------------------------------------------------
  const S8 = Math.PI / 8;
  const tankTops = [];
  LV.tanks.forEach((tk, i) => {
    const { x, z, r, h } = tk, y0 = PH, ap = r * Math.cos(S8);
    mesh(`Tank_${i}`, new THREE.CylinderGeometry(r, r, h, 8, 1, false, S8), card, x, y0 + h / 2, z);
    [0.2, h - 0.2].forEach((yy, k) => mesh(`Tank_${i}_Band_${k}`, new THREE.CylinderGeometry(r + 0.015, r + 0.015, 0.08, 8, 1, false, S8), dark, x, y0 + yy, z));
    mesh(`Tank_${i}_Lid`, new THREE.CylinderGeometry(r * 0.45, r + 0.02, 0.22, 8, 1, false, S8), lid, x, y0 + h + 0.11, z);
    mesh(`Tank_${i}_Hatch`, new THREE.CylinderGeometry(0.11, 0.11, 0.07, 8), dark, x, y0 + h + 0.255, z);
    tankTops.push(V(x, y0 + h + 0.22, z));

    // Gauge window on the front face: dark frame, dark back, ink bar
    const GH = h * 0.66, GY = y0 + h * 0.16, gz = z + ap;
    box(`Tank_${i}_GaugeFrame`, 0.18, GH + 0.06, 0.03, dark, x, GY + GH / 2, gz + 0.015);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.11, GH), gaugeBack);
    back.name = `Tank_${i}_GaugeBack`; back.position.set(x, GY + GH / 2, gz + 0.031); root.add(back);
    const gauge = new THREE.Group(); gauge.name = `InkLevel_${i}`;
    gauge.position.set(x, GY, gz + 0.033);
    gauge.userData.joint = { type: 'scale', axis: 'y', min: 0.05, max: 1, label: 'Ink', note: 'fill level of tank ' + i };
    const bar = new THREE.Mesh(new THREE.PlaneGeometry(0.11, GH), ink);
    bar.name = `InkLevel_${i}_Bar`; bar.position.y = GH / 2; gauge.add(bar);
    root.add(gauge);
    for (let k = 1; k < 4; k++) box(`Tank_${i}_Tick_${k}`, 0.05, 0.012, 0.012, dark, x - 0.08, GY + GH * k / 4, gz + 0.038);

    // Ladder on the right face
    const lx = x + ap + 0.035;
    [-0.08, 0.08].forEach((dz, k) => box(`Tank_${i}_LadderRail_${k}`, 0.025, h + 0.12, 0.025, dark, lx, y0 + (h + 0.12) / 2, z + dz));
    const nR = Math.round(h / 0.2);
    for (let k = 1; k <= nR; k++) box(`Tank_${i}_Rung_${k}`, 0.02, 0.018, 0.16, dark, lx, y0 + k * h / (nR + 0.5), z);

    if (level >= 2) {
      const b = new THREE.Mesh(new THREE.OctahedronGeometry(0.055), red);
      b.name = `Tank_${i}_Beacon`; b.position.set(x + r * 0.45, y0 + h + 0.25, z); root.add(b);
    }
  });

  // ---- Pump house ----------------------------------------------------------
  const { x: PX, z: PZ } = LV.pump, HW = 0.62, HD = 0.58, HH = 0.58;
  box('PumpHouse', HW, HH, HD, card, PX, PH + HH / 2, PZ);
  box('PumpHouse_Roof', HW + 0.1, 0.06, HD + 0.1, lid, PX, PH + HH + 0.03, PZ);
  box('PumpHouse_Trim', HW + 0.12, 0.045, HD + 0.12, dark, PX, PH + HH + 0.08, PZ);
  box('PumpHouse_Door', 0.2, 0.38, 0.02, dark, PX + 0.15, PH + 0.19, PZ + HD / 2 + 0.01);
  const win = new THREE.Group(); win.name = 'PumpHouse_Window'; win.position.set(PX - 0.15, PH + 0.38, PZ + HD / 2); root.add(win);
  const wf = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.03), dark); wf.position.z = 0.015; win.add(ds(wf));
  const wg = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.09), glass); wg.name = 'PumpHouse_Window_Glass'; wg.position.z = 0.032; win.add(wg);
  // Warning lamp on the roof (lights)
  box('PumpHouse_LampBase', 0.12, 0.05, 0.12, dark, PX + 0.18, PH + HH + 0.125, PZ - 0.1);
  mesh('PumpHouse_Lamp', new THREE.CylinderGeometry(0.05, 0.05, 0.08, 8), glass, PX + 0.18, PH + HH + 0.19, PZ - 0.1);
  // Pump wheel on the front, spins while filling
  const wheel = new THREE.Group(); wheel.name = 'Pump_Spin';
  wheel.position.set(PX - 0.15, PH + 0.17, PZ + HD / 2 + 0.04);
  wheel.userData.joint = { type: 'rotate', axis: 'z', label: 'Spin', speed: 3.2, prop: 'filling', note: 'spins while filling' };
  root.add(wheel);
  const wg2 = new THREE.CylinderGeometry(0.12, 0.12, 0.04, 8); wg2.rotateX(Math.PI / 2);
  const wm = new THREE.Mesh(wg2, dark); wm.name = 'Pump_Wheel'; wheel.add(ds(wm));
  [0, Math.PI / 2].forEach((a, k) => { const sp = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.03, 0.03), lid); sp.name = `Pump_Spoke_${k}`; sp.rotation.z = a; sp.position.z = 0.03; wheel.add(addSeams(sp)); });

  // ---- Pipes: one low main line in front of the tanks (below the gauges),
  //      with a short branch back into each tank -------------------------
  const PY = PH + 0.12;
  const ZF = Math.max(...LV.tanks.map(t => t.z + t.r)) + 0.18;
  const xs = LV.tanks.map(t => t.x), xMin = Math.min(...xs);
  pipe('Pipe_Main', V(PX - HW / 2, PY, ZF), V(xMin, PY, ZF), 0.05);
  LV.tanks.forEach((tk, i) => {
    const c = V(tk.x, PY, ZF);
    pipe(`Pipe_${i}_Branch`, c, V(tk.x, PY, tk.z + tk.r * 0.85));
    elbow(`Pipe_${i}_Joint`, c);
  });
  const valve = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.016, 4, 8), dark);
  valve.name = 'Pipe_Valve'; valve.position.set(PX - HW / 2 - 0.16, PY + 0.09, ZF); valve.rotation.x = Math.PI / 2;
  root.add(ds(valve));
  pipe('Pipe_ValveStem', V(PX - HW / 2 - 0.16, PY, ZF), V(PX - HW / 2 - 0.16, PY + 0.09, ZF), 0.015);

  // ---- Level 3: overhead pipe bridge between tank tops + loading arm -------
  if (LV.bridge) {
    for (let i = 0; i < tankTops.length - 1; i++) {
      const a = tankTops[i].clone(), b = tankTops[i + 1].clone();
      const y = Math.max(a.y, b.y) + 0.15;
      pipe(`Bridge_${i}_Up0`, a, V(a.x, y, a.z), 0.04);
      pipe(`Bridge_${i}_Up1`, b, V(b.x, y, b.z), 0.04);
      pipe(`Bridge_${i}`, V(a.x, y, a.z), V(b.x, y, b.z), 0.05);
    }
    const ax = PX + HW / 2 + 0.06, az = PZ + 0.1;
    pipe('LoadingArm_Post', V(ax, PH, az), V(ax, PH + 0.75, az), 0.05);
    pipe('LoadingArm_Boom', V(ax, PH + 0.75, az), V(ax + 0.05, PH + 0.75, az + 0.65), 0.04);
    pipe('LoadingArm_Drop', V(ax + 0.05, PH + 0.75, az + 0.65), V(ax + 0.05, PH + 0.42, az + 0.65), 0.035);
  }

  if (damage) damageInk(root, { tanks: LV.tanks, PX, PZ, HW, HD, HH, PH, PY, ZF, ink }, damage);
  finishPart(root);
  return damage ? applyDamage(root, level, damage) : root;
}

/* ------------------------------------------------------------------
   Damage (turret): 0 none · 1 minor · 2 medium · 3 critical
   Cumulative: minor = scorch patches; medium = more patches + smoke
   rising from the head; critical = even more patches + a wrecked
   Platform Base (built in buildPlatformBase) + smoke from the base.
   Scorch patches are found by ray-casting onto the real surfaces and
   are parented to whatever part they hit, so they turn with it.
------------------------------------------------------------------ */
const DAMAGE_STATES = [
  { id: 0, label: 'None' }, { id: 1, label: 'Minor' }, { id: 2, label: 'Medium' }, { id: 3, label: 'Critical' },
];
const DAMAGE_NAMES = ['none', 'minor', 'medium', 'critical'];
const SCORCH_COUNT = [0, 5, 9, 13];
const SCORCH_MAT = {
  outer: new THREE.MeshStandardMaterial({ name: 'Scorch', color: 0x2b2119, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
  inner: new THREE.MeshStandardMaterial({ name: 'ScorchCore', color: 0x0e0c0b, roughness: 1, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }),
};
Object.values(SCORCH_MAT).forEach(m => m.userData.shared = true);

function seeded(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }

function scorchGeometry(rnd) {
  const g = new THREE.CircleGeometry(1, 7), p = g.attributes.position;
  for (let k = 1; k < p.count; k++) { const f = 0.6 + rnd() * 0.45; p.setXY(k, p.getX(k) * f, p.getY(k) * f); }
  g.rotateZ(rnd() * Math.PI);
  return g;
}

function applyDamage(root, level, damage) {
  if (!damage) return root;
  root.userData.damage = damage;
  root.updateMatrixWorld(true);
  const meshes = [];
  const inPart = (o, id) => { for (let p = o; p; p = p.parent) if (p.userData.part) return p.userData.part === id; return false; };
  root.traverse(o => {                                 // rockets fly away, so they never get scorch marks
    if (o.isMesh && !o.userData.helper && !o.userData.noScorch && o.visible && !inPart(o, 'rocket')) meshes.push(o);
  });
  const box = solidBox(root), center = box.getCenter(new THREE.Vector3());
  const R = box.getBoundingSphere(new THREE.Sphere()).radius;
  const rnd = seeded(level * 31 + 7);                 // same spots per level → damage is cumulative
  const ray = new THREE.Raycaster(), hits = [];
  for (let t = 0; t < 400 && hits.length < SCORCH_COUNT[3]; t++) {
    const a = rnd() * Math.PI * 2, y = -0.2 + rnd() * 1.1;
    const origin = new THREE.Vector3(Math.cos(a) * R * 1.6, center.y + y * R, Math.sin(a) * R * 1.6);
    const target = center.clone().add(new THREE.Vector3((rnd() - 0.5) * R * 0.8, (rnd() - 0.4) * R * 0.9, (rnd() - 0.5) * R * 0.8));
    ray.set(origin, target.sub(origin).normalize());
    const h = ray.intersectObjects(meshes, false)[0];
    if (!h || !h.face) continue;
    const wn = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    if (wn.y < -0.3 || h.point.y < 0.15) continue;      // skip undersides and ground level
    if (hits.some(o => o.point.distanceTo(h.point) < 0.22)) continue;
    hits.push(h);
  }
  const n = SCORCH_COUNT[damage];
  const placed = [];
  hits.slice(0, n).forEach((h, i) => {
    const obj = h.object, nl = h.face.normal.clone().normalize();
    const size = 0.07 + rnd() * 0.07 + (damage >= 3 ? 0.02 : 0);
    const g = new THREE.Group(); g.name = `Scorch_${i}`;
    g.position.copy(obj.worldToLocal(h.point.clone())).addScaledVector(nl, 0.004);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nl);
    const outer = new THREE.Mesh(scorchGeometry(rnd), SCORCH_MAT.outer); outer.scale.setScalar(size); outer.userData.noScorch = true;
    const inner = new THREE.Mesh(scorchGeometry(rnd), SCORCH_MAT.inner); inner.scale.setScalar(size * 0.55);
    inner.position.set((rnd() - 0.5) * size * 0.3, (rnd() - 0.5) * size * 0.3, 0.001); inner.userData.noScorch = true;
    g.add(outer, inner);
    obj.add(g);
    placed.push({ g, obj, y: h.point.y });
  });

  // Medium+: smoke rises from the highest scorch on the head (moves with it)
  if (damage >= 2 && placed.length) {
    const headish = placed.filter(p => { let o = p.obj; while (o) { if (o.userData.part && o.userData.part !== 'platform-base') return true; o = o.parent; } return false; });
    const src = (headish.length ? headish : placed).reduce((a, b) => (b.y > a.y ? b : a));
    const sp = new THREE.Object3D(); sp.name = 'damage_smoke_0';
    sp.position.set(0, 0, 0.03); src.g.add(sp);
  }
  return root;
}

/* Smoke for damaged models: puffs from every "damage_smoke_*" point. */
function makeDamageSmoke(root, damage) {
  const pts = [];
  root.traverse(o => { if (o.name.startsWith('damage_smoke')) pts.push(o); });
  if (!pts.length || !root.parent) return null;
  const world = root.parent, fx = new THREE.Group(); fx.name = '__damagefx'; world.add(fx);
  const geo = new THREE.IcosahedronGeometry(1, 0), tmp = new THREE.Vector3();
  const colour = damage >= 3 ? 0x2e2b29 : 0x4a4643, rate = damage >= 3 ? 0.1 : 0.16;
  const puffs = Array.from({ length: 60 * pts.length }, () => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colour, roughness: 1, flatShading: true, transparent: true, depthWrite: false }));
    m.visible = false; m.userData.helper = true; m.userData.drift = new THREE.Vector3(); fx.add(m); return m;
  });
  let acc = 0, pi = 0;
  return {
    update(dt) {
      acc += dt;
      while (acc > rate) {
        acc -= rate;
        for (const p0 of pts) {
          const p = puffs[pi++ % puffs.length];
          p0.getWorldPosition(tmp); p.position.copy(fx.worldToLocal(tmp));
          p.userData.age = 0; p.userData.life = 2.6 + Math.random() * 1.0;
          p.userData.drift.set(0.08 + Math.random() * 0.06, 0.38 + Math.random() * 0.14, (Math.random() - 0.5) * 0.08);
          p.rotation.set(Math.random() * 3, Math.random() * 3, 0); p.visible = true;
        }
      }
      puffs.forEach(p => {
        if (!p.visible) return;
        const d = p.userData; d.age += dt; const u = d.age / d.life;
        if (u >= 1) { p.visible = false; return; }
        p.scale.setScalar(0.05 + 0.27 * (1 - Math.pow(1 - u, 2)));
        p.material.opacity = 0.7 * (u < 0.1 ? u / 0.1 : 1 - (u - 0.1) / 0.9);
        p.position.addScaledVector(d.drift, dt);
      });
    },
    dispose() { world.remove(fx); puffs.forEach(p => p.material.dispose()); geo.dispose(); },
  };
}

/* ------------------------------------------------------------------
   Building damage helpers: broken windows, holes, debris, rubble.
------------------------------------------------------------------ */
const BROKEN_GLASS = new THREE.MeshStandardMaterial({ name: 'BrokenGlass', color: 0x0f0e0d, roughness: 0.5, ...OFFSET });
const CRACK_MAT = new THREE.MeshStandardMaterial({ name: 'GlassCrack', color: 0x8a837b, roughness: 0.6 });
BROKEN_GLASS.userData.shared = CRACK_MAT.userData.shared = true;

function breakWindow(root, name) {
  const g = root.getObjectByName(name); if (!g) return;
  const pane = g.children.find(c => c.name.endsWith('_Glass')); if (!pane) return;
  pane.material = BROKEN_GLASS;
  const w = pane.geometry.parameters?.width || 0.3, h = pane.geometry.parameters?.height || 0.2;
  [[0.55, 0], [-0.7, 0.2], [0.2, -0.3]].forEach(([r, oy], k) => {
    const c = new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(w, h) * 0.5, 0.008, 0.004), CRACK_MAT);
    c.name = `${name}_Crack_${k}`; c.rotation.z = r; c.position.set(w * 0.08 * k - w * 0.05, h * oy * 0.5, pane.position.z + 0.002);
    c.userData.noScorch = true; g.add(c);
  });
}

// Jagged dark hole decal (ShapeGeometry in XY, faces +Z)
function holeDecal(name, w, h, seed) {
  const rnd = seeded(seed), sh = new THREE.Shape(), n = 10;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2, f = 0.65 + rnd() * 0.4;
    const x = Math.cos(a) * w / 2 * f, y = Math.sin(a) * h / 2 * f;
    k ? sh.lineTo(x, y) : sh.moveTo(x, y);
  }
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), SCORCH_MAT.inner);
  m.name = name; m.userData.noScorch = true;
  return m;
}

function debrisBox(parent, name, w, h, d, mat, pos, rot) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; m.position.set(...pos); m.rotation.set(...rot);
  m.userData.noScorch = true;
  parent.add(mat.name === 'DarkTape' ? addSeams(m, 0x2c2826, 0.6) : addSeams(m));
  return m;
}

function rubblePile(parent, name, x, z, seed, mats, y = 0) {
  const rnd = seeded(seed);
  for (let k = 0; k < 5; k++) {
    const s = 0.08 + rnd() * 0.1;
    debrisBox(parent, `${name}_${k}`, s * (1 + rnd()), s * 0.6, s, mats[k % mats.length],
      [x + (rnd() - 0.5) * 0.45, y + s * 0.3, z + (rnd() - 0.5) * 0.35], [rnd() * 0.4, rnd() * 3, rnd() * 0.4]);
  }
}

/* Workshop: minor = cracked windows; medium = roof hole + fallen roof
   slab; critical = broken chimney, wall breach, jammed door. */
function damageWorkshop(root, d, damage) {
  const { W, D, H, RISE, SL, RT, chimneys } = d;
  const card = MAT.cardboard(), dark = MAT.rubber();
  const roofMat = new THREE.MeshStandardMaterial({ name: 'Roof', color: 0x5a5450, roughness: 0.85, flatShading: true, ...OFFSET });
  const brick = new THREE.MeshStandardMaterial({ name: 'Brick', color: 0xc8643f, roughness: 0.8, flatShading: true, ...OFFSET });
  ['Window_F1', 'Window_R1'].forEach(n => breakWindow(root, n));
  if (damage >= 2) {
    ['Window_L0', 'Window_F2'].forEach(n => breakWindow(root, n));
    const front = root.getObjectByName('RoofSide_0');
    const hole = holeDecal('RoofHole_0', 0.55, 0.42, 11);
    hole.rotation.x = -Math.PI / 2; hole.position.set(-W * 0.22, RT + 0.004, SL * 0.74); front.add(hole);   // below the skylights
    debrisBox(root, 'FallenRoofSlab', 0.5, 0.06, 0.42, roofMat, [-W * 0.22, 0.24, D / 2 + 0.22], [1.15, 0.15, 0.1]);
    rubblePile(root, 'RoofRubble', -W * 0.22 + 0.35, D / 2 + 0.3, 3, [roofMat, card]);
  }
  if (damage >= 3) {
    breakWindow(root, 'Window_F0'); breakWindow(root, 'Window_R0');
    const front = root.getObjectByName('RoofSide_0');
    const hole2 = holeDecal('RoofHole_1', 0.7, 0.5, 23);
    hole2.rotation.x = -Math.PI / 2; hole2.position.set(W * 0.3, RT + 0.004, SL * 0.74); front.add(hole2);
    // Last chimney snapped: shorten, jagged dark top, the top lies behind the building
    const c = chimneys.length - 1, sfx = chimneys.length > 1 ? `_${c}` : '';
    const stack = root.getObjectByName(`Chimney${sfx}`);
    if (stack) {
      const h0 = stack.geometry.parameters.height, base = stack.position.y - h0 / 2, f = 0.55;
      stack.scale.y = f; stack.position.y = base + h0 * f / 2;
      const top = base + h0 * f;
      [`ChimneyCap${sfx}`, `ChimneyBand${sfx}_0`, `ChimneyBand${sfx}_1`].forEach(n => {     // drop anything above the break
        const o = root.getObjectByName(n); if (o && o.position.y > top - 0.08) o.parent.remove(o);
      });
      const jag = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.19, 0.12, 8), SCORCH_MAT.inner);
      jag.name = `Chimney${sfx}_Break`; jag.position.set(stack.position.x, top + 0.04, stack.position.z); jag.rotation.z = 0.15;
      jag.userData.noScorch = true; root.add(addSeams(jag, 0x2c2826, 0.6));
      const sp = root.getObjectByName(`smoke_point${sfx}`); if (sp) sp.position.y = top + 0.1;
      const chunk = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.5, 8), brick);
      chunk.name = `Chimney${sfx}_Fallen`; chunk.position.set(stack.position.x + 0.35, 0.18, -D / 2 - 0.45); chunk.rotation.set(0.2, 0.6, Math.PI / 2);
      chunk.userData.noScorch = true; root.add(addSeams(chunk, 0x6b2e1b, 0.6));
    }
    // Wall breach low on the back corner of the right gable wall (clear of the windows)
    const BZ = -D / 2 + 0.42;
    const breach = holeDecal('WallBreach', 0.55, 0.45, 37);
    breach.rotation.y = Math.PI / 2; breach.position.set(W / 2 + 0.004, 0.38, BZ); root.add(breach);
    rubblePile(root, 'WallRubble', W / 2 + 0.3, BZ, 9, [card, card, dark]);
    const sm = new THREE.Object3D(); sm.name = 'damage_smoke_breach'; sm.position.set(W / 2 + 0.06, 0.45, BZ); root.add(sm);
    const door = root.getObjectByName('Door_Roll'); if (door) door.rotation.z = 0.07;   // jammed, crooked
  }
}

/* Storage: minor = cracked window + a lifted plank; medium = missing
   plank (fallen beside the wall) + crushed crate; critical = more
   planks gone, one hanging off the eave, gable breach, jammed doors,
   toppled crates, bent bollard. */
function damageStorage(root, d, damage) {
  const { W, D, H, RISE, RT, PL, RL } = d;
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const gapUnder = (hinge, plank, name) => {           // dark hole where a plank used to be
    const g = new THREE.Mesh(new THREE.BoxGeometry(plank.geometry.parameters.width - 0.12, 0.012, plank.geometry.parameters.depth - 0.04), SCORCH_MAT.inner);
    g.name = name; g.position.set(plank.position.x, 0.005, plank.position.z); g.userData.noScorch = true; hinge.add(g);
  };
  const lift = root.getObjectByName('Roof_0_Plank_1');
  if (lift) { lift.rotation.x = 0.05; lift.position.y += 0.025; }
  breakWindow(root, 'Window_R1');
  if (damage >= 2) {
    breakWindow(root, 'Window_L1');
    const p = root.getObjectByName('Roof_0_Plank_2'), hinge = root.getObjectByName('RoofSide_0');
    if (p) {
      gapUnder(hinge, p, 'RoofGap_0'); p.parent.remove(p);
      debrisBox(root, 'FallenPlank_0', p.geometry.parameters.width, RT, p.geometry.parameters.depth, lid, [W / 2 + 0.45, 0.06, p.position.z * 0.6], [0, 0.35, 0.2]);
    }
    const crate = root.getObjectByName('Crate_R0');
    if (crate) {
      crate.scale.y = 0.6; crate.position.y *= 0.6; crate.rotation.z = 0.18;
      const top = root.getObjectByName('Crate_R1'); if (top) { top.position.y -= 0.34 * 0.85 * 0.4; top.rotation.z = 0.25; }
    }
    const sm = new THREE.Object3D(); sm.name = 'damage_smoke_roof'; sm.position.set(W * 0.22, H + RISE * 0.55, p ? p.position.z : 0); root.add(sm);
  }
  if (damage >= 3) {
    breakWindow(root, 'Window_R0'); breakWindow(root, 'Window_L2');
    const back = root.getObjectByName('RoofSide_1');
    const p2 = root.getObjectByName('Roof_1_Plank_1');
    if (p2) {
      gapUnder(back, p2, 'RoofGap_1'); p2.parent.remove(p2);
      debrisBox(root, 'FallenPlank_1', p2.geometry.parameters.width, RT, p2.geometry.parameters.depth, lid, [-W / 2 - 0.5, 0.07, -0.4], [0.1, -0.5, -0.25]);
    }
    const hang = root.getObjectByName('Roof_0_Plank_0');      // hanging off the eave
    if (hang) { hang.rotation.z = -0.55; hang.position.x += 0.18; hang.position.y -= 0.2; }
    const breach = holeDecal('GableBreach', 0.55, 0.3, 41);
    breach.position.set(W * 0.15, H + RISE * 0.3, D / 2 + 0.004); root.add(breach);
    rubblePile(root, 'GableRubble', W * 0.15, D / 2 + 0.45, 13, [card, lid, card]);
    root.traverse(o => { if (o.name.startsWith('Door_Roll')) o.rotation.z = (o.name.endsWith('1') ? -1 : 1) * 0.06; });
    const c1 = root.getObjectByName('Crate_L1');
    if (c1) { c1.position.set(c1.position.x - 0.35, 0.13, c1.position.z + 0.3); c1.rotation.set(1.2, 0.4, 0.2); }
    const b0 = root.getObjectByName('Bollard_0'); if (b0) { b0.rotation.z = 0.5; b0.position.x -= 0.06; }
  }
}

/* ------------------------------------------------------------------
   More building damage: Command Center, Ink Depot, Hangar, Runway,
   Helipad. Shared bits first.
------------------------------------------------------------------ */
const DEAD_LIGHT = new THREE.MeshStandardMaterial({ name: 'DeadLight', color: 0x2a2725, roughness: 0.8, flatShading: true });
DEAD_LIGHT.userData.shared = true;

function breakPane(root, name) {                     // a bare glass plane (e.g. tower cab panes)
  const pane = root.getObjectByName(name); if (!pane) return;
  pane.material = BROKEN_GLASS;
  const w = pane.geometry.parameters?.width || 0.3, h = pane.geometry.parameters?.height || 0.2;
  [[0.6, 0], [-0.8, 0.15]].forEach(([r, oy], k) => {
    const c = new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(w, h) * 0.5, 0.008, 0.004), CRACK_MAT);
    c.name = `${name}_Crack_${k}`; c.rotation.z = r; c.position.set(0, h * oy, 0.003); c.userData.noScorch = true; pane.add(c);
  });
}
function killLight(root, name) { const m = root.getObjectByName(name); if (m) m.material = DEAD_LIGHT; }
function smokeAt(root, name, x, y, z) { const o = new THREE.Object3D(); o.name = `damage_smoke_${name}`; o.position.set(x, y, z); root.add(o); return o; }
// Decal on a surface with normal n (Vector3), lifted slightly off it
function decalOn(parent, mesh, pos, n) {
  mesh.position.copy(pos).addScaledVector(n, 0.004);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n.clone().normalize());
  parent.add(mesh); return mesh;
}
// Flat crater on a horizontal surface at height y: scorch ring + dark hole + bits of debris
function crater(root, name, x, y, z, size, seed, mats) {
  const rnd = seeded(seed);
  const ring = new THREE.Mesh(scorchGeometry(rnd), SCORCH_MAT.outer);
  ring.name = `${name}_Scorch`; ring.scale.setScalar(size * 0.75); ring.rotation.x = -Math.PI / 2; ring.position.set(x, y + 0.002, z);
  ring.userData.noScorch = true; root.add(ring);
  const hole = holeDecal(`${name}_Hole`, size * 0.75, size * 0.6, seed + 1);
  hole.rotation.x = -Math.PI / 2; hole.position.set(x, y + 0.004, z); root.add(hole);
  for (let k = 0; k < 4; k++) {
    const a = rnd() * Math.PI * 2, r = size * (0.45 + rnd() * 0.25), s = 0.04 + rnd() * 0.05;
    debrisBox(root, `${name}_Bit_${k}`, s * 1.4, s * 0.5, s, mats[k % mats.length], [x + Math.cos(a) * r, y + s * 0.3, z + Math.sin(a) * r], [rnd() * 0.5, rnd() * 3, rnd() * 0.5]);
  }
}
function cracks(root, name, x, y, z, len, seed) {
  const rnd = seeded(seed);
  let px = x, pz = z, a = rnd() * Math.PI;
  for (let k = 0; k < 4; k++) {
    const l = len * (0.2 + rnd() * 0.15);
    const c = new THREE.Mesh(new THREE.BoxGeometry(l, 0.004, 0.018), SCORCH_MAT.inner);
    c.name = `${name}_${k}`; c.position.set(px + Math.cos(a) * l / 2, y, pz - Math.sin(a) * l / 2); c.rotation.y = a;
    c.userData.noScorch = true; root.add(c);
    px += Math.cos(a) * l; pz -= Math.sin(a) * l; a += (rnd() - 0.5) * 1.4;
  }
}

/* Command Center — critical: the control tower is broken (cab roof and
   antenna knocked onto the main roof, cab top bent, panes smashed, a
   breach in the shaft). */
function damageCommand(root, d, damage) {
  const { W, D, H, TX, TZ, TS, TH, CB, CH, CS } = d;
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  ['Window_F0', 'Window_F3'].forEach(n => breakWindow(root, n));
  if (damage >= 2) {
    ['Window_B1', 'Window_R0', 'Window_L0'].forEach(n => breakWindow(root, n));
    breakPane(root, 'CabGlass_0');
    const hole = holeDecal('RoofHole', 0.6, 0.42, 51); hole.rotation.x = -Math.PI / 2; hole.position.set(-W * 0.25, H + 0.054, 0.1); root.add(hole);
    debrisBox(root, 'RoofPlankLoose', W / Math.round(W / 0.3), 0.05, 0.6, lid, [-W * 0.25 - 0.3, H + 0.12, 0.25], [0.3, 0.4, 0.5]);
    const can = root.getObjectByName('Canopy'); if (can) { can.rotation.z = 0.12; can.position.y -= 0.03; }
    smokeAt(root, 'roof', -W * 0.25, H + 0.08, 0.1);
  }
  if (damage >= 3) {
    ['CabGlass_1', 'CabGlass_2', 'CabGlass_4'].forEach(n => breakPane(root, n));
    ['CabRoof', 'Antenna', 'TowerBeacon', 'CabMullion_2'].forEach(n => { const o = root.getObjectByName(n); o?.parent.remove(o); });
    const top = root.getObjectByName('CabTop'); if (top) { top.rotation.set(0.22, 0, 0.18); top.position.y -= 0.03; }
    // fallen cab roof + bent antenna on the main roof beside the tower
    const fr = new THREE.Mesh(new THREE.CylinderGeometry(0.26 * CS, 0.62 * CS, 0.17 * CS, 6), lid);
    fr.name = 'FallenCabRoof'; fr.position.set(TX - TS / 2 - 0.55 * CS, H + 0.17, TZ + 0.35); fr.rotation.set(0.35, 0.4, 1.05);
    fr.userData.noScorch = true; root.add(addSeams(fr));
    debrisBox(root, 'FallenAntenna', 0.035, 0.035, 0.3 * CS, dark, [TX - TS / 2 - 0.25, H + 0.08, TZ + 0.7], [0.1, 0.9, 0.2]);
    // breach in the tower shaft (front face, above the main roof)
    const breach = holeDecal('TowerBreach', 0.38, 0.5, 61);
    breach.position.set(TX, Math.max(H + 0.4, TH * 0.6), TZ + TS / 2 + 0.004); root.add(breach);
    smokeAt(root, 'tower', TX, Math.max(H + 0.4, TH * 0.6), TZ + TS / 2 + 0.06);
    rubblePile(root, 'TowerRubble', TX - TS / 2 - 0.25, TZ + 0.1, 17, [card, lid], H + 0.05);   // on the main roof
    // radar hut (L2+): dish jammed and knocked askew
    const spin = root.getObjectByName('RadarHut_Spin');
    if (spin) { spin.userData.joint.prop = 'jammed'; spin.rotation.set(0.3, 0.8, 0.15); }
  }
}

/* Ink Depot — critical: a tank is punctured and leaking ink. */
function damageInk(root, d, damage) {
  const { tanks, PX, PZ, HW, HD, HH, PH, PY, ZF, ink } = d;
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  breakWindow(root, 'PumpHouse_Window');
  const band = root.getObjectByName('Tank_0_Band_1'); if (band) band.rotation.z = 0.08;
  const puddle = (name, x, z, w, h, seed) => {
    const p = holeDecal(name, w, h, seed); p.material = ink; p.rotation.x = -Math.PI / 2; p.position.set(x, PH + 0.004, z); root.add(p); return p;
  };
  if (damage >= 2) {
    // main pipe snapped in the middle, ends drooping, a small puddle under the gap
    const main = root.getObjectByName('Pipe_Main');
    if (main) {
      const xA = PX - HW / 2, xB = Math.min(...tanks.map(t => t.x)), mid = (xA + xB) / 2;
      main.parent.remove(main);
      const seg = (name, a, b) => {
        const dir = b.clone().sub(a), len = dir.length();
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, len, 6), dark);
        m.name = name; m.position.copy(a).addScaledVector(dir, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        root.add(addSeams(m, 0x2c2826, 0.6));
      };
      seg('Pipe_Main_A', new THREE.Vector3(xA, PY, ZF), new THREE.Vector3(mid + 0.13, PY - 0.05, ZF));
      seg('Pipe_Main_B', new THREE.Vector3(mid - 0.13, PY - 0.06, ZF + 0.02), new THREE.Vector3(xB, PY, ZF));
      puddle('PipePuddle', mid, ZF + 0.05, 0.35, 0.25, 71);
    }
    const hatch = root.getObjectByName('Tank_0_Hatch');
    if (hatch) { hatch.position.set(tanks[0].x - tanks[0].r - 0.25, PH + 0.04, tanks[0].z + 0.3); hatch.rotation.set(1.3, 0, 0.3); }
    const rung = root.getObjectByName('Tank_0_Rung_2'); rung?.parent.remove(rung);
    smokeAt(root, 'pump', PX, PH + HH + 0.12, PZ);
  }
  if (damage >= 3) {
    // Puncture on tank 0's front-left face, ink streaming down into a pool
    const t = tanks[0], a = -Math.PI / 4, ap = t.r * Math.cos(Math.PI / 8);
    const n = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
    const hp = new THREE.Vector3(t.x + n.x * ap, PH + t.h * 0.38, t.z + n.z * ap);
    decalOn(root, holeDecal('TankPuncture', 0.24, 0.18, 81), hp, n);
    const start = hp.clone().addScaledVector(n, 0.03), end = new THREE.Vector3(hp.x + n.x * 0.28, PH + 0.01, hp.z + n.z * 0.28);
    const dir = end.clone().sub(start), len = dir.length();
    const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, len, 6), ink);
    stream.name = 'InkLeak'; stream.position.copy(start).addScaledVector(dir, 0.5);
    stream.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    stream.userData.leakStream = true; stream.userData.noScorch = true; root.add(stream);
    puddle('InkPool', end.x + n.x * 0.15, end.z + n.z * 0.15, 0.9, 0.6, 83);
    const lv = root.getObjectByName('InkLevel_0'); if (lv) lv.userData.leak = true;
    const roofHole = holeDecal('PumpRoofHole', 0.3, 0.22, 85); roofHole.rotation.x = -Math.PI / 2;
    roofHole.position.set(PX - 0.1, PH + HH + 0.104, PZ + 0.05); root.add(roofHole);
    const wheel = root.getObjectByName('Pump_Spin'); if (wheel) wheel.userData.joint.prop = 'jammed';
    const boom = root.getObjectByName('LoadingArm_Boom'); if (boom) { boom.rotation.x += 0.35; }
    const drop = root.getObjectByName('LoadingArm_Drop'); drop?.parent.remove(drop);
    rubblePile(root, 'TankRubble', t.x - t.r - 0.1, t.z + t.r + 0.1, 87, [card, lid, dark]);
    smokeAt(root, 'tank', hp.x + n.x * 0.05, hp.y + 0.05, hp.z + n.z * 0.05);
  }
}

/* Hangar — broken roof: holes, a peeled panel, a missing rib, breach. */
function damageHangar(root, d, damage) {
  const { R, D, WH, DW } = d;
  const card = MAT.cardboard(), lid = MAT.cardboardLid(), dark = MAT.rubber();
  const onRoof = (name, a, z, w, h, seed) => {
    const n = new THREE.Vector3(Math.cos(a), Math.sin(a), 0);
    return decalOn(root, holeDecal(name, w, h, seed), new THREE.Vector3(Math.cos(a) * (R + 0.05), WH + Math.sin(a) * (R + 0.05), z), n);
  };
  ['Window_L0', 'Window_F0'].forEach(n => breakWindow(root, n));
  if (damage >= 2) {
    ['Window_L1', 'Window_R1', 'Annex_0_WinF'].forEach(n => breakWindow(root, n));
    const a = 0.65 * Math.PI, z = 0.2 * D;
    onRoof('RoofHole_0', a, z, 0.6, 0.45, 91);
    const flap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.03, 0.45), lid);   // peeled-up roof panel
    flap.name = 'PeeledPanel'; flap.position.set(Math.cos(a) * (R + 0.2), WH + Math.sin(a) * (R + 0.2), z + 0.1);
    flap.rotation.set(0.15, 0, a - Math.PI / 2 + 0.7); flap.userData.noScorch = true; root.add(addSeams(flap));
    smokeAt(root, 'roof', Math.cos(a) * (R + 0.08), WH + Math.sin(a) * (R + 0.08), z);
  }
  if (damage >= 3) {
    const a = 0.35 * Math.PI;
    onRoof('RoofHole_1', a, -0.25 * D, 1.0, 0.75, 93);
    const rib = root.getObjectByName('RoofRib_2');
    if (rib) {
      rib.parent.remove(rib);
      debrisBox(root, 'FallenRib_0', 0.9, 0.06, 0.07, dark, [R + 0.45, 0.04, rib.position.z + 0.1], [0, 0.4, 0.05]);
      debrisBox(root, 'FallenRib_1', 0.7, 0.06, 0.07, dark, [R + 0.35, 0.04, rib.position.z - 0.3], [0, -0.3, 0.1]);
    }
    root.traverse(o => { if (o.name.startsWith('Door_Roll')) o.rotation.z = 0.06; });
    const back = holeDecal('BackBreach', 0.75, 0.6, 95);
    back.rotation.y = Math.PI; back.position.set(0.3 * R, WH + R * 0.35, -D / 2 - 0.004); root.add(back);
    rubblePile(root, 'BackRubble', 0.3 * R, -D / 2 - 0.4, 97, [card, lid, dark]);
    rubblePile(root, 'RoofRubble', R + 0.35, -0.25 * D, 99, [lid, card]);
    const annexRoof = root.getObjectByName('Annex_0_Roof');
    if (annexRoof) { const h = holeDecal('AnnexRoofHole', 0.4, 0.3, 101); h.rotation.x = -Math.PI / 2; h.position.set(annexRoof.position.x, annexRoof.position.y + 0.034, annexRoof.position.z); root.add(h); }
    smokeAt(root, 'roofbig', Math.cos(a) * (R + 0.08), WH + Math.sin(a) * (R + 0.08), -0.25 * D);
  }
}

/* Runway — craters, cracks, dead lights; critical breaks through a tile. */
function damageRunway(root, d, damage) {
  const { L, W, TH } = d, y = TH + 0.026;
  const asphalt = root.getObjectByName('Asphalt')?.material, card = MAT.cardboard();
  const mats = [asphalt || card, card];
  crater(root, 'Crater_0', -L * 0.25, y, W * 0.18, 0.24, 111, mats);
  crater(root, 'Crater_1', L * 0.18, y, -W * 0.15, 0.2, 113, mats);
  ['EdgeBeacon_3', 'EdgeBeacon_10'].forEach(n => killLight(root, n));
  if (damage >= 2) {
    crater(root, 'Crater_2', L * 0.36, y, W * 0.1, 0.32, 115, mats);
    crater(root, 'Crater_3', -L * 0.06, y, -W * 0.24, 0.26, 117, mats);
    cracks(root, 'Crack_A', -L * 0.25 + 0.15, y, W * 0.18, 1.2, 119);
    cracks(root, 'Crack_B', L * 0.36 - 0.1, y, W * 0.1, 1.0, 121);
    ['CentreLight_2', 'CentreLight_3', 'EdgeBeacon_5', 'EdgeBeacon_14'].forEach(n => killLight(root, n));
    smokeAt(root, 'crater', L * 0.36, y + 0.02, W * 0.1);
  }
  if (damage >= 3) {
    crater(root, 'Crater_Big', L * 0.04, y, W * 0.05, 0.8, 123, mats);
    debrisBox(root, 'LiftedSlab_0', 0.5, 0.05, 0.4, asphalt || card, [L * 0.04 + 0.45, y + 0.1, W * 0.05 + 0.15], [0.45, 0.4, 0.25]);
    debrisBox(root, 'LiftedSlab_1', 0.35, 0.05, 0.3, card, [L * 0.04 - 0.4, y + 0.06, W * 0.05 - 0.2], [-0.3, 1.1, -0.2]);
    cracks(root, 'Crack_C', L * 0.04 + 0.35, y, W * 0.05, 1.6, 125);
    cracks(root, 'Crack_D', L * 0.04 - 0.4, y, W * 0.05, 1.4, 127);
    ['CentreLight_0', 'CentreLight_4', 'EdgeBeacon_0', 'EdgeBeacon_7', 'EdgeBeacon_12', 'EdgeBeacon_19'].forEach(n => killLight(root, n));
    smokeAt(root, 'bigcrater', L * 0.04, y + 0.02, W * 0.05);
  }
}

/* Helipad — craters on the deck, displaced/fallen border pieces, a lost leg. */
function damageHelipad(root, d, damage) {
