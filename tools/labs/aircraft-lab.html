  // Engine pods with spike cones, through the middle of each wing
  const PX = 0.66;
  const nozzles = [-1, 1].map((s, i) => {
    const cx = s * PX;
    addIntake(K, [octRing(cx, 0, -1.55, 0.16), octRing(cx, 0, -1.25, 0.175), octRing(cx, 0, 0.15, 0.175), octRing(cx, 0, 0.45, 0.15)], `EnginePod_${i}`);
    const sp = new THREE.ConeGeometry(0.085, 0.45, 8); sp.rotateX(Math.PI / 2);
    add(sp, skinMat, `InletSpike_${i}`).position.set(cx, 0, 0.56);
    return addOctNozzle(K, cx, 0, -1.55, 0.14, 0.155, 0.14, `Nozzle_${i}`);
  });

  // Fins on the pods, canted inward
  [-1, 1].forEach((s, i) => {
    const o = [[-0.72, -0.12], [-1.12, 0.56], [-1.32, 0.56], [-1.42, -0.12]].map(([z, y]) => V3(0, y, z));
    const fin = add(bevelSlab(o, V3(1, 0, 0), [0.07, 0.045, 0.045, 0.07], 0.02), skinMat, `Fin_${i}`);
    fin.position.set(s * PX, 0.14, 0);
    fin.rotation.z = s * 0.22;
  });

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.z = -1.75; flight.add(ex);
  K.root.userData.fx = buildFlightFx(flight, { nozzles, tips: [[1.18, 0, -1.4], [-1.18, 0, -1.4]] });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Thug (A-10-inspired ground attack)
   Boxy body with a blunt nose, spinning gatling gun, blue
   canopy, straight low wings with bomb blocks and roundels, two big
   engines high on the rear body, a twin-fin tail with moving elevators.
------------------------------------------------------------------ */
const THUG_BODY = [
  { z: -1.65, ht: 0.12, sh: [0.10, 0.11], wall: [0.12, 0.06, -0.04], bot: [0.09, -0.08] },
  { z: -0.60, ht: 0.21, sh: [0.16, 0.19], wall: [0.20, 0.10, -0.10], bot: [0.15, -0.17] },
  { z:  0.40, ht: 0.28, sh: [0.20, 0.25], wall: [0.26, 0.12, -0.18], bot: [0.20, -0.25] },
  { z:  1.10, ht: 0.30, sh: [0.20, 0.27], wall: [0.27, 0.10, -0.18], bot: [0.20, -0.25] },
  { z:  1.60, ht: 0.18, sh: [0.18, 0.16], wall: [0.24, 0.05, -0.16], bot: [0.18, -0.22] },
  { z:  1.76, ht: 0.08, sh: [0.13, 0.07], wall: [0.18, 0.02, -0.12], bot: [0.14, -0.17] },
];

function buildThug(skin = 'cardboard') {
  const K = planeKit('Thug', skin, 0x7f97b5);
  const { add, skinMat, dark, flight } = K;
  const topAt = z => stationTopAt(THUG_BODY, [0, 0, 1.8], z);

  add(loftRings(THUG_BODY.map(bodyRing)), skinMat, 'Fuselage');

  // Boxy canopy
  const cRing = (z, w, h) => {
    const by = topAt(z) - 0.05;
    return [[-w, 0], [-w * 0.85, h * 0.85], [-w * 0.4, h], [w * 0.4, h], [w * 0.85, h * 0.85], [w, 0]].map(([x, y]) => V3(x, by + y, z));
  };
  add(loftRings([cRing(0.80, 0.16, 0.14), cRing(1.12, 0.18, 0.19), cRing(1.38, 0.16, 0.13)], {
    tipBack: V3(0, topAt(0.5) + 0.01, 0.5), tipFront: V3(0, topAt(1.58) + 0.01, 1.58),
  }), K.canopyMat, 'Canopy');

  // Gatling gun
  const gun = new THREE.CylinderGeometry(0.075, 0.075, 0.3, 8); gun.rotateX(Math.PI / 2);
  add(gun, dark, 'GunBody').position.set(0, -0.09, 1.79);           // tucked back into the nose
  // Rotating barrel cluster (Gun_Spin, rotation.z)
  const spin = new THREE.Group(); spin.name = 'Gun_Spin'; spin.position.set(0, -0.09, 1.96);
  spin.userData.joint = { type: 'rotate', axis: 'z', label: 'Gun spin', note: 'Spin while firing: rotation.z += ~8 rad/s.' };
  flight.add(spin);
  const barrelMat = new THREE.MeshStandardMaterial({ name: 'GunBarrels', color: 0x1f1c1a, roughness: 0.9, flatShading: true });
  const plate = new THREE.CylinderGeometry(0.07, 0.07, 0.025, 6); plate.rotateX(Math.PI / 2);
  add(plate, dark, 'GunPlate', true, spin).position.z = 0.0;
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, b = new THREE.CylinderGeometry(0.016, 0.016, 0.12, 6); b.rotateX(Math.PI / 2);
    add(b, barrelMat, `GunBarrel_${k}`, false, spin).position.set(Math.cos(a) * 0.045, Math.sin(a) * 0.045, 0.06);
  }
  const muzzle = new THREE.Object3D(); muzzle.name = 'muzzle_point'; muzzle.position.set(0, -0.09, 2.14); flight.add(muzzle);

  // Straight, low wings with bomb blocks and roundels
  [-1, 1].forEach((s, i) => {
    const o = [[0.22, 0.35], [1.85, 0.16], [1.85, -0.24], [0.22, -0.30]].map(([x, z]) => V3(s * x, -0.13, z));
    add(bevelSlab(o, V3(0, 1, 0), [0.11, 0.055, 0.055, 0.11], 0.03), skinMat, `Wing_${i}`);
    // blocks hang flush against the wing's underside (wing thins toward the tip)
    [0.6, 1.0, 1.4].forEach((x, k) => {
      const t = 0.11 - (x - 0.22) / (1.85 - 0.22) * 0.055;
      addBlock(K, `Bomb_${i}_${k}`, 0.12, 0.11, 0.3, s * x, -0.13 - t / 2 - 0.05, 0.04);
    });
    addRoundel(K, `Roundel_${i}`, s * 1.2, -0.087, 0.0, 0.14);
  });

  // Two big engines high on the rear body, on short pylons
  const nozzles = [-1, 1].map((s, i) => {
    const cx = s * 0.36, cy = 0.42;
    addIntake(K, [octRing(cx, cy, -1.0, 0.2), octRing(cx, cy, -0.75, 0.22), octRing(cx, cy, -0.15, 0.22)], `Engine_${i}`);
    const hub = new THREE.CircleGeometry(0.07, 8);
    add(hub, K.rimMat, `EngineFan_${i}`, false).position.set(cx, cy, -0.26);
    addBlock(K, `EnginePylon_${i}`, 0.08, 0.18, 0.5, s * 0.2, 0.27, -0.6);
    return addOctNozzle(K, cx, cy, -1.0, 0.1, 0.19, 0.17, `Nozzle_${i}`);
  });

  // Tail: fixed tailplane + moving elevators, twin fins on its tips
  [-1, 1].forEach((s, i) => {
    const o = [[0.08, -1.30], [1.02, -1.34], [1.02, -1.60], [0.08, -1.60]].map(([x, z]) => V3(s * x, 0.10, z));
    add(bevelSlab(o, V3(0, 1, 0), [0.07, 0.05, 0.05, 0.07], 0.02), skinMat, `Tailplane_${i}`);
    const f = [[-1.24, -0.22], [-1.32, 0.48], [-1.72, 0.48], [-1.78, -0.22]].map(([z, y]) => V3(0, y, z));
    add(bevelSlab(f, V3(1, 0, 0), 0.07, 0.02), skinMat, `Fin_${i}`).position.set(s * 1.02, 0.10, 0);
  });
  addStabilisers(K, [[0.10, -1.61], [0.95, -1.61], [0.95, -1.78], [0.10, -1.78]], 0.10, [0.5, -1.61], [0.05, 0.035, 0.035, 0.05]);

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.set(0, 0.42, -1.15); flight.add(ex);
  K.root.userData.fx = buildFlightFx(flight, { nozzles, tips: [[1.85, -0.13, -0.24], [-1.85, -0.13, -0.24]] });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Widewing (B-52-inspired heavy bomber)
   Long boxy body with a blunt nose and dark cockpit windows, big swept
   high wings with four twin-engine pods on pylons, a tall fin, moving
   tail planes and roundels.
------------------------------------------------------------------ */
const WIDE_BODY = [
  { z: -2.20, ht: 0.10, sh: [0.07, 0.09], wall: [0.10, 0.04, -0.02], bot: [0.06, -0.06] },
  { z: -1.20, ht: 0.22, sh: [0.15, 0.19], wall: [0.21, 0.10, -0.12], bot: [0.15, -0.20] },
  { z:  0.50, ht: 0.25, sh: [0.17, 0.22], wall: [0.23, 0.12, -0.15], bot: [0.17, -0.24] },
  { z:  1.60, ht: 0.25, sh: [0.17, 0.22], wall: [0.23, 0.12, -0.15], bot: [0.17, -0.24] },
  { z:  2.05, ht: 0.20, sh: [0.15, 0.17], wall: [0.21, 0.08, -0.13], bot: [0.15, -0.21] },
  { z:  2.30, ht: 0.09, sh: [0.10, 0.08], wall: [0.15, 0.02, -0.07], bot: [0.10, -0.13] },
];
const WIDE_NOSE = [0, -0.03, 2.40];

function buildWidewing(skin = 'cardboard') {
  const K = planeKit('Widewing', skin, 0x3c3f45);
  const { add, skinMat, flight } = K;
  const topAt = z => stationTopAt(WIDE_BODY, WIDE_NOSE, z);

  add(loftRings(WIDE_BODY.map(bodyRing), { tipFront: V3(...WIDE_NOSE), tipBack: V3(0, 0.03, -2.45) }), skinMat, 'Fuselage');

  // Cockpit windows — a low dark band on the nose
  const cRing = (z, w, h) => {
    const by = topAt(z) - 0.04;
    return [[-w, 0], [-w * 0.7, h * 0.85], [0, h], [w * 0.7, h * 0.85], [w, 0]].map(([x, y]) => V3(x, by + y, z));
  };
  add(loftRings([cRing(1.98, 0.16, 0.06), cRing(2.14, 0.14, 0.05)], {
    tipBack: V3(0, topAt(1.85) + 0.005, 1.85), tipFront: V3(0, topAt(2.3) - 0.005, 2.3),
  }), K.canopyMat, 'CockpitWindows');

  // Swept high wings
  const LE = x => 0.85 - (x - 0.2) * (1.6 / 2.45);
  [-1, 1].forEach((s, i) => {
    const o = [[0.20, 0.85], [2.65, -0.75], [2.65, -1.0], [0.20, -0.35]].map(([x, z]) => V3(s * x, 0.14, z));
    add(bevelSlab(o, V3(0, 1, 0), [0.1, 0.04, 0.04, 0.1], 0.025), skinMat, `Wing_${i}`);
    addRoundel(K, `Roundel_${i}`, s * 2.0, 0.172, -0.45, 0.13, true);
  });

  // Four twin-engine pods hanging on pylons
  const nozzles = [];
  [-1, 1].forEach((s, i) => [0.85, 1.75].forEach((px, j) => {
    const x = s * px, zf = LE(px) + 0.3, y = -0.05;
    addBlock(K, `Pylon_${i}_${j}`, 0.04, 0.12, 0.34, x, 0.06, zf - 0.32);
    [-1, 1].forEach((t, k) => {
      const cx = x + t * 0.088;
      addIntake(K, [octRing(cx, y, zf - 0.62, 0.07), octRing(cx, y, zf - 0.15, 0.085), octRing(cx, y, zf, 0.085)], `Engine_${i}_${j}_${k}`);
      nozzles.push(addOctNozzle(K, cx, y, zf - 0.62, 0.06, 0.07, 0.062, `Nozzle_${i}_${j}_${k}`));
    });
  }));

  // Tall fin + moving tail planes
  {
    const o = [[-1.35, -0.05], [-1.98, 0.98], [-2.24, 0.98], [-2.34, -0.05]].map(([z, y]) => V3(0, y, z));
    add(bevelSlab(o, V3(1, 0, 0), [0.08, 0.05, 0.05, 0.08], 0.022), skinMat, 'Fin').position.y = 0.16;
  }
  addStabilisers(K, [[0.08, -1.72], [0.98, -2.08], [0.98, -2.28], [0.08, -2.34]], 0.06, [0.12, -2.05], [0.07, 0.04, 0.04, 0.07]);

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.set(0, -0.05, -0.5); flight.add(ex);
  K.root.userData.fx = buildFlightFx(flight, { nozzles, tips: [[2.65, 0.14, -1.0], [-2.65, 0.14, -1.0]] });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Jumper (AV-8B Harrier-inspired VTOL fighter)
   Chunky body with a tall canopy and big D-shaped side intakes,
   shoulder wings drooping toward the tips with pylons and stores, a
   tall swept fin, moving tail planes, and two swivelling side
   nozzles (Nozzle_RL/RR, rotation.x: 0 = aft, −1.45 = down).
------------------------------------------------------------------ */
const JUMPER_BODY = [
  { z: -1.75, ht: 0.11, sh: [0.07, 0.09], wall: [0.10, 0.03, -0.03], bot: [0.07, -0.07] },
  { z: -1.00, ht: 0.21, sh: [0.15, 0.18], wall: [0.20, 0.06, -0.08], bot: [0.14, -0.15] },
  { z: -0.20, ht: 0.28, sh: [0.20, 0.24], wall: [0.27, 0.10, -0.16], bot: [0.20, -0.24] },
  { z:  0.50, ht: 0.31, sh: [0.16, 0.26], wall: [0.18, 0.12, -0.17], bot: [0.15, -0.23] },
  { z:  1.05, ht: 0.30, sh: [0.15, 0.25], wall: [0.20, 0.08, -0.12], bot: [0.14, -0.17] },
  { z:  1.50, ht: 0.16, sh: [0.12, 0.13], wall: [0.16, 0.02, -0.06], bot: [0.10, -0.11] },
  { z:  1.75, ht: 0.07, sh: [0.06, 0.06], wall: [0.08, 0.00, -0.03], bot: [0.05, -0.05] },
];
const JUMPER_NOSE = [0, -0.01, 1.92];

function buildJumper(skin = 'cardboard') {
  const K = planeKit('Jumper', skin, 0xa9b0b8);
  const { add, skinMat, flight } = K;
  const topAt = z => stationTopAt(JUMPER_BODY, JUMPER_NOSE, z);
  const blockIn = (parent, name, w, h, d, x, y, z) => {
    const g = boxUV(new THREE.BoxGeometry(w, h, d).toNonIndexed()); g.computeVertexNormals();
    const m = add(g, skinMat, name, true, parent); m.position.set(x, y, z); return m;
  };

  add(loftRings(JUMPER_BODY.map(bodyRing), { tipFront: V3(...JUMPER_NOSE), tipBack: V3(0, 0.04, -2.0) }), skinMat, 'Fuselage');

  // Tall canopy
  const cRing = (z, w, h) => {
    const by = topAt(z) - 0.06;
    return [[-w, 0], [-w * 0.75, h * 0.8], [-w * 0.3, h], [w * 0.3, h], [w * 0.75, h * 0.8], [w, 0]].map(([x, y]) => V3(x, by + y, z));
  };
  add(loftRings([cRing(0.68, 0.13, 0.13), cRing(0.97, 0.15, 0.18), cRing(1.22, 0.125, 0.12)], {
    tipBack: V3(0, topAt(0.3) + 0.01, 0.3), tipFront: V3(0, topAt(1.45) - 0.01, 1.45),
  }), K.canopyMat, 'Canopy');

  // Big D-shaped side intakes: flat against the body, rounded outside
  const D = [[0.17, -0.20], [0.29, -0.22], [0.39, -0.14], [0.43, 0.02], [0.39, 0.17], [0.29, 0.26], [0.17, 0.24]];   // tucked in against the body
  [-1, 1].forEach((s, i) => {
    const ring = (z, k = 1, dz = 0) => D.map(([x, y], j) => V3(s * (0.17 + (x - 0.17) * k), y * (0.4 + 0.6 * k), z + (j >= 3 ? dz : 0)));
    addIntake(K, [ring(-0.55, 0.3), ring(0.0, 1), ring(0.55, 0.96, -0.05)], `Intake_${i}`, { tipBack: V3(s * 0.22, 0.0, -0.95) });
  });

  // Shoulder wings with anhedral, pylons and stores underneath
  const LE = x => 0.15 - (x - 0.10) * (0.70 / 1.15);
  [-1, 1].forEach((s, i) => {
    const o = [[0.10, 0.15], [1.25, -0.55], [1.25, -0.75], [0.10, -0.85]].map(([x, z]) => V3(s * (x - 0.10), 0, z));
    const wing = add(bevelSlab(o, V3(0, 1, 0), [0.1, 0.045, 0.045, 0.1], 0.03), skinMat, `Wing_${i}`);
    wing.position.set(s * 0.10, 0.14, 0);                     // sunk into the body's shoulders
    wing.rotation.z = -s * 0.16;                              // droop toward the tips
    [0.74, 1.04].forEach((x, k) => {
      const lx = s * (x - 0.10), t = 0.1 - (x - 0.1) / 1.15 * 0.055, zc = LE(x) - 0.26 + (k === 1 ? 0.12 : 0);   // outer one sits further forward
      blockIn(wing, `Pylon_${i}_${k}`, 0.035, 0.08, 0.24, lx, -t / 2 - 0.035, zc);
      blockIn(wing, `Store_${i}_${k}`, 0.08, 0.08, 0.40, lx, -t / 2 - 0.11, zc + 0.04);
    });
  });

  // Tall swept fin + moving tail planes
  {
    const o = [[-0.95, -0.1], [-1.55, 0.66], [-1.76, 0.66], [-1.82, -0.1]].map(([z, y]) => V3(0, y, z));
    add(bevelSlab(o, V3(1, 0, 0), [0.08, 0.05, 0.05, 0.08], 0.022), skinMat, 'Fin').position.y = 0.14;
  }
  addStabilisers(K, [[0.07, -1.32], [0.72, -1.60], [0.72, -1.75], [0.07, -1.82]], 0.03, [0.10, -1.56], [0.07, 0.04, 0.04, 0.07]);

  // Four swivelling nozzles on the body sides
  const vtol = [], nozzles = [];
  [['R', -0.38]].forEach(([fr, z]) => [-1, 1].forEach(s => {
    const pivot = new THREE.Group(); pivot.name = `Nozzle_${fr}${s < 0 ? 'L' : 'R'}`;
    pivot.position.set(s * 0.33, -0.08, z);
    pivot.userData.joint = { type: 'rotate', axis: 'x', min: -1.45, max: 0, label: 'Thrust vector',
      note: '0 = pointing aft (cruise), −1.45 = pointing down (hover).' };
    flight.add(pivot);
    const g = new THREE.CylinderGeometry(0.085, 0.075, 0.22, 8); g.rotateY(Math.PI / 8); g.rotateX(Math.PI / 2);
    add(g, K.rimMat, `${pivot.name}_Can`, true, pivot).position.z = -0.08;
    const hole = new THREE.CircleGeometry(0.055, 8); hole.rotateZ(Math.PI / 8); hole.rotateY(Math.PI);
    add(hole, K.burner, `${pivot.name}_Glow`, false, pivot).position.z = -0.193;
    const out = new THREE.Object3D(); out.name = `exhaust_${fr}${s < 0 ? 'L' : 'R'}`; out.position.z = -0.2; pivot.add(out);
    vtol.push(pivot);
    nozzles.push({ x: 0, y: 0, z: -0.195, r: 0.06, parent: pivot });
  }));
  K.root.userData.vtol = vtol;

  K.root.userData.fx = buildFlightFx(flight, { nozzles, tips: [[1.25, -0.04, -0.75], [-1.25, -0.04, -0.75]] });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Ghost (B-2 Spirit-inspired stealth bomber)
   Flying wing: flat panels thick at the centre and thin at the tips,
   saw-tooth trailing edge, a raised cockpit hump with dark windows,
   two engine humps with dark intakes, dark exhaust troughs on top,
   and moving elevons on the outer trailing edges (Stabiliser_L / _R,
   rotation.x about the hinge line). No tail.
------------------------------------------------------------------ */
function buildGhost(skin = 'cardboard') {
  const K = planeKit('Ghost', skin, 0x3a3d42);
  const { add, skinMat, flight } = K;
  const LE = x => 1.0 - Math.abs(x) * 0.592;            // leading edge, nose at z = 1.0
  const T = x => 0.12 - Math.abs(x) * 0.034;            // panel thickness, centre → tip
  // Each panel: top face at +T/2, bottom at −T/2. Bottom leading-edge vertices are
  // pulled back and bottom trailing-edge vertices pushed forward, so the front and
  // back edges are sloped wedges instead of flat vertical walls.
  const SLOPE = 0.06;
  const slab = (pts, name) => {
    const hi = pts.map(([x, z]) => V3(x, T(x) / 2, z));
    const lo = pts.map(([x, z]) => {
      const onLE = Math.abs(z - LE(x)) < 1e-6;
      return V3(x, -T(x) / 2, z + (onLE ? -SLOPE : SLOPE));
    });
    add(loftRings([lo, hi]), skinMat, name);
  };

  // Wing panels (each convex) — centre + three per side; seams read as cardboard panels
  slab([[0, 1.0], [0.34, LE(0.34)], [0.34, -0.36], [0, -0.62], [-0.34, -0.36], [-0.34, LE(0.34)]], 'CentrePanel');
  [-1, 1].forEach((s, i) => {
    const m = pts => pts.map(([x, z]) => [s * x, z]);
    slab(m([[0.34, LE(0.34)], [0.68, LE(0.68)], [0.68, -0.64], [0.34, -0.36]]), `InnerPanel_${i}`);
    slab(m([[0.68, LE(0.68)], [1.30, LE(1.30)], [1.30, -0.16], [0.68, -0.64]]), `MidPanel_${i}`);
    slab(m([[1.30, LE(1.30)], [2.50, LE(2.50)], [2.50, -0.95], [1.30, -0.16]]), `OuterPanel_${i}`);   // deeper outer chord
  });

  // Raised humps: profile rings sitting on the wing's top surface
  const hump = (cx, z, w, h) => {
    const by = T(cx) / 2 - 0.01;
    return [[-w, 0], [-w * 0.7, h * 0.85], [0, h], [w * 0.7, h * 0.85], [w, 0]].map(([x, y]) => V3(cx + x, by + y, z));
  };
  const cockpit = [hump(0, -0.40, 0.26, 0.08), hump(0, 0.0, 0.32, 0.17), hump(0, 0.55, 0.30, 0.17), hump(0, 0.85, 0.14, 0.05)];
  add(loftRings(cockpit, { tipBack: V3(0, T(0) / 2, -0.62), tipFront: V3(0, T(0) / 2, 0.98) }), skinMat, 'CockpitHump');

  // Cockpit windows: dark panes on the upper facets of the hump's front slope
  const lerpRing = (A, B, u) => A.map((p, k) => p.clone().lerp(B[k], u));
  const a = lerpRing(cockpit[3], cockpit[2], 0.25), b = lerpRing(cockpit[3], cockpit[2], 0.85);
  [0, 1, 2, 3].forEach(k => {
    const quad = [a[k], a[k + 1], b[k + 1], b[k]];
    const c = ringCentre(quad);
    const n = V3().subVectors(quad[1], quad[0]).cross(V3().subVectors(quad[3], quad[0])).normalize();
    if (n.y < 0) n.negate();
    const q = quad.map(p => p.clone().lerp(c, 0.14));
    add(prism(q, n, 0.02), K.canopyMat, `Window_${k}`);      // 0.01 proud, 0.01 sunk into the hump
  });

  // Engine humps with forward-facing dark intakes; their tails sink into the wing
  [-1, 1].forEach((s, i) => {
    const cx = s * 0.58;
    addIntake(K, [hump(cx, -0.30, 0.14, 0.05), hump(cx, -0.05, 0.20, 0.11), hump(cx, 0.32, 0.20, 0.11)], `EngineHump_${i}`,
      { tipBack: V3(cx, T(cx) / 2 - 0.02, -0.46) });
  });

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.set(0, 0.08, -0.62); flight.add(ex);
  K.root.userData.fx = buildFlightFx(flight, { nozzles: [], tips: [[2.5, 0, -0.95], [-2.5, 0, -0.95]] });   // wind lines only
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Specter (RQ-4 Global Hawk-inspired surveillance drone)
   Bulbous windowless nose, slim body, a big engine pod on top at the
   back, very long thin wings with slight dihedral and a V-tail.
------------------------------------------------------------------ */
const SPECTER_BODY = [
  { z: -1.30, ht: 0.09, sh: [0.07, 0.08], wall: [0.10, 0.03, -0.02], bot: [0.07, -0.07] },
  { z: -0.60, ht: 0.14, sh: [0.11, 0.12], wall: [0.15, 0.04, -0.05], bot: [0.10, -0.12] },
  { z:  0.20, ht: 0.16, sh: [0.12, 0.14], wall: [0.17, 0.04, -0.08], bot: [0.12, -0.15] },
  { z:  0.75, ht: 0.25, sh: [0.18, 0.22], wall: [0.24, 0.06, -0.10], bot: [0.17, -0.18] },
  { z:  1.15, ht: 0.26, sh: [0.19, 0.23], wall: [0.25, 0.06, -0.10], bot: [0.18, -0.18] },
  { z:  1.40, ht: 0.19, sh: [0.15, 0.17], wall: [0.20, 0.04, -0.08], bot: [0.14, -0.14] },
  { z:  1.52, ht: 0.10, sh: [0.08, 0.09], wall: [0.11, 0.01, -0.05], bot: [0.08, -0.08] },
];

function buildSpecter(skin = 'cardboard') {
  const K = planeKit('Specter', skin, 0x3c3f45);
  const { add, skinMat, flight } = K;

  add(loftRings(SPECTER_BODY.map(bodyRing), { tipFront: V3(0, -0.02, 1.58), tipBack: V3(0, 0.02, -1.45) }), skinMat, 'Fuselage');

  // Engine pod on top, round intake at the front
  addIntake(K, [octRing(0, 0.27, -1.18, 0.10), octRing(0, 0.27, -0.95, 0.145), octRing(0, 0.27, -0.25, 0.16), octRing(0, 0.27, 0.12, 0.135)], 'EnginePod');
  addOctNozzle(K, 0, 0.27, -1.18, 0.08, 0.10, 0.085, 'Nozzle');

  // Very long, thin, tapered wings with a little dihedral
  [-1, 1].forEach((s, i) => {
    const o = [[0, 0.35], [2.78, 0.06], [2.78, -0.09], [0, -0.06]].map(([x, z]) => V3(s * x, 0, z));
    const w = add(bevelSlab(o, V3(0, 1, 0), [0.07, 0.025, 0.025, 0.07], 0.012), skinMat, `Wing_${i}`);
    w.position.set(s * 0.12, 0.04, 0);
    w.rotation.z = s * 0.05;
  });

  // V-tail
  [-1, 1].forEach((s, i) => {
    const o = [[-0.82, -0.06], [-1.16, 0.52], [-1.32, 0.52], [-1.40, -0.06]].map(([z, y]) => V3(0, y, z));
    const f = add(bevelSlab(o, V3(1, 0, 0), [0.06, 0.035, 0.035, 0.06], 0.015), skinMat, `Fin_${i}`);
    f.position.set(s * 0.05, 0.10, 0);
    f.rotation.z = -s * 0.85;
  });

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.set(0, 0.27, -1.3); flight.add(ex);
  K.root.userData.fx = buildFlightFx(flight, { nozzles: [], tips: [[2.9, 0.18, -0.1], [-2.9, 0.18, -0.1]] });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Model: Lancer (B-1B Lancer-inspired supersonic bomber)
   Long blended body with a drooped nose and dark cockpit, wide fixed
   wing gloves, swing wings on pivots (WingSweep_L/R, rotation.y), four
   engines in two pairs under the gloves, a tall fin with tail planes
   mounted half-way up it.
------------------------------------------------------------------ */
const LANCER_BODY = [
  { z: -2.05, ht: 0.16, sh: [0.12, 0.14], wall: [0.18, 0.04, -0.04], bot: [0.12, -0.12] },
  { z: -1.30, ht: 0.22, sh: [0.18, 0.20], wall: [0.30, 0.05, -0.06], bot: [0.20, -0.16] },
  { z: -0.50, ht: 0.25, sh: [0.22, 0.22], wall: [0.40, 0.04, -0.06], bot: [0.24, -0.18] },
  { z:  0.40, ht: 0.26, sh: [0.20, 0.23], wall: [0.32, 0.04, -0.07], bot: [0.20, -0.18] },
  { z:  1.20, ht: 0.22, sh: [0.15, 0.20], wall: [0.22, 0.05, -0.08], bot: [0.15, -0.16] },
  { z:  1.90, ht: 0.15, sh: [0.11, 0.13], wall: [0.15, 0.02, -0.06], bot: [0.10, -0.11] },
  { z:  2.25, ht: 0.07, sh: [0.05, 0.06], wall: [0.07, 0.00, -0.04], bot: [0.05, -0.06] },
];
const LANCER_NOSE = [0, -0.05, 2.42];

function buildLancer(skin = 'cardboard') {
  const K = planeKit('Lancer', skin, 0x3c3f45);
  const { add, skinMat, flight } = K;
  const topAt = z => stationTopAt(LANCER_BODY, LANCER_NOSE, z);

  add(loftRings(LANCER_BODY.map(bodyRing), { tipFront: V3(...LANCER_NOSE), tipBack: V3(0, 0.03, -2.3) }), skinMat, 'Fuselage');

  // Small dark cockpit windows
  const cRing = (z, w, h) => {
    const by = topAt(z) - 0.04;
    return [[-w, 0], [-w * 0.7, h * 0.85], [0, h], [w * 0.7, h * 0.85], [w, 0]].map(([x, y]) => V3(x, by + y, z));
  };
  add(loftRings([cRing(1.55, 0.13, 0.07), cRing(1.78, 0.11, 0.06)], {
    tipBack: V3(0, topAt(1.35) + 0.005, 1.35), tipFront: V3(0, topAt(1.98) - 0.005, 1.98),
  }), K.canopyMat, 'Canopy');

  // Fixed wing gloves blending out of the body
  [-1, 1].forEach((s, i) => {
    const o = [[0.30, 0.70], [0.92, -0.45], [0.92, -0.80], [0.30, -1.05]].map(([x, z]) => V3(s * x, 0.02, z));
    add(bevelSlab(o, V3(0, 1, 0), [0.11, 0.09, 0.09, 0.11], 0.025), skinMat, `Glove_${i}`);
  });

  // Swing wings: pivots near the glove tips; rotation 0 = fully spread
  const sweep = [];
  [-1, 1].forEach((s, i) => {
    const pivot = new THREE.Group(); pivot.name = `WingSweep_${s < 0 ? 'L' : 'R'}`;
    pivot.position.set(s * 0.74, 0.02, -0.55);
    pivot.userData.joint = { type: 'rotate', axis: 'y', min: s < 0 ? -1.0 : 0, max: s < 0 ? 0 : 1.0, label: 'Wing sweep',
      note: '0 = spread (take-off, cruise), ±1.0 = swept back (high speed). Both wings together, mirrored.' };
    flight.add(pivot);
    const o = [[-0.02, 0.14], [1.70, -0.14], [1.70, -0.33], [-0.02, -0.26]].map(([x, z]) => V3(s * x, 0, z));
    add(bevelSlab(o, V3(0, 1, 0), [0.06, 0.03, 0.03, 0.06], 0.015), skinMat, `Wing_${i}`, true, pivot);
    sweep.push([pivot, s]);
  });
  K.root.userData.sweep = sweep;

  // Four engines in two pairs under the gloves, box intakes, round nozzles
  const rect = (cx, cy, z, w, h) => [[-w, -h * 0.6], [-w * 0.6, -h], [w * 0.6, -h], [w, -h * 0.6], [w, h * 0.6], [w * 0.6, h], [-w * 0.6, h], [-w, h * 0.6]]
    .map(([x, y]) => V3(cx + x, cy + y, z));
  const nozzles = [];
  [-1, 1].forEach((s, i) => [0.36, 0.56].forEach((px, j) => {
    const cx = s * px, cy = -0.17;
    addIntake(K, [rect(cx, cy, -1.40, 0.085, 0.09), rect(cx, cy, -0.9, 0.095, 0.10), rect(cx, cy, -0.25, 0.095, 0.10)], `Engine_${i}_${j}`);
    nozzles.push(addOctNozzle(K, cx, cy, -1.40, 0.12, 0.09, 0.08, `Nozzle_${i}_${j}`));
  }));

  // Tall fin + tail planes half-way up it
  {
    const o = [[-1.32, -0.06], [-1.96, 0.88], [-2.22, 0.88], [-2.32, -0.06]].map(([z, y]) => V3(0, y, z));
    add(bevelSlab(o, V3(1, 0, 0), [0.09, 0.05, 0.05, 0.09], 0.022), skinMat, 'Fin').position.y = 0.16;
  }
  addStabilisers(K, [[0.04, -1.80], [0.86, -2.08], [0.86, -2.24], [0.04, -2.30]], 0.48, [0.06, -2.05], [0.06, 0.035, 0.035, 0.06]);

  const ex = new THREE.Object3D(); ex.name = 'exhaust_point'; ex.position.set(0, -0.17, -1.6); flight.add(ex);
  const tips = sweep.map(([p, s]) => [s * 1.70, 0, -0.33, p]);       // wind lines ride on the swing wings
  K.root.userData.fx = buildFlightFx(flight, { nozzles, tips });
  finishPart(K.root);
  return K.root;
}

/* ------------------------------------------------------------------
   Scene
------------------------------------------------------------------ */
const host = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
const IS_MOBILE = matchMedia('(max-width: 820px), (pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.5 : 2));
// If the browser drops the GL context (memory pressure), let three.js restore it
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('3D view paused — restoring…'); });
renderer.domElement.addEventListener('webglcontextrestored', () => toast('3D view restored'));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function disposeObject(o) {
  o.traverse(n => {
    n.geometry?.dispose?.();
    const m = n.material; if (!m) return;
    (Array.isArray(m) ? m : [m]).forEach(mm => { if (mm.userData?.shared) return; if (!mm.map?.userData?.shared) mm.map?.dispose?.(); mm.dispose(); });
  });
}

function computeFit(obj) {
  const box = solidBox(obj);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = sphere.radius;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.12;
  return { target: sphere.center.clone(), dist, radius: r };
}

function resetView() {
  const el = THREE.MathUtils.degToRad(22), az = THREE.MathUtils.degToRad(35);
  camera.position.set(
    fit.target.x + fit.dist * Math.cos(el) * Math.sin(az),
    fit.target.y + fit.dist * Math.sin(el),
    fit.target.z + fit.dist * Math.cos(el) * Math.cos(az)
  );
  controls.target.copy(fit.target);
  controls.update();
}

function countTris(obj) {
  let t = 0;
  obj.traverse(o => {
    if (o.isMesh && !o.userData.helper) {
      const g = o.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  return t;
}

let currentVariant;
function selectModel(id, variant) {
  const def = MODELS.find(m => m.id === id) || MODELS[0];
  const vs = def.variants || [];
  currentVariant = vs.length ? (vs.some(v => v.id === variant) ? variant : vs[0].id) : undefined;
  controller?.dispose?.(); controller = null;
  if (current) { stage.remove(current); disposeObject(current); }
  current = def.build(currentVariant);
  currentDef = def;
  stage.add(current);
  liftToGround(stage, current);
  stage.position.y += def.hover || 0;               // planes float above the ground
  controller = def.controller ? def.controller(current) : null;
  renderProps(def);
  renderGuide();
  fit = computeFit(current);
  resetView();

  document.getElementById('modelTitle').textContent = def.name;
  document.getElementById('modelKicker').textContent = def.kicker || 'Model';
  document.getElementById('modelDesc').textContent = def.description || '';
  const specs = { ...def.specs };
  if (def.kind === 'part') {
    specs.Joint = def.joint || 'Static';
    specs['Plugs into'] = def.plugsInto || '—';
    specs.Sockets = (def.sockets || []).map(n => `socket_${n}`).join(', ') || '—';
  } else if (def.parts) {
    specs.Parts = (def.partsFor ? def.partsFor(currentVariant) : def.parts).map(p => MODELS.find(m => m.id === p.model).name).join(' › ');
  }
  specs.Triangles = countTris(current).toLocaleString();
  document.getElementById('modelSpecs').innerHTML =
    Object.entries(specs).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  const nv = (def.variants || []).length, np = Object.keys(def.properties || {}).length;
  document.getElementById('variantsBox').textContent =
    nv || np ? [nv && `${nv} ${(def.variantLabel || 'level').toLowerCase()}s (now: ${def.variants.find(v => v.id === currentVariant)?.label})`, np && `${np} properties`].filter(Boolean).join(' · ') : 'None yet';
  document.querySelectorAll('.model-item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === def.id)));
  // Phones: details live at the top of the guide sheet; keep the chosen chip in view
  document.getElementById('guideAbout').innerHTML =
    `<p style="margin:0">${esc(def.description || '')}</p><dl class="specs">${document.getElementById('modelSpecs').innerHTML}</dl>`;
  const chip = document.querySelector(`.model-item[data-id="${def.id}"]`);
  if (chip && matchMedia('(max-width:820px)').matches) chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  try { localStorage.setItem('aircraftlab:model', def.id); } catch {}
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  setPencilResolution(w, h);
}

const clock = new THREE.Clock();
function liftToGround(wrapper, obj) {
  wrapper.position.y = 0; wrapper.updateMatrixWorld(true);
  const box = solidBox(obj);
  wrapper.position.y = box.min.y < 0 ? -box.min.y : 0;
}
function restJoints(obj) {
  obj?.traverse(o => {
    const j = o.userData.joint; if (!j) return;
    if (j.type === 'translate') o.position[j.axis] = 0;
    else if (j.type === 'scale') o.scale[j.axis] = 1;
    else o.rotation[j.axis] = 0;
  });
}
function applyJoints(t) {
  current?.traverse(o => {
    const j = o.userData.joint;
    if (!j || j.type === 'scale') return;
    if (j.type === 'translate') {       // recoil-style: kick at 2.5/s, ease back
      const ph = (t % 0.4) / 0.4;
      o.position[j.axis] = ph < 0.12 ? j.min * ph / 0.12 : j.min * Math.pow(1 - (ph - 0.12) / 0.88, 3);
      return;
    }
    if (j.min !== undefined) {          // limited joint (pitch): ease between limits
      const u = (Math.sin(t * 0.8 + 1) + 1) / 2;
      o.rotation[j.axis] = j.min + (j.max - j.min) * u;
    } else {                            // free yaw: sweep like tracking a target
      o.rotation[j.axis] = Math.sin(t * 0.9) * 1.3 + Math.sin(t * 0.37) * 0.6;
    }
  });
}
const hud = document.getElementById('hud');
let wasAnimating = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (controller?.independent) controller.update(dt);
  else if (animateJoints) {
    if (controller) controller.update(dt); else applyJoints(clock.elapsedTime);
  } else if (wasAnimating) { restJoints(current); controller?.reset(); }
  wasAnimating = animateJoints;
  const label = (animateJoints || controller?.independent) && controller ? controller.state : '';
  if (hud.dataset.label !== label) {
    hud.dataset.label = label;
    hud.textContent = label;
    hud.className = 'hud' + (label ? ' on' : '') + (/^(Locked|Firing)/.test(label) ? ' hot' : '');
  }
  controls.update();
  renderer.render(scene, camera);
});

/* ------------------------------------------------------------------
   Offscreen rendering (thumbnails + 4-angle sheet)
------------------------------------------------------------------ */
// ONE offscreen renderer, reused for thumbnails and screenshots. Creating a
// renderer per thumbnail exhausted phones' WebGL context limit and killed
// the main viewer (models didn't render on mobile).
let offscreen = null;
function getOffscreen() {
  if (!offscreen) {
    offscreen = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    offscreen.setPixelRatio(1);
    offscreen.outputColorSpace = THREE.SRGBColorSpace;
    offscreen.shadowMap.enabled = true; offscreen.shadowMap.type = THREE.PCFSoftShadowMap;
  }
  return offscreen;
}
function renderAngles(obj, angles, size, bg) {
  const r = getOffscreen();
  r.setSize(size, size, false);
  setPencilResolution(size, size, Math.max(1, size / 600));
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = renderer.toneMapping; r.toneMappingExposure = renderer.toneMappingExposure;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  const f = computeFit(obj);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
  const dist = f.radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.08;
  const el = THREE.MathUtils.degToRad(14);
  const prevBg = scene.background;
  scene.background = bg ? new THREE.Color(bg) : null;
  const shown = [];
  const markers = [];
  scene.traverse(o => { if (o.userData.socketMarker) { markers.push([o, o.visible]); o.visible = false; } });
  if (!stage.getObjectById(obj.id) && obj !== stage) { shown.push([stage, stage.visible]); stage.visible = false; }
  const out = angles.map(a => {
    const az = THREE.MathUtils.degToRad(a);
    cam.position.set(f.target.x + dist * Math.cos(el) * Math.sin(az), f.target.y + dist * Math.sin(el), f.target.z + dist * Math.cos(el) * Math.cos(az));
    cam.lookAt(f.target);
    r.render(scene, cam);
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(r.domElement, 0, 0);
    return c;
  });
  shown.forEach(([c, v]) => c.visible = v);
  markers.forEach(([o, v]) => o.visible = v);
  scene.background = prevBg;
  setPencilResolution(host.clientWidth, host.clientHeight);
  return out;
}

async function screenshotSheet() {
  const size = 900, labels = ['FRONT', 'RIGHT', 'BACK', 'LEFT'];
  const frames = renderAngles(current, [0, 90, 180, 270], size, '#2a2928');
  const sheet = document.createElement('canvas');
  sheet.width = size * 4; sheet.height = size;
  const g = sheet.getContext('2d');
  g.fillStyle = '#2a2928'; g.fillRect(0, 0, sheet.width, sheet.height);
  frames.forEach((c, i) => {
    g.drawImage(c, i * size, 0);
    g.fillStyle = 'rgba(236,230,223,.45)';
    g.font = '500 20px "JetBrains Mono", monospace';
    g.textAlign = 'center';
    g.fillText(labels[i], i * size + size / 2, size - 34);
  });
  return new Promise(res => sheet.toBlob(res, 'image/png'));
}

/* ------------------------------------------------------------------
   GLB export (packed into a .zip — .glb isn't an allowed download type)
------------------------------------------------------------------ */
async function exportGLB(obj) {
  const clone = obj.clone(true);
  const strip = [];
  clone.traverse(o => { if (o.userData.helper) strip.push(o); });
  strip.forEach(o => o.parent.remove(o));
  restJoints(clone);                                   // export in rest pose
  clone.traverse(o => {                                // lights off in the file
    if (o.material?.userData?.exportOff) {
      const m = o.material.clone(); m.emissiveIntensity = 0; o.material = m;
    }
  });
  clone.position.set(0, clone.position.y, 0);
  const exporter = new GLTFExporter();
  return exporter.parseAsync(clone, { binary: true, onlyVisible: true });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files) { // [{name, data:Uint8Array}] – stored, no compression
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

  if (i >= MODELS.length) return;
  setTimeout(() => {
    const def = MODELS[i];
    try {
      const obj = def.build();
      const wrap = new THREE.Group(); wrap.add(obj); scene.add(wrap);

    thumbs(i + 1);

})();

/* ------------------------------------------------------------------
   Assembly guide (generated from the built hierarchy + model notes)
------------------------------------------------------------------ */
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
const guideEl = document.getElementById('guide');
const btnGuide = document.getElementById('btnGuide');

function hierarchyLines(obj) {
  const lines = [];
  const interesting = o => o.userData.part || o.userData.socket || o.userData.joint || o.name === 'muzzle_point' || o.name === 'exhaust_point' || o.name === 'beam_point' || o.name === 'smoke_point';
  const label = o => {
    const j = o.userData.joint;
    let tag = '';
    if (o.userData.socket) tag = '<span class="s">  socket</span>';
    else if (o.name === 'muzzle_point') tag = '<span class="s">  shot spawn point</span>';
    else if (o.name === 'exhaust_point') tag = '<span class="s">  smoke spawn point</span>';
    else if (o.name === 'beam_point') tag = '<span class="s">  beam / ping point</span>';
    else if (o.name === 'smoke_point') tag = '<span class="s">  smoke spawn point</span>';
    if (j) tag += `<span class="j">  ← ${esc(j.label || 'Joint')}: ${j.type === 'translate' ? 'position' : 'rotation'}.${j.axis}</span>`;
    else if (o.userData.part) tag += '<span class="s">  part root</span>';
    return esc(o.name) + tag;
  };
  const walk = (o, prefix, isLast, isRoot) => {
    if (interesting(o) || isRoot) {
      lines.push(isRoot ? label(o) : prefix + (isLast ? '└─ ' : '├─ ') + label(o));
      prefix = isRoot ? '' : prefix + (isLast ? '   ' : '│  ');
    }
    const kids = [];
    const collect = c => { if (interesting(c)) kids.push(c); else c.children.forEach(collect); };
    if (interesting(o) || isRoot) o.children.forEach(collect);
    kids.forEach((k, i) => walk(k, prefix, i === kids.length - 1, false));
  };
  walk(obj, '', true, true);
  return lines.join('\n');
}

function jointRows(obj) {
  const rows = [];
  obj.traverse(o => {
    const j = o.userData.joint; if (!j) return;
    const prop = ({ translate: 'position.', scale: 'scale.' }[j.type] || 'rotation.') + j.axis;
    let range = 'free';
    if (j.min !== undefined) range = j.type !== 'rotate'
      ? `${j.min} … ${j.max}`
      : `${j.min} … ${j.max} rad (${Math.round(j.min * 57.3)}° … ${Math.round(j.max * 57.3)}°)`;
    rows.push(`<tr><td><code>${esc(o.name)}</code></td><td>${prop}</td><td>${esc(range)}</td><td class="note">${esc(j.note || '')}</td></tr>`);
  });
  return rows.join('');
}

function renderGuide() {
  const def = currentDef;
  document.getElementById('guideTitle').textContent = def.name;
  let html = `<h4>Hierarchy</h4><pre>${hierarchyLines(current)}</pre>`;
  const jr = jointRows(current);
  html += jr
    ? `<h4>Moving nodes</h4><table><thead><tr><th>Node</th><th>Property</th><th>Range</th><th></th></tr></thead><tbody>${jr}</tbody></table>`
    : `<h4>Moving nodes</h4><p class="note">None — this part is static.</p>`;
  if (def.kind === 'part') {
    html += `<h4>Attaching</h4><ol>`;
    html += def.plugsInto ? `<li>Parent this part's root (<code>${esc(current.name)}</code>) to <code>${esc(def.plugsInto.split('→ ')[1])}</code> on <b>${esc(MODELS.find(m => def.plugsInto.startsWith(m.id))?.name || '')}</b>.</li><li>Keep its local position and rotation at 0 and scale at 1.</li>` : `<li>This is the root part. Place it on the ground; its origin is at ground level.</li>`;
    if ((def.sockets || []).length) html += `<li>Next parts attach to: ${def.sockets.map(n => `<code>socket_${esc(n)}</code>`).join(', ')}.</li>`;
    html += `</ol>`;
  }
  if (def.levelNotes) {
    html += `<h4>Levels</h4><table><tbody>${Object.entries(def.levelNotes).map(([k, v]) =>
      `<tr><td><b>${k == currentVariant ? '▸ ' : ''}Level ${esc(k)}</b></td><td class="note">${esc(v)}</td></tr>`).join('')}</tbody></table>`;
  }
  const g = def.guide;
  if (g) {
    if (g.assemble) html += `<h4>How to assemble</h4><ol>${g.assemble.map(x => `<li>${x}</li>`).join('')}</ol>`;
    if (g.animate) html += `<h4>How to animate</h4><table><thead><tr><th>Node</th><th>Property</th><th>Range</th><th>Rule</th></tr></thead><tbody>${
      g.animate.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="note">${esc(r[3])}</td></tr>`).join('')}</tbody></table>`;
    if (g.behaviour) html += `<h4>Behaviour loop</h4><table><tbody>${
      g.behaviour.map(r => `<tr><td><b>${esc(r[0])}</b></td><td class="note">${esc(r[1])}</td></tr>`).join('')}</tbody></table>`;
    if (g.code) html += `<h4>Reference code (three.js-style)</h4><pre>${esc(g.code)}</pre>
      <p class="note" style="margin-top:8px">Joint data (type, axis, limits) is also stored in each joint node's glTF <code>extras</code>, so your loader can read it instead of hard-coding.</p>`;
  }
  document.getElementById('guideBody').innerHTML = html;
}

function setGuide(open) {
  guideEl.hidden = !open;
  btnGuide.setAttribute('aria-expanded', String(open));
}
btnGuide.addEventListener('click', () => setGuide(guideEl.hidden));
document.getElementById('btnGuideClose').addEventListener('click', () => setGuide(false));


/* ------------------------------------------------------------------
   Properties (per-model toggles, e.g. Workshop smoke/lights/door)
------------------------------------------------------------------ */
function fileBase() {
  if (currentVariant === undefined) return currentDef.id;
  return currentDef.id + (currentDef.variantLabel ? `-${currentVariant}` : `-level${currentVariant}`);
}
function renderProps(def) {
  const card = document.getElementById('propsCard'), listEl = document.getElementById('propsList');
  const entries = Object.entries(def.properties || {});
  const vs = def.variants || [];
  card.hidden = !entries.length && !vs.length;
  card.querySelector('.k').textContent = vs.length && !entries.length ? (def.variantLabel || 'Level') : 'Properties';
  listEl.innerHTML = '';
  if (vs.length) {
    const seg = document.createElement('div');
    seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', def.variantLabel || 'Level');
    vs.forEach(v => {
      const b = document.createElement('button');
      b.textContent = v.label.replace('Level ', 'L');
      b.title = v.label;
      b.setAttribute('aria-pressed', String(v.id === currentVariant));
      b.addEventListener('click', () => { if (v.id !== currentVariant) selectModel(def.id, v.id); });
      seg.appendChild(b);
    });
    listEl.appendChild(seg);
    const note = def.levelNotes?.[currentVariant];
    if (note) { const n = document.createElement('p'); n.className = 'seg-note'; n.textContent = note; listEl.appendChild(n); }
  }
  entries.forEach(([key, p]) => {
    let on = !!p.default;
    controller?.setProp?.(key, on);
    const b = document.createElement('button');
    b.className = 'btn toggle'; b.setAttribute('aria-pressed', String(on));
    b.innerHTML = '<span class="lbl"></span><span class="pill"></span>';
    b.querySelector('.lbl').textContent = p.label;
    b.addEventListener('click', () => {
      on = !on; b.setAttribute('aria-pressed', String(on));
      controller?.setProp?.(key, on);
    });
    listEl.appendChild(b);
  });
}

// Downloads via the artifact runtime
const btnGlb = document.getElementById('btnGlb');
const btnShots = document.getElementById('btnShots');
let downloads = null;

async function save(filename, data) {
  if (!downloads) { toast('Downloads aren’t available in this view'); return; }
  try {
    const r = await downloads.save({ filename, data });
    if (r?.status === 'saved') toast(`Saved ${filename}`);
  } catch (err) {
    if (err?.code === 'declined') toast('Download cancelled');
    else if (err?.code === 'rate_limited') toast('A download prompt is already open');
    else toast('Couldn’t save the file');
  }
}

btnGlb.addEventListener('click', async () => {
  btnGlb.disabled = true;
  try {
    controller?.reset?.();                              // rockets back in their tubes
    const glb = new Uint8Array(await exportGLB(current));
    const zip = makeZip([{ name: `${fileBase()}.glb`, data: glb }]);
    await save(`${fileBase()}-glb.zip`, zip);
  } catch (e) { console.error(e); toast('Export failed'); }
  btnGlb.disabled = !downloads;
});

btnShots.addEventListener('click', async () => {
  btnShots.disabled = true;
  try { await save(`${fileBase()}-4-angles.png`, await screenshotSheet()); }
  catch (e) { console.error(e); toast('Screenshot failed'); }
  btnShots.disabled = !downloads;
});

(async () => {
  for (let i = 0; i < 50 && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 200));
  try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch { downloads = null; }
  btnGlb.disabled = btnShots.disabled = !downloads;
  if (!downloads) { btnGlb.title = btnShots.title = 'Downloads aren’t available in this view'; }
})();

// expose for quick testing
window.__aircraftLab = { get current() { return current; }, camera, controls, MODELS, selectModel, exportGLB, screenshotSheet, makeZip };
</script>
