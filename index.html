<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paperwars.io · v0.0.4</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bcdbf5;
      }
      canvas#game {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      .boot-error {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 600 18px/1.4 system-ui, sans-serif;
        color: #1f2937;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
